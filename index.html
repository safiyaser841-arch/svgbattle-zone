<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Battle Zone</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#07111f;
    color:white;
    touch-action:none;
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
    border:0;
}

.screen{
    position:fixed;
    inset:0;
}

#menu{
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at center,#164e70 0%,#07111f 55%,#02060b 100%);
}

.menuBox{
    width:min(500px,92vw);
    background:rgba(10,20,32,.97);
    border:1px solid #334155;
    border-radius:22px;
    padding:28px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.logo{
    font-size:clamp(38px,10vw,60px);
    font-weight:900;
    color:#38bdf8;
    margin-bottom:5px;
}

.subtitle{
    color:#94a3b8;
    margin-bottom:22px;
}

.input,
.select{
    width:100%;
    padding:13px;
    margin:6px 0;
    border-radius:10px;
    border:1px solid #334155;
    background:#111827;
    color:white;
    outline:none;
}

.button{
    width:100%;
    padding:13px;
    margin-top:8px;
    border-radius:10px;
    color:white;
    background:linear-gradient(135deg,#38bdf8,#2563eb);
    font-weight:bold;
}

.button.dark{
    background:#1e293b;
}

.info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-bottom:10px;
}

.info div{
    background:#0f172a;
    padding:10px 5px;
    border-radius:9px;
    font-size:12px;
}

.info b{
    display:block;
    color:#38bdf8;
    margin-top:4px;
}

#lobby,
#game{
    display:none;
}

#lobby{
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle,#164e70,#02060b);
}

.lobbyBox{
    width:min(850px,94vw);
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    padding:20px;
    border-radius:20px;
    background:#0b1420;
}

.character{
    min-height:400px;
    border-radius:15px;
    background:radial-gradient(circle,#315d7a,#08101a);
    display:flex;
    justify-content:center;
    align-items:center;
}

.playerPreview{
    width:100px;
    height:130px;
    background:#38bdf8;
    border-radius:35px 35px 20px 20px;
    position:relative;
    box-shadow:0 15px 35px rgba(0,0,0,.5);
}

.playerPreview:before{
    content:"";
    position:absolute;
    width:65px;
    height:65px;
    background:#f1c6a6;
    border-radius:50%;
    left:18px;
    top:-50px;
}

.lobbyInfo{
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:10px;
}

.roomCode{
    font-size:45px;
    font-weight:bold;
    letter-spacing:7px;
    color:#38bdf8;
    text-align:center;
}

#game{
    background:#203b25;
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

.hud{
    position:fixed;
    top:8px;
    left:8px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    z-index:10;
}

.hudBox{
    background:rgba(0,0,0,.7);
    border:1px solid #334155;
    padding:8px 10px;
    border-radius:8px;
    font-size:13px;
}

#healthBar{
    position:fixed;
    top:55px;
    left:10px;
    width:220px;
    height:13px;
    background:#3f1010;
    border-radius:10px;
    overflow:hidden;
    z-index:10;
}

#healthFill{
    width:100%;
    height:100%;
    background:#22c55e;
}

#joystick{
    display:none;
    position:fixed;
    left:20px;
    bottom:20px;
    width:145px;
    height:145px;
    border-radius:50%;
    background:rgba(255,255,255,.12);
    border:2px solid rgba(255,255,255,.25);
    z-index:20;
}

#stick{
    position:absolute;
    width:60px;
    height:60px;
    left:40px;
    top:40px;
    border-radius:50%;
    background:rgba(255,255,255,.55);
}

#shoot{
    display:none;
    position:fixed;
    right:25px;
    bottom:30px;
    width:100px;
    height:100px;
    border-radius:50%;
    background:#ef4444;
    border:4px solid white;
    color:white;
    font-size:28px;
    z-index:20;
}

#gameOver{
    display:none;
    position:fixed;
    inset:0;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.75);
    z-index:30;
}

.gameOverBox{
    width:min(400px,90vw);
    padding:30px;
    background:#0f172a;
    border-radius:20px;
    text-align:center;
}

@media(pointer:coarse){
    #joystick,
    #shoot{
        display:block;
    }

    .lobbyBox{
        grid-template-columns:1fr;
    }

    .character{
        min-height:230px;
    }
}

@media(max-width:650px){
    .menuBox{
        padding:20px;
    }

    .logo{
        font-size:38px;
    }
}

@media(orientation:portrait) and (pointer:coarse){
    #game:after{
        content:"Bitte Handy drehen ↔️";
        position:fixed;
        inset:0;
        display:flex;
        align-items:center;
        justify-content:center;
        background:#02060b;
        z-index:100;
        font-size:25px;
        font-weight:bold;
    }
}
</style>
</head>

<body>

<!-- ================= MENU ================= -->

<div id="menu" class="screen">

    <div class="menuBox">

        <div class="logo">⚡ BATTLE ZONE</div>
        <div class="subtitle">Simple Multiplayer Arena</div>

        <div class="info">
            <div>
                🏆 Trophäen
                <b id="trophies">0</b>
            </div>

            <div>
                💀 Kills
                <b id="kills">0</b>
            </div>

            <div>
                👤 Spieler
                <b id="playerNameDisplay">Player</b>
            </div>
        </div>

        <input
            id="name"
            class="input"
            maxlength="15"
            placeholder="Dein Name"
        >

        <select id="difficulty" class="select">
            <option value="easy">🟢 Leicht</option>
            <option value="medium" selected>🟡 Mittel</option>
            <option value="hard">🔴 Schwer</option>
        </select>

        <select id="bots" class="select">
            <option value="0">0 Bots</option>
            <option value="1">1 Bot</option>
            <option value="2" selected>2 Bots</option>
            <option value="3">3 Bots</option>
            <option value="4">4 Bots</option>
            <option value="5">5 Bots</option>
        </select>

        <button id="create" class="button">
            🎮 LOBBY ERSTELLEN
        </button>

        <input
            id="room"
            class="input"
            maxlength="4"
            placeholder="Raumcode"
        >

        <button id="join" class="button dark">
            👥 LOBBY BEITRETEN
        </button>

    </div>

</div>


<!-- ================= LOBBY ================= -->

<div id="lobby" class="screen">

    <div class="lobbyBox">

        <div class="character">
            <div class="playerPreview"></div>
        </div>

        <div class="lobbyInfo">

            <h1>⚡ Battle Zone</h1>

            <div>
                Spieler:
                <b id="lobbyName">Player</b>
            </div>

            <div>
                Schwierigkeit:
                <b id="lobbyDifficulty">Mittel</b>
            </div>

            <div>
                Bots:
                <b id="lobbyBots">2</b>
            </div>

            <div>
                Raumcode:
            </div>

            <div id="code" class="roomCode">
                ----
            </div>

            <button id="copy" class="button">
                📋 CODE KOPIEREN
            </button>

            <button id="play" class="button">
                ▶ SPIEL STARTEN
            </button>

            <button id="back" class="button dark">
                ← ZURÜCK
            </button>

        </div>

    </div>

</div>


<!-- ================= GAME ================= -->

<div id="game" class="screen">

    <canvas id="canvas"></canvas>

    <div class="hud">

        <div class="hudBox">
            🏠 <span id="hudRoom">----</span>
        </div>

        <div class="hudBox">
            ❤️ <span id="hp">100</span>
        </div>

        <div class="hudBox">
            🛡️ <span id="shield">50</span>
        </div>

        <div class="hudBox">
            🔫 <span id="weapon">Pistole</span>
        </div>

        <div class="hudBox">
            💀 <span id="gameKills">0</span>
        </div>

    </div>

    <div id="healthBar">
        <div id="healthFill"></div>
    </div>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <button id="shoot">
        🔥
    </button>

</div>


<!-- ================= GAME OVER ================= -->

<div id="gameOver">

    <div class="gameOverBox">

        <h1 id="gameOverTitle">🏆 SIEG!</h1>

        <br>

        <button id="again" class="button">
            🔄 NOCHMAL
        </button>

        <button id="menuButton" class="button dark">
            🏠 MENÜ
        </button>

    </div>

</div>


<script>

"use strict";

/* ================= SERVER ================= */

const SERVER_URL =
    "wss://svgbattle-server.onrender.com";

let socket;

function connectServer(){

    socket = new WebSocket(SERVER_URL);

    socket.onopen = function(){
        console.log("Server verbunden");
    };

    socket.onclose = function(){
        console.log("Server getrennt");

        setTimeout(connectServer,3000);
    };

    socket.onerror = function(error){
        console.log("WebSocket Fehler",error);
    };

    socket.onmessage = function(event){

        try{

            const data =
                JSON.parse(event.data);

            handleMessage(data);

        }catch(error){

            console.error(
                "Serverdaten konnten nicht gelesen werden:",
                error
            );

        }

    };
}

connectServer();


function send(data){

    if(
        socket &&
        socket.readyState === WebSocket.OPEN
    ){

        socket.send(JSON.stringify(data));

    }

}


/* ================= VARIABLES ================= */

let myId = null;
let roomCode = "";
let players = [];
let bots = [];

let map = {
    width:1600,
    height:900
};

let walls = [];

let gameStarted = false;

let keys = {
    up:false,
    down:false,
    left:false,
    right:false
};

let moveX = 0;
let moveY = 0;

let aimX = 800;
let aimY = 450;

let shooting = false;


/* ================= LOCAL DATA ================= */

let storedKills =
    Number(localStorage.getItem("battleKills") || 0);

let storedTrophies =
    Number(localStorage.getItem("battleTrophies") || 0);

document.getElementById("kills").textContent =
    storedKills;

document.getElementById("trophies").textContent =
    storedTrophies;


/* ================= ELEMENTS ================= */

const menu =
    document.getElementById("menu");

const lobby =
    document.getElementById("lobby");

const game =
    document.getElementById("game");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


function resizeCanvas(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* ================= SERVER MESSAGES ================= */

function handleMessage(data){

    if(data.type === "connected"){

        myId = data.id;

        map = data.map || map;

        walls = data.walls || [];

        return;
    }


    if(data.type === "roomCreated"){

        roomCode = data.code;

        showLobby();

        return;
    }


    if(data.type === "joinedRoom"){

        roomCode = data.code;

        showLobby();

        return;
    }


    if(data.type === "state"){

        players = data.players || [];

        bots = data.bots || [];

        map = data.map || map;

        walls = data.walls || [];

        updateHUD();

        return;
    }


    if(data.type === "bullet"){

        bullets.push({

            x:data.x,
            y:data.y,

            dx:data.dx,
            dy:data.dy,

            life:60

        });

        return;
    }


    if(data.type === "hit"){

        hitEffects.push({

            x:data.x,
            y:data.y,

            life:15

        });

        return;
    }


    if(data.type === "eliminated"){

        if(data.killer === myId){

            storedKills++;

            storedTrophies++;

            localStorage.setItem(
                "battleKills",
                storedKills
            );

            localStorage.setItem(
                "battleTrophies",
                storedTrophies
            );

            document.getElementById("kills").textContent =
                storedKills;

            document.getElementById("trophies").textContent =
                storedTrophies;

        }

        return;
    }


    if(data.type === "roundEnd"){

        gameOver.style.display = "flex";

        if(data.winner === myId){

            gameOverTitle.textContent =
                "🏆 SIEG!";

        }else{

            gameOverTitle.textContent =
                "💀 VERLOREN!";

        }

        return;
    }


    if(data.type === "error"){

        alert(data.message);

        return;
    }

}


/* ================= MENU ================= */

document
.getElementById("create")
.onclick = function(){

    const name =
        document.getElementById("name")
        .value
        .trim() || "Player";

    const difficulty =
        document.getElementById("difficulty")
        .value;

    const bots =
        Number(
            document.getElementById("bots")
            .value
        );

    send({

        type:"createRoom",

        name:name,

        difficulty:difficulty,

        bots:bots

    });

};


document
.getElementById("join")
.onclick = function(){

    const name =
        document.getElementById("name")
        .value
        .trim() || "Player";

    const code =
        document.getElementById("room")
        .value
        .trim()
        .toUpperCase();

    if(code.length !== 4){

        alert(
            "Der Raumcode muss 4 Zeichen haben."
        );

        return;
    }

    send({

        type:"joinRoom",

        name:name,

        code:code

    });

};


function showLobby(){

    menu.style.display = "none";

    lobby.style.display = "flex";

    document.getElementById("code")
        .textContent = roomCode;

    document.getElementById("lobbyName")
        .textContent =
        document.getElementById("name")
        .value || "Player";

    document.getElementById("lobbyDifficulty")
        .textContent =
        document.getElementById("difficulty")
        .selectedOptions[0].textContent;

    document.getElementById("lobbyBots")
        .textContent =
        document.getElementById("bots").value;

}


document
.getElementById("copy")
.onclick = async function(){

    try{

        await navigator.clipboard.writeText(
            roomCode
        );

        alert("Raumcode kopiert!");

    }catch{

        alert(
            "Raumcode: " + roomCode
        );

    }

};


document
.getElementById("play")
.onclick = function(){

    lobby.style.display = "none";

    game.style.display = "block";

    gameStarted = true;

};


document
.getElementById("back")
.onclick = function(){

    lobby.style.display = "none";

    menu.style.display = "flex";

};


/* ================= KEYBOARD ================= */

window.addEventListener(
    "keydown",
    function(e){

        if(e.key === "ArrowUp"){
            keys.up = true;
            e.preventDefault();
        }

        if(e.key === "ArrowDown"){
            keys.down = true;
            e.preventDefault();
        }

        if(e.key === "ArrowLeft"){
            keys.left = true;
            e.preventDefault();
        }

        if(e.key === "ArrowRight"){
            keys.right = true;
            e.preventDefault();
        }

    }
);


window.addEventListener(
    "keyup",
    function(e){

        if(e.key === "ArrowUp")
            keys.up = false;

        if(e.key === "ArrowDown")
            keys.down = false;

        if(e.key === "ArrowLeft")
            keys.left = false;

        if(e.key === "ArrowRight")
            keys.right = false;

    }
);


/* ================= MOVEMENT ================= */

setInterval(
    function(){

        if(!gameStarted)
            return;

        let x = 0;
        let y = 0;

        if(keys.left)
            x--;

        if(keys.right)
            x++;

        if(keys.up)
            y--;

        if(keys.down)
            y++;

        x += moveX;
        y += moveY;

        if(x !== 0 || y !== 0){

            const length =
                Math.hypot(x,y);

            if(length > 1){

                x /= length;
                y /= length;

            }

            send({

                type:"move",

                dx:x,
                dy:y

            });

        }

    },
    1000/30
);


/* ================= SHOOT ================= */

function shoot(){

    if(!gameStarted)
        return;

    const me =
        players.find(
            p => p.id === myId
        );

    if(!me || !me.alive)
        return;

    const dx =
        aimX -
        canvas.width / 2;

    const dy =
        aimY -
        canvas.height / 2;

    if(Math.hypot(dx,dy) < 5)
        return;

    send({

        type:"shoot",

        dx:dx,

        dy:dy

    });

}


document
.getElementById("shoot")
.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        shooting = true;

        shoot();

    }
);

document
.getElementById("shoot")
.addEventListener(
    "pointerup",
    function(){

        shooting = false;

    }
);

setInterval(
    function(){

        if(shooting)
            shoot();

    },
    250
);


/* ================= AIM ================= */

canvas.addEventListener(
    "pointermove",
    function(e){

        aimX = e.clientX;

        aimY = e.clientY;

    }
);


/* ================= JOYSTICK ================= */

const joystick =
    document.getElementById("joystick");

const stick =
    document.getElementById("stick");

let joystickActive = false;


joystick.addEventListener(
    "pointerdown",
    function(e){

        joystickActive = true;

        joystick.setPointerCapture(
            e.pointerId
        );

        updateJoystick(
            e.clientX,
            e.clientY
        );

    }
);


joystick.addEventListener(
    "pointermove",
    function(e){

        if(joystickActive){

            updateJoystick(
                e.clientX,
                e.clientY
            );

        }

    }
);


joystick.addEventListener(
    "pointerup",
    function(){

        joystickActive = false;

        moveX = 0;

        moveY = 0;

        stick.style.left = "40px";

        stick.style.top = "40px";

    }
);


function updateJoystick(x,y){

    const rect =
        joystick.getBoundingClientRect();

    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height / 2;

    let dx =
        x - centerX;

    let dy =
        y - centerY;

    const max = 45;

    const distance =
        Math.hypot(dx,dy);

    if(distance > max){

        dx =
            dx / distance * max;

        dy =
            dy / distance * max;

    }

    moveX =
        dx / max;

    moveY =
        dy / max;

    stick.style.left =
        (40 + dx) + "px";

    stick.style.top =
        (40 + dy) + "px";

}


/* ================= HUD ================= */

function updateHUD(){

    const me =
        players.find(
            p => p.id === myId
        );

    if(!me)
        return;

    document.getElementById("hudRoom")
        .textContent = roomCode;

    document.getElementById("hp")
        .textContent =
        Math.max(0,Math.round(me.hp));

    document.getElementById("shield")
        .textContent =
        Math.max(0,Math.round(me.shield));

    document.getElementById("weapon")
        .textContent =
        me.weapon || "Pistole";

    document.getElementById("gameKills")
        .textContent =
        me.kills || 0;

    const percent =
        Math.max(
            0,
            Math.min(
                100,
                me.hp / me.maxHp * 100
            )
        );

    document.getElementById("healthFill")
        .style.width =
        percent + "%";

}


/* ================= RENDER ================= */

let bullets = [];

let hitEffects = [];


function camera(){

    const me =
        players.find(
            p => p.id === myId
        );

    if(!me){

        return {
            x:map.width/2,
            y:map.height/2
        };

    }

    return {
        x:me.x,
        y:me.y
    };

}


function worldX(x,cam){

    return x -
        cam.x +
        canvas.width/2;

}


function worldY(y,cam){

    return y -
        cam.y +
        canvas.height/2;

}


function drawBackground(cam){

    ctx.fillStyle = "#315a36";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const size = 50;

    ctx.strokeStyle =
        "rgba(255,255,255,.05)";

    for(
        let x =
            (-cam.x +
            canvas.width/2) %
            size;

        x < canvas.width;

        x += size
    ){

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(x,canvas.height);

        ctx.stroke();

    }

    for(
        let y =
            (-cam.y +
            canvas.height/2) %
            size;

        y < canvas.height;

        y += size
    ){

        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(canvas.width,y);

        ctx.stroke();

    }

}


function drawWalls(cam){

    for(const wall of walls){

        const x =
            worldX(wall.x,cam);

        const y =
            worldY(wall.y,cam);

        ctx.fillStyle =
            "#64748b";

        ctx.fillRect(
            x,
            y,
            wall.w,
            wall.h
        );

        ctx.strokeStyle =
            "#cbd5e1";

        ctx.strokeRect(
            x,
            y,
            wall.w,
            wall.h
        );

    }

}


function drawPlayer(player,cam){

    if(!player.alive)
        return;

    const x =
        worldX(player.x,cam);

    const y =
        worldY(player.y,cam);

    /* shadow */

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+20,
        24,
        9,
        0,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.fill();


    /* body */

    ctx.fillStyle =
        player.id === myId
        ? "#38bdf8"
        : "#ef4444";

    ctx.fillRect(
        x-18,
        y-5,
        36,
        38
    );


    /* head */

    ctx.beginPath();

    ctx.arc(
        x,
        y-20,
        14,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        "#f1c6a6";

    ctx.fill();


    /* weapon */

    ctx.strokeStyle =
        "#e5e7eb";

    ctx.lineWidth = 6;

    ctx.beginPath();

    if(player.id === myId){

        const angle =
            Math.atan2(
                aimY-canvas.height/2,
                aimX-canvas.width/2
            );

        ctx.moveTo(
            x,
            y
        );

        ctx.lineTo(
            x + Math.cos(angle)*35,
            y + Math.sin(angle)*35
        );

    }else{

        ctx.moveTo(x,y);

        ctx.lineTo(
            x+30,
            y
        );

    }

    ctx.stroke();


    /* name */

    ctx.font =
        "bold 12px Arial";

    ctx.textAlign =
        "center";

    ctx.fillStyle =
        "white";

    ctx.fillText(
        player.name,
        x,
        y-42
    );


    /* HP */

    ctx.fillStyle =
        "#3f1010";

    ctx.fillRect(
        x-25,
        y-35,
        50,
        5
    );

    ctx.fillStyle =
        "#22c55e";

    ctx.fillRect(
        x-25,
        y-35,
        50 *
        (player.hp/player.maxHp),
        5
    );


    /* shield */

    if(player.shield > 0){

        ctx.strokeStyle =
            "#38bdf8";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            31,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }

}


function drawBots(cam){

    for(const bot of bots){

        drawPlayer(
            bot,
            cam
        );

    }

}


function drawBullets(cam){

    bullets =
        bullets.filter(
            bullet => {

                bullet.x +=
                    bullet.dx * 15;

                bullet.y +=
                    bullet.dy * 15;

                bullet.life--;

                const x =
                    worldX(
                        bullet.x,
                        cam
                    );

                const y =
                    worldY(
                        bullet.y,
                        cam
                    );

                ctx.beginPath();

                ctx.arc(
                    x,
                    y,
                    5,
                    0,
                    Math.PI*2
                );

                ctx.fillStyle =
                    "#facc15";

                ctx.fill();

                return bullet.life > 0;

            }
        );

}


function drawEffects(cam){

    hitEffects =
        hitEffects.filter(
            effect => {

                effect.life--;

                const x =
                    worldX(
                        effect.x,
                        cam
                    );

                const y =
                    worldY(
                        effect.y,
                        cam
                    );

                ctx.beginPath();

                ctx.arc(
                    x,
                    y,
                    10 + (15-effect.life),
                    0,
                    Math.PI*2
                );

                ctx.strokeStyle =
                    "#facc15";

                ctx.lineWidth = 3;

                ctx.stroke();

                return effect.life > 0;

            }
        );

}


function render(){

    requestAnimationFrame(render);

    if(!gameStarted)
        return;

    const cam =
        camera();

    drawBackground(cam);

    drawWalls(cam);

    for(const player of players){

        drawPlayer(
            player,
            cam
        );

    }

    drawBots(cam);

    drawBullets(cam);

    drawEffects(cam);

}


render();

    game.style.display = "none";

    lobby.style.display = "none";

    gameStarted = false;

};
