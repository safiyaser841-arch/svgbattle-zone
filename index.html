<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no"
>

<title>Battle Zone</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #0b111a;

    color: white;

    font-family: Arial, sans-serif;

    touch-action: none;
}

/* =========================================
   MENU
========================================= */

#menu {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: flex;

    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle at center,
            #254b70 0%,
            #080d15 75%
        );
}

.menuBox {

    width: min(500px, 92vw);

    padding: 30px;

    border-radius: 24px;

    background:
        rgba(10,16,27,.96);

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.65);

    text-align: center;
}

.logo {

    font-size: 48px;

    font-weight: 900;

    color: #38bdf8;

    text-shadow:
        0 0 20px #38bdf8;

    margin-bottom: 5px;
}

.subtitle {

    color: #94a3b8;

    margin-bottom: 20px;
}

.input,
.select {

    width: 100%;

    padding: 14px;

    margin: 6px 0;

    border-radius: 10px;

    border: 1px solid #334155;

    background: #111827;

    color: white;

    font-size: 16px;
}

.button {

    width: 100%;

    padding: 14px;

    margin-top: 7px;

    border: none;

    border-radius: 10px;

    color: white;

    font-weight: bold;

    background:
        linear-gradient(
            135deg,
            #38bdf8,
            #2563eb
        );
}

.darkButton {

    background:
        #1e293b;
}

.profile {

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 6px;

    margin-bottom: 12px;
}

.profileBox {

    padding: 9px;

    border-radius: 8px;

    background: #0b1220;

    font-size: 13px;
}

/* =========================================
   LOBBY
========================================= */

#lobby {

    position: fixed;

    inset: 0;

    z-index: 80;

    display: none;

    justify-content: center;

    align-items: center;

    background:
        radial-gradient(
            circle,
            #1b4161,
            #03070d
        );
}

.lobbyBox {

    width: min(900px,94vw);

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 20px;

    padding: 20px;

    border-radius: 22px;

    background:
        rgba(9,15,25,.95);
}

.characterPreview {

    min-height: 450px;

    border-radius: 18px;

    position: relative;

    overflow: hidden;

    background:
        radial-gradient(
            circle,
            #304b69,
            #0a111a
        );
}

.bigCharacter {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%,-50%);

    width: 120px;

    height: 155px;

    border-radius:
        45px
        45px
        28px
        28px;

    box-shadow:
        inset -20px -25px 35px
        rgba(0,0,0,.45),

        0 20px 40px
        rgba(0,0,0,.45);
}

.characterHead {

    position: absolute;

    width: 76px;

    height: 76px;

    left: 22px;

    top: -33px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffe6cf,
            #a86e50
        );
}

.characterWeapon {

    position: absolute;

    width: 85px;

    height: 10px;

    right: -55px;

    top: 70px;

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            #111827,
            #e5e7eb
        );
}

.lobbyInfo {

    display: flex;

    flex-direction: column;

    justify-content: center;

    gap: 10px;
}

.roomCode {

    font-size: 44px;

    font-weight: 900;

    letter-spacing: 8px;

    color: #38bdf8;
}

/* =========================================
   GAME
========================================= */

#game {

    position: fixed;

    inset: 0;

    display: none;

    background: #17222d;
}

#canvas {

    width: 100%;

    height: 100%;

    display: block;
}

/* =========================================
   HUD
========================================= */

#hud {

    position: fixed;

    z-index: 20;

    top: 10px;

    left: 10px;

    right: 10px;

    display: flex;

    justify-content:
        space-between;

    gap: 6px;

    pointer-events:
        none;
}

.hudBox {

    padding: 8px 11px;

    border-radius: 9px;

    background:
        rgba(3,8,15,.78);

    border:
        1px solid #334155;

    backdrop-filter:
        blur(6px);
}

#roomTop {

    color: #38bdf8;

    font-weight: bold;
}

/* =========================================
   SUPER
========================================= */

#superBar {

    position: fixed;

    left: 50%;

    bottom: 15px;

    transform:
        translateX(-50%);

    width: 220px;

    height: 10px;

    border-radius: 10px;

    background: #111827;

    z-index: 30;

    overflow: hidden;
}

#superFill {

    width: 0;

    height: 100%;

    background:
        linear-gradient(
            90deg,
            #7c3aed,
            #ec4899
        );
}

#superButton {

    position: fixed;

    left: 50%;

    bottom: 35px;

    transform:
        translateX(-50%);

    z-index: 31;

    width: 95px;

    padding: 9px;

    border: none;

    border-radius: 10px;

    background: #334155;

    color: white;

    font-weight: bold;
}

/* =========================================
   MOBILE JOYSTICK
========================================= */

#joystick {

    position: fixed;

    display: none;

    left: 22px;

    bottom: 22px;

    width: 135px;

    height: 135px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.12);

    border:
        2px solid
        rgba(255,255,255,.27);

    z-index: 40;
}

#stick {

    position: absolute;

    left: 38px;

    top: 38px;

    width: 58px;

    height: 58px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.5);
}

/* =========================================
   MOBILE AIM
========================================= */

#aimArea {

    position: fixed;

    display: none;

    right: 0;

    top: 0;

    width: 55%;

    height: 100%;

    z-index: 35;
}

/* =========================================
   SHOOT BUTTON
========================================= */

#shootButton {

    position: fixed;

    display: none;

    right: 25px;

    bottom: 35px;

    width: 95px;

    height: 95px;

    border-radius: 50%;

    border:
        4px solid white;

    background:
        radial-gradient(
            circle,
            #ef4444,
            #991b1b
        );

    color: white;

    font-size: 30px;

    z-index: 45;
}

/* =========================================
   TOUCH DEVICES
========================================= */

@media(pointer: coarse) {

    #joystick,
    #aimArea,
    #shootButton {

        display: block;
    }

    .lobbyBox {

        grid-template-columns:
            1fr;
    }

    .characterPreview {

        min-height: 300px;
    }
}

</style>

</head>

<body>

<!-- =========================================
     MENU
========================================= -->

<div id="menu">

    <div class="menuBox">

        <div class="logo">
            ⚡ BATTLE ZONE
        </div>

        <div class="subtitle">
            2D Multiplayer Arena
        </div>

        <div class="profile">

            <div class="profileBox">
                🏆<br>
                Trophäen
                <b id="trophies">
                    0
                </b>
            </div>

            <div class="profileBox">
                💀<br>
                Kills
                <b id="kills">
                    0
                </b>
            </div>

            <div class="profileBox">
                👤<br>
                Skin
                <b id="currentSkin">
                    Rookie
                </b>
            </div>

        </div>

        <input
            id="name"
            class="input"
            maxlength="15"
            placeholder="Dein Name"
        >

        <button
            class="button"
            onclick="createRoom()"
        >
            🎮 Neue Lobby
        </button>

        <input
            id="joinCode"
            class="input"
            maxlength="4"
            placeholder="4-stelliger Raumcode"
        >

        <button
            class="button darkButton"
            onclick="joinRoom()"
        >
            👥 Lobby beitreten
        </button>

        <button
            class="button darkButton"
            onclick="showTutorial()"
        >
            📖 Tutorial
        </button>

    </div>

</div>

<!-- =========================================
     LOBBY
========================================= -->

<div id="lobby">

    <div class="lobbyBox">

        <div class="characterPreview">

            <div
                id="lobbyCharacter"
                class="bigCharacter"
            >

                <div
                    class="characterHead"
                ></div>

                <div
                    class="characterWeapon"
                ></div>

            </div>

        </div>

        <div class="lobbyInfo">

            <h1
                id="lobbySkinName"
            >
                Rookie
            </h1>

            <div>
                🔫 Waffe:
                <b id="lobbyWeapon">
                    Pistole
                </b>
            </div>

            <div>
                🏆 Trophäen:
                <b id="lobbyTrophies">
                    0
                </b>
            </div>

            <div>
                💀 Kills:
                <b id="lobbyKills">
                    0
                </b>
            </div>

            <div>
                🏠 Raumcode:
            </div>

            <div
                id="roomCode"
                class="roomCode"
            >
                ----
            </div>

            <button
                class="button"
                onclick="copyRoomCode()"
            >
                📋 Code kopieren
            </button>

            <button
                class="button"
                onclick="startGame()"
            >
                ▶ SPIEL STARTEN
            </button>

            <button
                class="button darkButton"
                onclick="backToMenu()"
            >
                Zurück
            </button>

        </div>

    </div>

</div>

<!-- =========================================
     TUTORIAL
========================================= -->

<div
    id="tutorialBox"
    style="
        display:none;
        position:fixed;
        inset:0;
        z-index:200;
        align-items:center;
        justify-content:center;
        background:rgba(0,0,0,.8);
    "
>

    <div
        style="
            width:min(500px,92vw);
            padding:28px;
            border-radius:20px;
            background:#111827;
            text-align:center;
        "
    >

        <h2
            id="tutorialTitle"
        >
            Tutorial
        </h2>

        <p
            id="tutorialText"
            style="
                margin:18px 0;
                color:#cbd5e1;
                line-height:1.6;
            "
        ></p>

        <div
            id="tutorialCounter"
        ></div>

        <button
            class="button"
            onclick="nextTutorial()"
        >
            Weiter
        </button>

    </div>

</div>

<!-- =========================================
     GAME
========================================= -->

<div id="game">

    <canvas id="canvas"></canvas>

    <div id="hud">

        <div class="hudBox">
            🏠
            <span id="roomTop">
                ----
            </span>
        </div>

        <div class="hudBox">
            ❤️
            <span id="hp">
                100
            </span>
        </div>

        <div class="hudBox">
            🛡️
            <span id="shield">
                50
            </span>
        </div>

        <div class="hudBox">
            🔫
            <span id="weapon">
                -
            </span>
        </div>

        <div class="hudBox">
            💀
            <span id="gameKills">
                0
            </span>
        </div>

    </div>

    <div
        id="superBar"
    >

        <div
            id="superFill"
        ></div>

    </div>

    <button
        id="superButton"
    >
        ⚡ SUPER
    </button>

    <div
        id="aimArea"
    ></div>

    <div
        id="joystick"
    >

        <div
            id="stick"
        ></div>

    </div>

    <button
        id="shootButton"
    >
        🔥
    </button>

</div>

<script>

/* =========================================
   SERVER
========================================= */

const SERVER_URL =
    "wss://svgbattle-server.onrender.com";

let socket = null;

let connected = false;

/* =========================================
   GAME DATA
========================================= */

let myId = null;

let roomCode = "";

let players = {};

let bots = [];

let bullets = [];

let effects = [];

let walls = [];

let mapWidth = 1600;

let mapHeight = 900;

let tutorialSteps = [];

let tutorialIndex = 0;

let aimX =
    window.innerWidth * .75;

let aimY =
    window.innerHeight * .5;

let joystickX = 0;

let joystickY = 0;

let mouseShooting = false;

let myKills =
    Number(
        localStorage.getItem(
            "battleKills"
        ) ||
        0
    );

let myTrophies =
    Number(
        localStorage.getItem(
            "battleTrophies"
        ) ||
        0
    );

let mySkin =
    localStorage.getItem(
        "battleSkin"
    ) ||
    "standard";

/* =========================================
   CANVAS
========================================= */

const canvas =
    document.getElementById(
        "canvas"
    );

const ctx =
    canvas.getContext(
        "2d"
    );

function resize() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

window.addEventListener(
    "resize",
    resize
);

resize();

/* =========================================
   CONNECT
========================================= */

function connect() {

    socket =
        new WebSocket(
            SERVER_URL
        );

    socket.onopen =
        () => {

            connected = true;

            console.log(
                "Battle Zone verbunden"
            );
        };

    socket.onclose =
        () => {

            connected = false;

            console.log(
                "Battle Zone getrennt"
            );
        };

    socket.onerror =
        error => {

            console.error(
                "Serverfehler",
                error
            );
        };

    socket.onmessage =
        event => {

            let data;

            try {

                data =
                    JSON.parse(
                        event.data
                    );

            } catch {

                return;
            }

            handleMessage(
                data
            );
        };
}

function send(data) {

    if (
        socket &&
        socket.readyState ===
            WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify(
                data
            )
        );
    }
}

connect();

/* =========================================
   MESSAGES
========================================= */

function handleMessage(data) {

    if (
        data.type ===
        "connected"
    ) {

        myId =
            data.id;

        tutorialSteps =
            data.tutorial ||
            [];

        walls =
            data.walls ||
            [];

        mapWidth =
            data.map?.width ||
            1600;

        mapHeight =
            data.map?.height ||
            900;
    }

    if (
        data.type ===
        "roomCreated"
    ) {

        roomCode =
            data.code;

        showLobby();
    }

    if (
        data.type ===
        "joinedRoom"
    ) {

        roomCode =
            data.code;

        showLobby();
    }

    if (
        data.type ===
        "errorMessage"
    ) {

        alert(
            data.message
        );
    }

    if (
        data.type ===
        "state"
    ) {

        players = {};

        (
            data.players ||
            []
        ).forEach(
            p => {

                players[
                    p.id
                ] = p;
            }
        );

        bots =
            data.bots ||
            [];

        walls =
            data.walls ||
            walls;

        mapWidth =
            data.map?.width ||
            mapWidth;

        mapHeight =
            data.map?.height ||
            mapHeight;

        updateHUD();
    }

    if (
        data.type ===
        "bulletSpawn"
    ) {

        bullets.push({

            x:
                data.x,

            y:
                data.y,

            dx:
                data.dx,

            dy:
                data.dy,

            speed:
                data.speed,

            color:
                data.color ||
                "#facc15",

            life:
                Math.ceil(
                    1000 /
                    Math.max(
                        1,
                        data.speed
                    )
                )
        });

        effects.push({

            type:
                "muzzle",

            x:
                data.x,

            y:
                data.y,

            life:
                8
        });
    }

    if (
        data.type ===
        "bulletImpact"
    ) {

        effects.push({

            type:
                "impact",

            x:
                data.x,

            y:
                data.y,

            life:
                15
        });
    }

    if (
        data.type ===
        "bulletHit"
    ) {

        effects.push({

            type:
                "hit",

            x:
                data.x,

            y:
                data.y,

            life:
                18
        });
    }

    if (
        data.type ===
        "meleeEffect"
    ) {

        effects.push({

            type:
                "slash",

            x:
                data.x,

            y:
                data.y,

            life:
                18
        });
    }

    if (
        data.type ===
        "hitEffect"
    ) {

        if (
            data.target ===
            myId
        ) {

            effects.push({

                type:
                    "damage",

                x:
                    800,

                y:
                    450,

                life:
                    10
            });
        }
    }

    if (
        data.type ===
        "elimination"
    ) {

        if (
            data.killer ===
            myId
        ) {

            myKills++;

            localStorage.setItem(
                "battleKills",
                myKills
            );

            document.getElementById(
                "kills"
            ).textContent =
                myKills;

            document.getElementById(
                "gameKills"
            ).textContent =
                myKills;

            myTrophies++;

            localStorage.setItem(
                "battleTrophies",
                myTrophies
            );
        }
    }
}

/* =========================================
   ROOMS
========================================= */

function createRoom() {

    if (!connected) {

        alert(
            "Server ist noch nicht verbunden."
        );

        return;
    }

    const name =
        document.getElementById(
            "name"
        ).value
        .trim() ||
        "Player";

    const botsChoice =
        prompt(
            "Wie viele Bots? 0 bis 5",
            "3"
        );

    let count =
        Number(
            botsChoice
        );

    if (
        !Number.isFinite(
            count
        )
    ) {
        count = 0;
    }

    count =
        Math.max(
            0,
            Math.min(
                5,
                count
            )
        );

    send({

        type:
            "createRoom",

        name,

        bots:
            count,

        skin:
            mySkin
    });
}

function joinRoom() {

    if (!connected) {

        alert(
            "Server ist noch nicht verbunden."
        );

        return;
    }

    const name =
        document.getElementById(
            "name"
        ).value
        .trim() ||
        "Player";

    const code =
        document.getElementById(
            "joinCode"
        ).value
        .trim()
        .toUpperCase();

    if (
        code.length !==
        4
    ) {

        alert(
            "Der Raumcode muss genau 4 Zeichen haben."
        );

        return;
    }

    send({

        type:
            "joinRoom",

        name,

        code,

        skin:
            mySkin
    });
}

function showLobby() {

    document.getElementById(
        "menu"
    ).style.display =
        "none";

    document.getElementById(
        "lobby"
    ).style.display =
        "flex";

    document.getElementById(
        "roomCode"
    ).textContent =
        roomCode;

    document.getElementById(
        "roomTop"
    ).textContent =
        roomCode;

    updateLobby();
}

function startGame() {

    document.getElementById(
        "lobby"
    ).style.display =
        "none";

    document.getElementById(
        "game"
    ).style.display =
        "block";
}

function backToMenu() {

    document.getElementById(
        "lobby"
    ).style.display =
        "none";

    document.getElementById(
        "menu"
    ).style.display =
        "flex";
}

function copyRoomCode() {

    if (
        navigator.clipboard
    ) {

        navigator.clipboard.writeText(
            roomCode
        );

        alert(
            "Raumcode kopiert!"
        );
    }
}

/* =========================================
   PROFILE
========================================= */

function updateHUD() {

    const me =
        players[
            myId
        ];

    document.getElementById(
        "trophies"
    ).textContent =
        myTrophies;

    document.getElementById(
        "kills"
    ).textContent =
        myKills;

    document.getElementById(
        "currentSkin"
    ).textContent =
        mySkin;

    if (!me) return;

    document.getElementById(
        "hp"
    ).textContent =
        me.hp;

    document.getElementById(
        "shield"
    ).textContent =
        me.shield;

    document.getElementById(
        "weapon"
    ).textContent =
        me.weapon;

    document.getElementById(
        "gameKills"
    ).textContent =
        me.kills;
}

function updateLobby() {

    const me =
        players[
            myId
        ];

    const skinColors = {

        standard:
            "#38bdf8",

        rare1:
            "#2563eb",

        rare3:
            "#ef4444"
    };

    const playerSkin =
        me?.skin ||
        mySkin;

    const color =
        skinColors[
            playerSkin
        ] ||
        "#a855f7";

    document.getElementById(
        "lobbyCharacter"
    ).style.background =
        `linear-gradient(
            145deg,
            ${color},
            #111827
        )`;

    document.getElementById(
        "lobbySkinName"
    ).textContent =
        playerSkin;

    document.getElementById(
        "lobbyWeapon"
    ).textContent =
        me?.weapon ||
        "-";

    document.getElementById(
        "lobbyTrophies"
    ).textContent =
        myTrophies;

    document.getElementById(
        "lobbyKills"
    ).textContent =
        me?.kills ||
        myKills;
}

/* =========================================
   TUTORIAL
========================================= */

function showTutorial() {

    if (
        !tutorialSteps.length
    ) {

        alert(
            "Tutorial wird geladen..."
        );

        return;
    }

    tutorialIndex = 0;

    document.getElementById(
        "tutorialBox"
    ).style.display =
        "flex";

    updateTutorial();
}

function updateTutorial() {

    const step =
        tutorialSteps[
            tutorialIndex
        ];

    if (!step)
        return;

    document.getElementById(
        "tutorialTitle"
    ).textContent =
        step.title;

    document.getElementById(
        "tutorialText"
    ).textContent =
        step.text;

    document.getElementById(
        "tutorialCounter"
    ).textContent =
        `${tutorialIndex + 1} / ${tutorialSteps.length}`;
}

function nextTutorial() {

    tutorialIndex++;

    if (
        tutorialIndex >=
        tutorialSteps.length
    ) {

        document.getElementById(
            "tutorialBox"
        ).style.display =
            "none";

        return;
    }

    updateTutorial();
}

            event.preventDefault();

        if (

/* =========================================
   MOVEMENT
========================================= */

setInterval(
    () => {

        if (
            document.getElementById(
                "game"
            ).style.display !==
            "block"
        ) {
            return;
        }

        let dx = 0;
        let dy = 0;

        if (
            keyboard.up
        )
            dy--;

        if (
            keyboard.down
        )
            dy++;

        if (
            keyboard.left
        )
            dx--;

        if (
            keyboard.right
        )
            dx++;

        /*
        Mobile joystick
        */

        dx +=
            joystickX;

        dy +=
            joystickY;

        if (
            dx ||
            dy
        ) {

            send({

                type:
                    "moveIntent",

                dx,

                dy
            });
        }

    },
    1000 / 30
);

window.addEventListener(

const aimArea =

/* =========================================
   MOBILE JOYSTICK
========================================= */

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );

let joystickActive =
    false;

joystick.addEventListener(
    "pointerdown",
    event => {

        joystickActive =
            true;

        joystick.setPointerCapture(
            event.pointerId
        );

        updateJoystick(
            event.clientX,
            event.clientY
        );
    }
);

joystick.addEventListener(
    "pointermove",
    event => {

        if (!joystickActive)
            return;

        updateJoystick(
            event.clientX,
            event.clientY
        );
    }
);

joystick.addEventListener(
    "pointerup",
    () => {

        joystickActive =
            false;

        joystickX =
            0;

        joystickY =
            0;

        stick.style.left =
            "38px";

        stick.style.top =
            "38px";
    }
);

function updateJoystick(
    x,
    y
) {

    const rect =
        joystick.getBoundingClientRect();

    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height / 2;

    let dx =
        x -
        centerX;

    let dy =
        y -
        centerY;

    const max =
        43;

    const distance =
        Math.hypot(
            dx,
            dy
        );

    if (
        distance >
        max
    ) {

        dx =
            dx /
            distance *
            max;

        dy =
            dy /
            distance *
            max;
    }

    joystickX =
        dx / max;

    joystickY =
        dy / max;

    stick.style.left =
        38 +
        dx +
        "px";

    stick.style.top =
        38 +
        dy +
        "px";
}

/* =========================================
   SHOOT
========================================= */

const shootButton =
    document.getElementById(
        "shootButton"
    );

shootButton.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        shoot();
    }
);

function shoot() {

    const me =
        players[
            myId
        ];

    if (!me)
        return;

    /*
    Spieler ist immer
    in der Mitte der Kamera.
    */

    const centerX =
        window.innerWidth /
        2;

    const centerY =
        window.innerHeight /
        2;

    let dx =
        aimX -
        centerX;

    let dy =
        aimY -
        centerY;

    /*
    Wenn kein Ziel existiert,
    Richtung des Joysticks.
    */

    if (
        Math.hypot(
            dx,
            dy
        ) < 5
    ) {

        dx =
            joystickX ||
            1;

        dy =
            joystickY;
    }

    send({

        type:
            "shoot",

        dx,

        dy
    });
}

/* =========================================
   GAME CAMERA
========================================= */

function worldToScreenX(
    worldX,
    me
) {

    return (
        canvas.width / 2 +
        (
            worldX -
            me.x
        )
    );
}

function worldToScreenY(
    worldY,
    me
) {

    return (
        canvas.height / 2 +
        (
            worldY -
            me.y
        )
    );
}

/* =========================================
   MAP
========================================= */

function drawMap(me) {

    ctx.fillStyle =
        "#2c472f";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    /*
    Boden
    */

    ctx.strokeStyle =
        "rgba(255,255,255,.04)";

    const grid =
        50;

    const offsetX =
        (
            -me.x +
            canvas.width /
            2
        ) % grid;

    const offsetY =
        (
            -me.y +
            canvas.height /
            2
        ) % grid;

    for (
        let x =
            offsetX;

        x < canvas.width;

        x += grid
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            canvas.height
        );

        ctx.stroke();
    }

    for (
        let y =
            offsetY;

        y < canvas.height;

        y += grid
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            canvas.width,
            y
        );

        ctx.stroke();
    }

    /*
    Wände
    */

    walls.forEach(
        wall => {

            const x =
                worldToScreenX(
                    wall.x,
                    me
                );

            const y =
                worldToScreenY(
                    wall.y,
                    me
                );

            /*
            Schatten
            */

            ctx.fillStyle =
                "rgba(0,0,0,.3)";

            ctx.fillRect(
                x + 7,
                y + 9,
                wall.w,
                wall.h
            );

            /*
            Wand
            */

            const gradient =
                ctx.createLinearGradient(
                    x,
                    y,
                    x,
                    y +
                    wall.h
                );

            gradient.addColorStop(
                0,
                "#778899"
            );

            gradient.addColorStop(
                .5,
                "#566575"
            );

            gradient.addColorStop(
                1,
                "#283543"
            );

            ctx.fillStyle =
                gradient;

            ctx.fillRect(
                x,
                y,
                wall.w,
                wall.h
            );

            ctx.strokeStyle =
                "#b7c3cf";

            ctx.lineWidth =
                2;

            ctx.strokeRect(
                x,
                y,
                wall.w,
                wall.h
            );
        }
    );
}

/* =========================================
   CHARACTER
========================================= */

function getSkinColor(
    skin
) {

    const colors = {

        standard:
            "#38bdf8",

        rare1:
            "#2563eb",

        rare2:
            "#22c55e",

        rare3:
            "#ef4444",

        rare4:
            "#a855f7",

        rare5:
            "#f97316",

        super1:
            "#06b6d4",

        super2:
            "#111827",

        super3:
            "#bae6fd",

        super4:
            "#f97316",

        super5:
            "#84cc16",

        epic1:
            "#8b5cf6",

        epic2:
            "#ec4899",

        epic3:
            "#38bdf8",

        epic4:
            "#dc2626",

        epic5:
            "#312e81",

        mythic1:
            "#f59e0b",

        mythic2:
            "#7f1d1d",

        mythic3:
            "#64748b",

        mythic4:
            "#fb923c",

        mythic5:
            "#6366f1",

        legend1:
            "#facc15",

        legend2:
            "#fde68a",

        legend3:
            "#ffffff"
    };

    return (
        colors[
            skin
        ] ||
        "#38bdf8"
    );
}

function drawCharacter(
    entity,
    me
) {

    const x =
        worldToScreenX(
            entity.x,
            me
        );

    const y =
        worldToScreenY(
            entity.y,
            me
        );

    /*
    Schatten
    */

    ctx.beginPath();

    ctx.ellipse(
        x,
        y + 23,
        22,
        8,
        0,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.fill();

    /*
    Körper
    */

    const color =
        getSkinColor(
            entity.skin
        );

    const body =
        ctx.createRadialGradient(
            x - 8,
            y - 10,
            2,
            x + 15,
            y + 18,
            35
        );

    body.addColorStop(
        0,
        "#ffffff"
    );

    body.addColorStop(
        .18,
        color
    );

    body.addColorStop(
        1,
        "#101827"
    );

    ctx.fillStyle =
        body;

    ctx.beginPath();

    ctx.roundRect(
        x - 18,
        y - 8,
        36,
        38,
        10
    );

    ctx.fill();

    /*
    Kopf
    */

    const head =
        ctx.createRadialGradient(
            x - 5,
            y - 26,
            2,
            x + 7,
            y - 12,
            20
        );

    head.addColorStop(
        0,
        "#ffe6cf"
    );

    head.addColorStop(
        1,
        "#9f6a4e"
    );

    ctx.fillStyle =
        head;

    ctx.beginPath();

    ctx.arc(
        x,
        y - 20,
        14,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /*
    Waffenrichtung
    */

    let targetX;

    let targetY;

    if (
        entity.id === myId
    ) {

        targetX =
            aimX;

        targetY =
            aimY;

    } else {

        targetX =
            x +
            30;

        targetY =
            y;
    }

    const angle =
        Math.atan2(
            targetY - y,
            targetX - x
        );

    const gunX =
        x +
        Math.cos(angle) *
            12;

    const gunY =
        y +
        Math.sin(angle) *
            12;

    const endX =
        x +
        Math.cos(angle) *
            35;

    const endY =
        y +
        Math.sin(angle) *
            35;

    ctx.strokeStyle =
        "#e5e7eb";

    ctx.lineWidth =
        7;

    ctx.lineCap =
        "round";

    ctx.beginPath();

    ctx.moveTo(
        gunX,
        gunY
    );

    ctx.lineTo(
        endX,
        endY
    );

    ctx.stroke();

    /*
    HP
    */

    ctx.fillStyle =
        "#2b0b0b";

    ctx.fillRect(
        x - 24,
        y - 37,
        48,
        5
    );

    ctx.fillStyle =
        "#22c55e";

    ctx.fillRect(
        x - 24,
        y - 37,
        48 *
        Math.max(
            0,
            entity.hp /
                100
        ),
        5
    );

    /*
    Schild
    */

    if (
        entity.shield >
        0
    ) {

        ctx.strokeStyle =
            "#38bdf8";

        ctx.lineWidth =
            2;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            28,
            0,
            Math.PI * 2
        );

        ctx.stroke();
    }

    /*
    Name
    */

    ctx.font =
        "bold 12px Arial";

    ctx.textAlign =
        "center";

    ctx.fillStyle =
        "white";

    ctx.shadowBlur =
        5;

    ctx.shadowColor =
        "black";

    ctx.fillText(
        entity.name,
        x,
        y - 45
    );

    ctx.shadowBlur =
        0;
}

/* =========================================
   BULLETS
========================================= */

function drawBullets(
    me
) {

    bullets =
        bullets.filter(
            bullet => {

                bullet.x +=
                    bullet.dx *
                    bullet.speed /
                    3;

                bullet.y +=
                    bullet.dy *
                    bullet.speed /
                    3;

                bullet.life--;

                const x =
                    worldToScreenX(
                        bullet.x,
                        me
                    );

                const y =
                    worldToScreenY(
                        bullet.y,
                        me
                    );

                ctx.beginPath();

                ctx.arc(
                    x,
                    y,
                    5,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    bullet.color;

                ctx.shadowBlur =
                    15;

                ctx.shadowColor =
                    bullet.color;

                ctx.fill();

                ctx.shadowBlur =
                    0;

                return (
                    bullet.life >
                    0
                );
            }
        );
}

/* =========================================
   EFFECTS
========================================= */

function drawEffects(
    me
) {

    effects =
        effects.filter(
            effect => {

                effect.life--;

                const x =
                    worldToScreenX(
                        effect.x,
                        me
                    );

                const y =
                    worldToScreenY(
                        effect.y,
                        me
                    );

                if (
                    effect.type ===
                    "impact"
                ) {

                    ctx.beginPath();

                    ctx.arc(
                        x,
                        y,
                        8 +
                        (
                            15 -
                            effect.life
                        ) *
                        2,
                        0,
                        Math.PI * 2
                    );

                    ctx.strokeStyle =
                        "#facc15";

                    ctx.lineWidth =
                        3;

                    ctx.stroke();
                }

                if (
                    effect.type ===
                    "hit"
                ) {

                    ctx.beginPath();

                    ctx.arc(
                        x,
                        y,
                        10 +
                        (
                            18 -
                            effect.life
                        ) *
                        2,
                        0,
                        Math.PI * 2
                    );

                    ctx.strokeStyle =
                        "#ff6464";

                    ctx.lineWidth =
                        4;

                    ctx.stroke();
                }

                if (
                    effect.type ===
                    "slash"
                ) {

                    ctx.beginPath();

                    ctx.arc(
                        x,
                        y,
                        45,
                        -0.9,
                        0.9
                    );

                    ctx.strokeStyle =
                        "#ffffff";

                    ctx.lineWidth =
                        8;

                    ctx.stroke();
                }

                if (
                    effect.type ===
                    "muzzle"
                ) {

                    ctx.beginPath();

                    ctx.arc(
                        x,
                        y,
                        10,
                        0,
                        Math.PI * 2
                    );

                    ctx.fillStyle =
                        "#ffd43b";

                    ctx.fill();
                }

                if (
                    effect.type ===
                    "damage"
                ) {

                    ctx.fillStyle =
                        "rgba(255,0,0,.18)";

                    ctx.fillRect(
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );
                }

                return (
                    effect.life >
                    0
                );
            }
        );
}

/* =========================================
   SUPER BUTTON
========================================= */

document
    .getElementById(
        "superButton"
    )
    .addEventListener(
        "click",
        () => {

            send({
                type:
                    "useSuper"
            });
        }
    );

/* =========================================
   MAIN LOOP
========================================= */

function render() {

    requestAnimationFrame(
        render
    );

    const me =
        players[
            myId
        ];

    if (!me) {

        ctx.fillStyle =
            "#203142";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        return;
    }

    drawMap(
        me
    );

    Object.values(
        players
    ).forEach(
        entity => {

            if (
                entity.alive
            ) {

                drawCharacter(
                    entity,
                    me
                );
            }
        }
    );

    bots.forEach(
        bot => {

            if (
                bot.alive
            ) {

                drawCharacter(
                    bot,
                    me
                );
            }
        }
    );

    drawBullets(
        me
    );

    drawEffects(
        me
    );
}

render();
