<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
  initial-scale=1.0,
  maximum-scale=1.0,
  user-scalable=no"
>

<title>Battle Zone</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;

  background: #0b1118;
  color: white;

  font-family: Arial, sans-serif;

  touch-action: none;
  user-select: none;
}

/* =========================
   MENU
========================= */

#menu {
  position: fixed;
  inset: 0;

  z-index: 100;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle,
      #285273,
      #05080c 75%
    );
}

.menuBox {
  width: min(500px, 92vw);

  padding: 28px;

  border-radius: 24px;

  background:
    rgba(7, 14, 23, .97);

  box-shadow:
    0 25px 90px
    rgba(0,0,0,.7);

  text-align: center;
}

.logo {
  font-size: 46px;

  font-weight: 900;

  color: #38bdf8;

  text-shadow:
    0 0 25px #38bdf8;

  margin-bottom: 6px;
}

.subtitle {
  color: #94a3b8;
  margin-bottom: 17px;
}

.profile {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 6px;

  margin-bottom: 10px;
}

.profileBox {
  padding: 9px;

  border-radius: 9px;

  background: #0b1220;

  font-size: 12px;
}

.profileBox b {
  display: block;

  margin-top: 3px;

  color: #38bdf8;
}

.input {
  width: 100%;

  padding: 13px;

  margin: 5px 0;

  border: 1px solid #334155;

  border-radius: 10px;

  background: #111827;

  color: white;

  font-size: 16px;
}

.button {
  width: 100%;

  padding: 14px;

  margin-top: 7px;

  border: none;

  border-radius: 11px;

  background:
    linear-gradient(
      135deg,
      #38bdf8,
      #2563eb
    );

  color: white;

  font-weight: bold;
}

.darkButton {
  background: #1e293b;
}

/* =========================
   SKINS
========================= */

#skins {
  position: fixed;
  inset: 0;

  z-index: 110;

  display: none;

  padding: 16px;

  overflow-y: auto;

  background: #050a10;
}

.skinHeader {
  max-width: 1050px;

  margin: auto;

  display: flex;

  justify-content: space-between;
  align-items: center;
}

.skinGrid {
  width: min(1050px, 96vw);

  margin: 16px auto;

  display: grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(155px, 1fr)
    );

  gap: 12px;
}

.skinCard {
  padding: 11px;

  border-radius: 16px;

  background: #101827;

  border: 1px solid #334155;
}

.skinPreview {
  height: 105px;

  border-radius: 10px;

  display: flex;

  justify-content: center;
  align-items: center;

  background:
    radial-gradient(
      circle,
      #2b4661,
      #0b1119
    );
}

.previewCharacter {
  width: 50px;
  height: 67px;

  position: relative;

  border-radius:
    20px
    20px
    12px
    12px;

  box-shadow:
    inset
    -11px
    -11px
    16px
    rgba(0,0,0,.35);
}

.previewCharacter::before {
  content: "";

  position: absolute;

  width: 34px;
  height: 34px;

  left: 8px;
  top: -13px;

  border-radius: 50%;

  background: #f1c6a6;
}

.skinCard h3 {
  margin-top: 7px;
}

.smallText {
  margin-top: 4px;

  color: #94a3b8;

  font-size: 12px;
}

.priceText {
  margin-top: 5px;

  color: #facc15;

  font-size: 13px;
}

.superText {
  margin-top: 4px;

  color: #c4b5fd;

  font-size: 12px;
}

.skinCard button {
  width: 100%;

  margin-top: 8px;

  padding: 9px;

  border: none;

  border-radius: 8px;

  background: #2563eb;

  color: white;
}

/* =========================
   LOBBY
========================= */

#lobby {
  position: fixed;
  inset: 0;

  z-index: 90;

  display: none;

  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle,
      #214866,
      #03070c
    );
}

.lobbyBox {
  width: min(900px, 95vw);

  padding: 20px;

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 20px;

  border-radius: 22px;

  background:
    rgba(8,15,24,.96);
}

.characterPreview {
  position: relative;

  min-height: 450px;

  overflow: hidden;

  border-radius: 18px;

  background:
    radial-gradient(
      circle,
      #355779,
      #0a111a
    );
}

.bigCharacter {
  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  width: 120px;
  height: 155px;

  border-radius:
    45px
    45px
    25px
    25px;

  box-shadow:
    inset
    -22px
    -27px
    38px
    rgba(0,0,0,.45),

    0 25px 50px
    rgba(0,0,0,.5);
}

.bigCharacter::before {
  content: "";

  position: absolute;

  left: 22px;
  top: -35px;

  width: 76px;
  height: 76px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #ffe7d1,
      #a66d50
    );
}

.bigCharacter::after {
  content: "";

  position: absolute;

  right: -55px;
  top: 70px;

  width: 85px;
  height: 10px;

  border-radius: 10px;

  background:
    linear-gradient(
      90deg,
      #111827,
      #e5e7eb
    );
}

.lobbyInfo {
  display: flex;

  flex-direction: column;

  justify-content: center;

  gap: 10px;
}

.roomCode {
  font-size: 42px;

  font-weight: 900;

  letter-spacing: 8px;

  color: #38bdf8;
}

/* =========================
   GAME
========================= */

#game {
  position: fixed;
  inset: 0;

  display: none;

  background: #24372a;
}

#canvas {
  width: 100%;
  height: 100%;

  display: block;
}

/* =========================
   HUD
========================= */

#hud {
  position: fixed;

  top: 9px;
  left: 9px;

  z-index: 20;

  display: flex;

  flex-wrap: wrap;

  gap: 6px;

  pointer-events: none;
}

.hudBox {
  padding: 8px 11px;

  border-radius: 9px;

  background:
    rgba(3,8,15,.78);

  border:
    1px solid #334155;

  font-size: 13px;
}

#roomTop {
  color: #38bdf8;
  font-weight: bold;
}

/* =========================
   SUPER
========================= */

#superBar {
  position: fixed;

  left: 50%;
  bottom: 15px;

  transform:
    translateX(-50%);

  width: 220px;
  height: 10px;

  border-radius: 10px;

  background: #111827;

  z-index: 35;

  overflow: hidden;
}

#superFill {
  width: 0;
  height: 100%;

  background:
    linear-gradient(
      90deg,
      #7c3aed,
      #ec4899
    );
}

#superButton {
  position: fixed;

  left: 50%;
  bottom: 32px;

  transform:
    translateX(-50%);

  z-index: 36;

  padding: 9px 14px;

  border: none;

  border-radius: 10px;

  background: #334155;

  color: white;

  font-weight: bold;
}

#superButton.ready {
  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #ec4899
    );

  box-shadow:
    0 0 25px
    rgba(
      236,
      72,
      153,
      .7
    );
}

/* =========================
   ROUND
========================= */

#roundMenu {
  position: fixed;
  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  flex-direction: column;

  gap: 12px;

  z-index: 100;

  background:
    rgba(0,0,0,.72);
}

#roundTitle {
  font-size:
    clamp(
      45px,
      11vw,
      80px
    );

  font-weight: 900;
}

.roundButton {
  width:
    min(
      290px,
      80vw
    );

  padding: 14px;

  border: none;

  border-radius: 11px;

  background: #2563eb;

  color: white;

  font-weight: bold;

  font-size: 17px;
}

/* =========================
   MOBILE CONTROLS
========================= */

#joystick {
  position: fixed;

  display: none;

  left: 18px;
  bottom: 20px;

  width: 150px;
  height: 150px;

  border-radius: 50%;

  background:
    rgba(255,255,255,.12);

  border:
    2px solid
    rgba(255,255,255,.3);

  z-index: 40;
}

#stick {
  position: absolute;

  width: 65px;
  height: 65px;

  left: 41px;
  top: 41px;

  border-radius: 50%;

  background:
    rgba(255,255,255,.5);
}

#aimArea {
  position: fixed;

  display: none;

  right: 0;
  top: 0;

  width: 53%;
  height: 100%;

  z-index: 30;
}

#shootButton {
  position: fixed;

  display: none;

  right: 20px;
  bottom: 30px;

  width: 105px;
  height: 105px;

  border-radius: 50%;

  border:
    4px solid white;

  background:
    radial-gradient(
      circle,
      #ef4444,
      #991b1b
    );

  color: white;

  font-size: 32px;

  z-index: 45;
}

@media(pointer: coarse) {

  #joystick,
  #aimArea,
  #shootButton {
    display: block;
  }

  #hud {
    right: 120px;
  }

  #superButton {
    bottom: 150px;
  }

  #superBar {
    bottom: 130px;
  }

  .lobbyBox {
    grid-template-columns: 1fr;
  }

  .characterPreview {
    min-height: 280px;
  }
}

@media(pointer: coarse) and (min-width: 600px) {

  #joystick {
    width: 175px;
    height: 175px;
  }

  #stick {
    width: 75px;
    height: 75px;

    left: 50px;
    top: 50px;
  }

  #shootButton {
    width: 120px;
    height: 120px;

    right: 30px;
    bottom: 35px;
  }
}

</style>

</head>

<body>

<!-- =========================
     MENU
========================= -->

<div id="menu">

  <div class="menuBox">

    <div class="logo">
      ⚡ BATTLE ZONE
    </div>

    <div class="subtitle">
      2D Multiplayer Arena
    </div>

    <div class="profile">

      <div class="profileBox">
        🏆 Trophäen
        <b id="menuTrophies">0</b>
      </div>

      <div class="profileBox">
        💀 Kills
        <b id="menuKills">0</b>
      </div>

      <div class="profileBox">
        👤 Skin
        <b id="menuSkin">Rookie</b>
      </div>

    </div>

    <input

    >

<!-- =========================

========================= -->

<div id="skins">

<!-- =========================

========================= -->

<div id="tutorial">

    <p id="tutorialText"></p>

    <div id="tutorialCounter"></div>

<!-- =========================

========================= -->

<div id="game">

<script>

"use strict";

/* =====================================================
   SERVER
===================================================== */

const SERVER =
  "wss://svgbattle-server.onrender.com";

let socket = null;
let connected = false;

function connectServer() {

  socket =
    new WebSocket(
      SERVER
    );

  socket.onopen =
    () => {

      connected = true;

      console.log(
        "Battle Zone verbunden"
      );
    };

  socket.onclose =
    () => {

      connected = false;

      console.log(
        "Battle Zone getrennt"
      );
    };

  socket.onerror =
    error => {

      console.error(
        "WebSocket Fehler:",
        error
      );
    };

  socket.onmessage =
    event => {

      try {

        const data =
          JSON.parse(
            event.data
          );

        handleMessage(
          data
        );

      } catch(error) {

        console.error(
          "Nachrichtenfehler:",
          error
        );
      }
    };
}

function send(data) {

  if (
    socket &&
    socket.readyState ===
      WebSocket.OPEN
  ) {

    socket.send(
      JSON.stringify(
        data
      )
    );
  }
}

connectServer();

/* =====================================================
   DATA
===================================================== */

let myId = null;

let roomCode = "";

let players = {};

let bots = [];

let bullets = [];

let effects = [];

let walls = [];

let skinCatalog = {};

let tutorial = [];

let tutorialIndex = 0;

let mySkin =
  localStorage.getItem(
    "battleSkin"
  ) ||
  "standard";

let myKills =
  Number(
    localStorage.getItem(
      "battleKills"
    ) ||
    0
  );

let myTrophies =
  Number(
    localStorage.getItem(
      "battleTrophies"
    ) ||
    0
  );

let keyboard = {
  up: false,
  down: false,
  left: false,
  right: false
};

let joystickX = 0;
let joystickY = 0;

let aimX =
  window.innerWidth / 2 + 200;

let aimY =
  window.innerHeight / 2;

/* =====================================================
   CANVAS
===================================================== */

const canvas =
  document.getElementById(
    "canvas"
  );

const ctx =
  canvas.getContext(
    "2d"
  );

function resizeCanvas() {

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;
}

resizeCanvas();

window.addEventListener(
  "resize",
  resizeCanvas
);

/* =====================================================
   PROFILE
===================================================== */

function updateProfile() {

  document.getElementById(
    "menuTrophies"
  ).textContent =
    myTrophies;

  document.getElementById(
    "menuKills"
  ).textContent =
    myKills;

  const skin =
    skinCatalog[
      mySkin
    ];

  document.getElementById(
    "menuSkin"
  ).textContent =
    skin
      ? skin.name
      : "Rookie";
}

/* =====================================================
   SERVER MESSAGES
===================================================== */

function handleMessage(
  data
) {

  if (
    data.type ===
    "connected"
  ) {

    myId =
      data.id;

    walls =
      data.walls ||
      [];

    tutorial =
      data.tutorial ||
      [];

    skinCatalog =
      {};

    (
      data.skins ||
      []
    ).forEach(
      skin => {

        skinCatalog[
          skin.id
        ] =
          skin;
      }
    );

    renderSkins();

    updateProfile();

    return;
  }

  if (
    data.type ===
    "roomCreated"
  ) {

    roomCode =
      data.code;

    showLobby();

    return;
  }

  if (
    data.type ===
    "joinedRoom"
  ) {

    roomCode =
      data.code;

    showLobby();

    return;
  }

  if (
    data.type ===
    "errorMessage"
  ) {

    alert(
      data.message
    );

    return;
  }

  if (
    data.type ===
    "state"
  ) {

    players = {};

    (
      data.players ||
      []
    ).forEach(
      player => {

        players[
          player.id
        ] =
          player;
      }
    );

    bots =
      data.bots ||
      [];

    if (
      Array.isArray(
        data.walls
      )
    ) {

      walls =
        data.walls;
    }

    updateHUD();

    return;
  }

  if (
    data.type ===
    "bulletSpawn"
  ) {

    bullets.push({

      x:
        data.x,

      y:
        data.y,

      dx:
        data.dx,

      dy:
        data.dy,

      speed:
        data.speed,

      color:
        data.color ||
        "#facc15",

      life:
        100
    });

    effects.push({

      type:
        "muzzle",

      x:
        data.x,

      y:
        data.y,

      life:
        8
    });

    return;
  }

  if (
    data.type ===
    "bulletImpact"
  ) {

    effects.push({

      type:
        "impact",

      x:
        data.x,

      y:
        data.y,

      life:
        15
    });

    return;
  }

  if (
    data.type ===
    "bulletHit"
  ) {

    effects.push({

      type:
        "hit",

      x:
        data.x,

      y:
        data.y,

      life:
        18
    });

    return;
  }

  if (
    data.type ===
    "meleeEffect"
  ) {

    effects.push({

      type:
        "slash",

      x:
        data.x,

      y:
        data.y,

      life:
        18
    });

    return;
  }

  if (
    data.type ===
    "superEffect"
  ) {

    effects.push({

      type:
        "super",

      x:
        data.x,

      y:
        data.y,

      life:
        35
    });

    return;
  }

  if (
    data.type ===
    "hitEffect"
  ) {

    if (
      data.target ===
      myId
    ) {

      effects.push({

        type:
          "damage",

        x:
          0,

        y:
          0,

        life:
          10
      });
    }

    return;
  }

  if (
    data.type ===
    "elimination"
  ) {

    if (
      data.killer ===
      myId
    ) {

      myKills++;

      myTrophies++;

      localStorage.setItem(
        "battleKills",
        myKills
      );

      localStorage.setItem(
        "battleTrophies",
        myTrophies
      );

      updateProfile();
    }

    return;
  }

  if (
    data.type ===
    "roundEnd"
  ) {

    const won =
      data.winner ===
      myId;

    document.getElementById(
      "roundTitle"
    ).textContent =
      won
        ? "🏆 SIEG!"
        : "💀 VERLOREN!";

    document.getElementById(
      "roundMenu"
    ).style.display =
      "flex";

    return;
  }

  if (
    data.type ===
    "newRound"
  ) {

    bullets = [];

    effects = [];

    document.getElementById(
      "roundMenu"

function renderSkins() {

  const grid =
    document.getElementById(
      "skinGrid"
    );

  if (!grid)
    return;

  grid.innerHTML =
    "";

  Object.values(
    skinCatalog
  ).forEach(
    skin => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "skinCard";

      const preview =
        document.createElement(
          "div"
        );

      preview.className =
        "skinPreview";

      const character =
        document.createElement(
          "div"
        );

      character.className =
        "previewCharacter";

      character.style.background =
        `linear-gradient(
          145deg,
          ${skin.color},
          #111827
        )`;

      preview.appendChild(
        character
      );

      const title =
        document.createElement(
          "h3"
        );

      title.textContent =
        skin.name;

      const rarity =
        document.createElement(
          "div"
        );

      rarity.className =
        "smallText";

      rarity.textContent =
        skin.rarity;

      const weapon =
        document.createElement(
          "div"
        );

      weapon.className =
        "smallText";

      weapon.textContent =
        "🔫 " +
        skin.weapon;

      const damage =
        document.createElement(
          "div"
        );

      damage.className =
        "smallText";

      damage.textContent =
        `💥 +${skin.damageBonus}% Schaden`;

      const price =
        document.createElement(
          "div"
        );

      price.className =
        "priceText";

      price.textContent =
        skin.price === 0
          ? "Kostenlos"
          : `Preis: ${skin.price} Kills`;

      const superText =
        document.createElement(
          "div"
        );

      superText.className =
        "superText";

      superText.textContent =
        skin.superNeed > 0
          ? `⚡ ${skin.super} – ${skin.superNeed} Bot-Schaden`
          : "⚡ Kein Super";

      const button =
        document.createElement(
          "button"
        );

      const unlocked =
        myKills >=
        skin.price;

      if (
        skin.id ===
        mySkin
      ) {

        button.textContent =
          "✓ Ausgewählt";

      } else if (
        unlocked
      ) {

        button.textContent =
          "Auswählen";

      } else {

        button.textContent =
          `🔒 ${skin.price} Kills`;
      }

      button.addEventListener(
        "click",
        () => {

          if (!unlocked) {

            alert(
              `Du brauchst ${skin.price} Kills.`
            );

            return;
          }

          mySkin =
            skin.id;

          localStorage.setItem(
            "battleSkin",
            mySkin
          );

          send({

            type:
              "changeSkin",

            skin:
              mySkin
          });

          updateProfile();
          updateLobby();
          renderSkins();
        }
      );

      card.appendChild(
        preview
      );

      card.appendChild(
        title
      );

      card.appendChild(
        rarity
      );

      card.appendChild(
        weapon
      );

      card.appendChild(
        damage
      );

      card.appendChild(
        price
      );

      card.appendChild(
        superText
      );

      card.appendChild(
        button
      );

      grid.appendChild(
        card
      );
    }
  );
}

===================================================== */

const joystick =
  document.getElementById(
    "joystick"
  );

const stick =
  document.getElementById(
    "stick"
  );

let joystickActive =
  false;

joystick.addEventListener(
  "pointerdown",
  event => {

    joystickActive =
      true;

    joystick.setPointerCapture(
      event.pointerId
    );

    updateJoystick(
      event.clientX,
      event.clientY
    );
  }
);

joystick.addEventListener(
  "pointermove",
  event => {

    if (
      joystickActive
    ) {

      updateJoystick(
        event.clientX,
        event.clientY
      );
    }
  }
);

joystick.addEventListener(
  "pointerup",
  () => {

    joystickActive =
      false;

    joystickX =
      0;

    joystickY =
      0;

    stick.style.left =
      "41px";

    stick.style.top =
      "41px";
  }
);

function updateJoystick(
  x,
  y
) {

  const rect =
    joystick.getBoundingClientRect();

  const centerX =
    rect.left +
    rect.width /
      2;

  const centerY =
    rect.top +
    rect.height /
      2;

  let dx =
    x -
    centerX;

  let dy =
    y -
    centerY;

  const max =
    43;

  const len =
    Math.hypot(
      dx,
      dy
    );

  if (
    len >
    max
  ) {

    dx =
      dx /
      len *
      max;

    dy =
      dy /
      len *
      max;
  }

  joystickX =
    dx /
    max;

  joystickY =
    dy /
    max;

  stick.style.left =
    41 +
    dx +
    "px";

  stick.style.top =
    41 +
    dy +
    "px";
}

/* =====================================================
   DRAW
===================================================== */

function worldX(
  x,
  camera
) {

  return (
    x -
    camera.x +
    canvas.width /
      2
  );
}

function worldY(
  y,
  camera
) {

  return (
    y -
    camera.y +
    canvas.height /
      2
  );
}

function drawArena(
  camera
) {

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      0,
      canvas.height
    );

  gradient.addColorStop(
    0,
    "#35583b"
  );

  gradient.addColorStop(
    1,
    "#1b3021"
  );

  ctx.fillStyle =
    gradient;

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.strokeStyle =
    "rgba(255,255,255,.04)";

  const grid =
    50;

  const ox =
    (
      -camera.x +
      canvas.width /
        2
    ) %
    grid;

  const oy =
    (
      -camera.y +
      canvas.height /
        2
    ) %
    grid;

  for (
    let x = ox;
    x < canvas.width;
    x += grid
  ) {

    ctx.beginPath();

    ctx.moveTo(
      x,
      0
    );

    ctx.lineTo(
      x,
      canvas.height
    );

    ctx.stroke();
  }

  for (
    let y = oy;
    y < canvas.height;
    y += grid
  ) {

    ctx.beginPath();

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      canvas.width,
      y
    );

    ctx.stroke();
  }

  walls.forEach(
    wall => {

      const x =
        worldX(
          wall.x,
          camera
        );

      const y =
        worldY(
          wall.y,
          camera
        );

      ctx.fillStyle =
        "rgba(0,0,0,.35)";

      ctx.fillRect(
        x + 7,
        y + 9,
        wall.w,
        wall.h
      );

      const wallGradient =
        ctx.createLinearGradient(
          x,
          y,
          x,
          y +
          wall.h
        );

      wallGradient.addColorStop(
        0,
        "#8795a3"
      );

      wallGradient.addColorStop(
        .5,
        "#5c6b78"
      );

      wallGradient.addColorStop(
        1,
        "#293640"
      );

      ctx.fillStyle =
        wallGradient;

      ctx.fillRect(
        x,
        y,
        wall.w,
        wall.h
      );

      ctx.strokeStyle =
        "#c1ccd5";

      ctx.lineWidth = 2;

      ctx.strokeRect(
        x,
        y,
        wall.w,
        wall.h
      );
    }
  );
}

function getCharacterColor(
  skin
) {

  return (
    skinCatalog[
      skin
    ]?.color ||
    "#38bdf8"
  );
}

function drawCharacter(
  entity,
  camera
) {

  const x =
    worldX(
      entity.x,
      camera
    );

  const y =
    worldY(
      entity.y,
      camera
    );

  const color =
    getCharacterColor(
      entity.skin
    );

  /*
  Schatten
  */

  ctx.beginPath();

  ctx.ellipse(
    x,
    y + 22,
    24,
    9,
    0,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "rgba(0,0,0,.38)";

  ctx.fill();

  /*
  Körper
  */

  const body =
    ctx.createRadialGradient(
      x - 8,
      y - 10,
      2,
      x + 15,
      y + 18,
      35
    );

  body.addColorStop(
    0,
    "#ffffff"
  );

  body.addColorStop(
    .18,
    color
  );

  body.addColorStop(
    1,
    "#101827"
  );

  ctx.fillStyle =
    body;

  ctx.beginPath();

  ctx.roundRect(
    x - 18,
    y - 8,
    36,
    38,
    10
  );

  ctx.fill();

  /*
  Kopf
  */

  const head =
    ctx.createRadialGradient(
      x - 5,
      y - 26,
      2,
      x + 7,
      y - 12,
      20
    );

  head.addColorStop(
    0,
    "#ffe6cf"
  );

  head.addColorStop(
    1,
    "#9f694e"
  );

  ctx.fillStyle =
    head;

  ctx.beginPath();

  ctx.arc(
    x,
    y - 20,
    14,
    0,
    Math.PI * 2
  );

  ctx.fill();

  /*
  Haare
  */

  ctx.fillStyle =
    color;

  ctx.beginPath();

  ctx.arc(
    x,
    y - 23,
    14,
    Math.PI,
    0
  );

  ctx.fill();

  /*
  Waffe richtet sich auf Aim
  */

  let angle = 0;

  if (
    entity.id ===
    myId
  ) {

    angle =
      Math.atan2(
        aimY -
          canvas.height /
            2,
        aimX -
          canvas.width /
            2
      );
  }

  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.rotate(
    angle
  );

  ctx.strokeStyle =
    "#e5e7eb";

  ctx.lineWidth =
    7;

  ctx.lineCap =
    "round";

  ctx.beginPath();

  ctx.moveTo(
    8,
    0
  );

  ctx.lineTo(
    35,
    0
  );

  ctx.stroke();

  ctx.restore();

  /*
  HP
  */

  ctx.fillStyle =
    "#3a0b0b";

  ctx.fillRect(
    x - 24,
    y - 38,
    48,
    5
  );

  ctx.fillStyle =
    "#22c55e";

  ctx.fillRect(
    x - 24,
    y - 38,
    48 *
    Math.max(
      0,
      entity.hp /
        100
    ),
    5
  );

  /*
  Schild
  */

  if (
    entity.shield >
    0
  ) {

    ctx.strokeStyle =
      "#38bdf8";

    ctx.lineWidth =
      2;

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      29,
      0,
      Math.PI * 2
    );

    ctx.stroke();
  }

  /*
  Name
  */

  ctx.font =
    "bold 12px Arial";

  ctx.textAlign =
    "center";

  ctx.fillStyle =
    "white";

  ctx.shadowBlur =
    5;

  ctx.shadowColor =
    "black";

  ctx.fillText(
    entity.name,
    x,
    y - 46
  );

  ctx.shadowBlur =
    0;
}

function drawBullets(
  camera
) {

  bullets =
    bullets.filter(
      bullet => {

        bullet.x +=
          bullet.dx *
          bullet.speed /
          3;

        bullet.y +=
          bullet.dy *
          bullet.speed /
          3;

        bullet.life--;

        const x =
          worldX(
            bullet.x,
            camera
          );

        const y =
          worldY(
            bullet.y,
            camera
          );

        ctx.beginPath();

        ctx.arc(
          x,
          y,
          5,
          0,
          Math.PI * 2
        );

        ctx.fillStyle =
          bullet.color;

        ctx.shadowBlur =
          15;

        ctx.shadowColor =
          bullet.color;

        ctx.fill();

        ctx.shadowBlur =
          0;

        return (
          bullet.life >
          0
        );
      }
    );
}

function drawEffects(
  camera
) {

  effects =
    effects.filter(
      effect => {

        effect.life--;

        const x =
          worldX(
            effect.x,
            camera
          );

        const y =
          worldY(
            effect.y,
            camera
          );

        if (
          effect.type ===
          "muzzle"
        ) {

          ctx.beginPath();

          ctx.arc(
            x,
            y,
            10,
            0,
            Math.PI * 2
          );

          ctx.fillStyle =
            "#ffe066";

          ctx.fill();
        }

        if (
          effect.type ===
          "impact"
        ) {

          ctx.beginPath();

          ctx.arc(
            x,
            y,
            8 +
            (
              15 -
              effect.life
            ) *
            2,
            0,
            Math.PI * 2
          );

          ctx.strokeStyle =
            "#facc15";

          ctx.lineWidth =
            3;

          ctx.stroke();
        }

        if (
          effect.type ===
          "hit"
        ) {

          ctx.beginPath();

          ctx.arc(
            x,
            y,
            10 +
            (
              18 -
              effect.life
            ) *
            2,
            0,
            Math.PI * 2
          );

          ctx.strokeStyle =
            "#ff5c5c";

          ctx.lineWidth =
            4;

          ctx.stroke();
        }

        if (
          effect.type ===
          "slash"
        ) {

          ctx.beginPath();

          ctx.arc(
            x,
            y,
            48,
            -.9,
            .9
          );

          ctx.strokeStyle =
            "#ffffff";

          ctx.lineWidth =
            8;

          ctx.stroke();
        }

        if (
          effect.type ===
          "super"
        ) {

          ctx.beginPath();

          ctx.arc(
            x,
            y,
            25 +
            (
              35 -
              effect.life
            ) *
            6,
            0,
            Math.PI * 2
          );

          ctx.strokeStyle =
            "#ec4899";

          ctx.lineWidth =
            8;

          ctx.stroke();
        }

        if (
          effect.type ===
          "damage"
        ) {

          ctx.fillStyle =
            "rgba(255,0,0,.17)";

          ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
          );
        }

        return (
          effect.life >
          0
        );
      }
    );
}

/* =====================================================
   ROUND BUTTONS
===================================================== */

document.getElementById(
  "newRoundButton"
).addEventListener(
  "click",
  () => {

    send({

      type:
        "newRound"
    });
  }
);

document.getElementById(
  "roundLobbyButton"
).addEventListener(
  "click",
  () => {

    document.getElementById(
      "roundMenu"
    ).style.display =
      "none";

    document.getElementById(
      "game"
    ).style.display =
      "none";

    document.getElementById(
      "lobby"
    ).style.display =
      "flex";
  }
);

/* =====================================================
   GAME LOOP
===================================================== */

function render() {

  requestAnimationFrame(
    render
  );

  if (
    document.getElementById(
      "game"
    ).style.display !==
    "block"
  ) {

    return;
  }

  const me =
    players[
      myId
    ];

  if (!me) {

    ctx.fillStyle =
      "#203142";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    return;
  }

  const camera = {

    x:
      me.x,

    y:
      me.y
  };

  drawArena(
    camera
  );

  Object.values(
    players
  ).forEach(
    player => {

      if (
        player.alive
      ) {

        drawCharacter(
          player,
          camera
        );
      }
    }
  );

  bots.forEach(
    bot => {

      if (
        bot.alive
      ) {

        drawCharacter(
          bot,
          camera
        );
      }
    }
  );

  drawBullets(
    camera
  );

  drawEffects(
    camera
  );
}

render();

</script>
