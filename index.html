<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Battle Zone</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #111;

    color: white;

}


#game {

    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    display: block;

    background:
        linear-gradient(
            #315c3c,
            #23482f
        );

}


/* =========================
   MENU
========================= */

#menu {

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: min(420px, 90vw);

    padding: 30px;

    border-radius: 20px;

    background:
        rgba(10, 10, 10, 0.90);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.5);

    text-align: center;

    z-index: 10;

}


#menu h1 {

    margin-top: 0;

    font-size: 42px;

}


#nameInput {

    width: 100%;

    padding: 14px;

    border: 0;

    border-radius: 10px;

    margin-bottom: 12px;

    font-size: 16px;

}


button {

    width: 100%;

    padding: 14px;

    margin-top: 8px;

    border: 0;

    border-radius: 10px;

    background: #2878ff;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}


button:hover {

    opacity: .85;

}


#connection {

    margin-top: 15px;

    font-size: 14px;

}


/* =========================
   HUD
========================= */

#hud {

    position: fixed;

    top: 15px;
    left: 15px;

    z-index: 5;

    padding: 12px 16px;

    border-radius: 12px;

    background:
        rgba(0,0,0,.55);

    backdrop-filter: blur(8px);

}


#status {

    font-weight: bold;

}


#players {

    margin-top: 5px;

    opacity: .8;

}


/* =========================
   MOBILE CONTROLS
========================= */

#mobileControls {

    position: fixed;

    left: 20px;
    bottom: 20px;

    width: 150px;
    height: 150px;

    z-index: 6;

    display: none;

}


.joystick {

    position: absolute;

    width: 150px;
    height: 150px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.12);

    border:
        2px solid
        rgba(255,255,255,.25);

}


.stick {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 60px;
    height: 60px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        rgba(255,255,255,.4);

}


/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    #mobileControls {

        display: block;

    }

}

</style>

</head>

<body>


<canvas id="game"></canvas>


<div id="menu">

    <h1>⚡ Battle Zone</h1>

    <p>
        Einfaches Multiplayer-Testspiel
    </p>

    <input
        id="nameInput"
        maxlength="16"
        placeholder="Dein Name"
        value="Player"
    >

    <button id="playButton">
        SPIEL STARTEN
    </button>

    <button id="botButton">
        BOT HINZUFÜGEN
    </button>

    <button id="removeBotsButton">
        BOTS ENTFERNEN
    </button>

    <div id="connection">
        Verbinde mit Server...
    </div>

</div>


<div id="hud">

    <div id="status">
        🔴 Nicht verbunden
    </div>

    <div id="players">
        Spieler: 0
    </div>

</div>


<div id="mobileControls">

    <div class="joystick">

        <div class="stick"></div>

    </div>

</div>


<script>

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


const menu =
    document.getElementById("menu");

const statusText =
    document.getElementById("status");

const playersText =
    document.getElementById("players");

const connectionText =
    document.getElementById("connection");

const nameInput =
    document.getElementById("nameInput");

const playButton =
    document.getElementById("playButton");

const botButton =
    document.getElementById("botButton");

const removeBotsButton =
    document.getElementById("removeBotsButton");


let players = {};

let myId = null;

let mapWidth = 1600;

let mapHeight = 900;

let cameraX = 0;

let cameraY = 0;


/* =========================
   CANVAS
========================= */

function resize() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================
   WEBSOCKET
========================= */

const protocol =
    location.protocol === "https:"
        ? "wss://"
        : "ws://";

const socket =
    new WebSocket(
        protocol +
        location.host +
        "/ws"
    );


socket.addEventListener(
    "open",
    () => {

        statusText.textContent =
            "🟢 Verbunden";

        connectionText.textContent =
            "Server verbunden";

    }
);


socket.addEventListener(
    "close",
    () => {

        statusText.textContent =
            "🔴 Verbindung getrennt";

        connectionText.textContent =
            "Verbindung zum Server verloren";

    }
);


socket.addEventListener(
    "error",
    () => {

        statusText.textContent =
            "⚠️ Serverfehler";

    }
);


socket.addEventListener(
    "message",
    event => {

        let data;

        try {

            data =
                JSON.parse(event.data);

        } catch {

            return;

        }


        if (
            data.type ===
            "connected"
        ) {

            myId = data.id;

        }


        if (
            data.type ===
            "serverInfo"
        ) {

            mapWidth =
                data.mapWidth;

            mapHeight =
                data.mapHeight;

        }


        if (
            data.type ===
            "state"
        ) {

            players =
                data.players;

            playersText.textContent =
                "Spieler: " +
                Object.keys(players).length;

        }

    }
);


/* =========================
   SEND
========================= */

function send(data) {

    if (
        socket.readyState ===
        WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify(data)
        );

    }

}


/* =========================
   START
========================= */

playButton.addEventListener(
    "click",
    () => {

        const name =
            nameInput.value.trim();

        if (name.length > 0) {

            send({
                type: "setName",
                name: name
            });

        }

        menu.style.display =
            "none";

    }
);


/* =========================
   BOTS
========================= */

botButton.addEventListener(
    "click",
    () => {

        send({
            type: "addBot"
        });

    }
);


removeBotsButton.addEventListener(
    "click",
    () => {

        send({
            type: "removeBots"
        });

    }
);


/* =========================
   KEYBOARD
========================= */

const keys = {

    ArrowUp: false,
    ArrowDown: false,
    ArrowLeft: false,
    ArrowRight: false

};


window.addEventListener(
    "keydown",
    event => {

        if (
            event.key in keys
        ) {

            keys[event.key] = true;

            sendMovement();

            event.preventDefault();

        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        if (
            event.key in keys
        ) {

            keys[event.key] = false;

            sendMovement();

            event.preventDefault();

        }

    }
);


function sendMovement() {

    send({

        type: "move",

        up:
            keys.ArrowUp,

        down:
            keys.ArrowDown,

        left:
            keys.ArrowLeft,

        right:
            keys.ArrowRight

    });

}


/* =========================
   MOBILE JOYSTICK
========================= */

const joystick =
    document.querySelector(
        ".joystick"
    );

const stick =
    document.querySelector(
        ".stick"
    );

let joystickActive = false;


joystick.addEventListener(
    "pointerdown",
    event => {

        joystickActive = true;

        joystick.setPointerCapture(
            event.pointerId
        );

        updateJoystick(event);

    }
);


joystick.addEventListener(
    "pointermove",
    event => {

        if (
            joystickActive
        ) {

            updateJoystick(event);

        }

    }
);


joystick.addEventListener(
    "pointerup",
    () => {

        joystickActive = false;

        stick.style.left = "50%";
        stick.style.top = "50%";

        send({

            type: "move",

            up: false,
            down: false,
            left: false,
            right: false

        });

    }
);


function updateJoystick(event) {

    const rect =
        joystick.getBoundingClientRect();

    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height / 2;

    let dx =
        event.clientX -
        centerX;

    let dy =
        event.clientY -
        centerY;


    const max =
        45;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        distance > max
    ) {

        dx =
            dx / distance *
            max;

        dy =
            dy / distance *
            max;

    }


    stick.style.left =
        `calc(50% + ${dx}px)`;

    stick.style.top =
        `calc(50% + ${dy}px)`;


    send({

        type: "move",

        up: dy < -10,

        down: dy > 10,

        left: dx < -10,

        right: dx > 10

    });

}


/* =========================
   DRAW
========================= */

function drawBackground() {

    ctx.fillStyle =
        "#315c3c";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const gridSize = 50;

    ctx.strokeStyle =
        "rgba(255,255,255,.05)";

    ctx.lineWidth = 1;


    for (
        let x = -cameraX % gridSize;
        x < canvas.width;
        x += gridSize
    ) {

        ctx.beginPath();

        ctx.moveTo(x, 0);

        ctx.lineTo(
            x,
            canvas.height
        );

        ctx.stroke();

    }


    for (
        let y = -cameraY % gridSize;
        y < canvas.height;
        y += gridSize
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            canvas.width,
            y
        );

        ctx.stroke();

    }

}


/* =========================
   DRAW PLAYERS
========================= */

function drawPlayers() {

    for (
        const id in players
    ) {

        const player =
            players[id];


        const screenX =
            player.x -
            cameraX;

        const screenY =
            player.y -
            cameraY;


        /* BODY */

        ctx.beginPath();

        ctx.arc(
            screenX,
            screenY,
            22,
            0,
            Math.PI * 2
        );


        if (
            id === myId
        ) {

            ctx.fillStyle =
                "#2997ff";

        }

        else if (
            player.bot
        ) {

            ctx.fillStyle =
                "#ff9f43";

        }

        else {

            ctx.fillStyle =
                "#ff4d5a";

        }


        ctx.fill();


        /* BORDER */

        ctx.lineWidth = 3;

        ctx.strokeStyle =
            "rgba(255,255,255,.8)";

        ctx.stroke();


        /* NAME */

        ctx.font =
            "bold 14px Arial";

        ctx.textAlign =
            "center";

        ctx.fillStyle =
            "white";

        ctx.fillText(
            player.name,
            screenX,
            screenY - 32
        );


        /* HP */

        const barWidth = 50;

        const hp =
            Math.max(
                0,
                Math.min(
                    100,
                    player.hp
                )
            );


        ctx.fillStyle =
            "rgba(0,0,0,.6)";

        ctx.fillRect(
            screenX -
                barWidth / 2,
            screenY + 30,
            barWidth,
            6
        );


        ctx.fillStyle =
            "#54e36b";

        ctx.fillRect(
            screenX -
                barWidth / 2,
            screenY + 30,
            barWidth *
                (hp / 100),
            6
        );

    }

}


/* =========================
   CAMERA
========================= */

function updateCamera() {

    const me =
        players[myId];

    if (!me) {
        return;
    }


    cameraX =
        me.x -
        canvas.width / 2;

    cameraY =
        me.y -
        canvas.height / 2;


    cameraX =
        Math.max(
            0,
            Math.min(
                cameraX,
                mapWidth -
                canvas.width
            )
        );


    cameraY =
        Math.max(
            0,
            Math.min(
                cameraY,
                mapHeight -
                canvas.height
            )
        );

}


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    updateCamera();

    drawBackground();

    drawPlayers();

    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();

</script>

</body>
</html>
