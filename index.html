<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Battle Zone</title>

<style>

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #10151b;
    font-family: Arial, sans-serif;
}

canvas {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    width: min(100vw, 1000px);
    height: min(100vh, 650px);

    background: #29452b;
}

/* =========================
   MENU
========================= */

#menu {
    position: fixed;
    inset: 0;

    z-index: 50;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    color: white;

    background:
        radial-gradient(
            circle,
            #234c70,
            #070b10 70%
        );
}

#menu h1 {
    margin: 0;

    font-size: clamp(
        42px,
        9vw,
        80px
    );

    text-shadow:
        0 0 10px #29a9ff,
        0 0 40px #29a9ff;
}

#menu p {
    color: #aaa;
}

#room {
    width: 250px;

    padding: 14px;

    border: none;
    border-radius: 10px;

    text-align: center;

    font-size: 18px;

    outline: none;
}

button {
    margin: 7px;

    padding: 13px 22px;

    border: none;
    border-radius: 10px;

    color: white;

    background: #333b46;

    font-size: 16px;
    font-weight: bold;
}

button:active {
    transform: scale(.95);
}

.primary {
    background: #229cff;
}

#status {
    margin-top: 10px;
}

/* =========================
   HUD
========================= */

#hud {
    position: fixed;

    left: 15px;
    top: 15px;

    z-index: 10;

    color: white;

    font-size: 16px;

    text-shadow:
        2px 2px 4px black;
}

.bar {
    width: 170px;
    height: 8px;

    margin-bottom: 5px;

    background: #222;

    border-radius: 5px;

    overflow: hidden;
}

#hpbar {
    width: 100%;
    height: 100%;

    background: #28d969;
}

#shieldbar {
    width: 100%;
    height: 100%;

    background: #2bbcff;
}

#weapon {
    position: fixed;

    left: 50%;
    bottom: 20px;

    transform: translateX(-50%);

    z-index: 10;

    padding: 10px 18px;

    color: white;

    background: rgba(
        0,
        0,
        0,
        .75
    );

    border-radius: 12px;

    font-size: 18px;
    font-weight: bold;
}

#connection {
    position: fixed;

    right: 15px;
    top: 15px;

    z-index: 10;

    padding: 7px 10px;

    color: white;

    background: rgba(
        0,
        0,
        0,
        .7
    );

    border-radius: 8px;

    font-size: 13px;
}

#message {
    position: fixed;

    left: 0;
    top: 40%;

    width: 100%;

    z-index: 40;

    text-align: center;

    color: white;

    font-size: clamp(
        35px,
        8vw,
        70px
    );

    font-weight: bold;

    text-shadow:
        0 0 15px black,
        0 0 40px black;

    pointer-events: none;
}

/* =========================
   TOUCH CONTROLS
========================= */

#touchControls {
    position: fixed;

    inset: 0;

    z-index: 20;

    display: none;

    pointer-events: none;
}

/* Joystick */

#joystick {
    position: absolute;

    left: 25px;
    bottom: 25px;

    width: 145px;
    height: 145px;

    border-radius: 50%;

    background:
        rgba(
            255,
            255,
            255,
            .13
        );

    border:
        2px solid
        rgba(
            255,
            255,
            255,
            .25
        );

    pointer-events: auto;
}

#stick {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 65px;
    height: 65px;

    transform:
        translate(
            -50%,
            -50%
        );

    border-radius: 50%;

    background:
        rgba(
            255,
            255,
            255,
            .35
        );

    border:
        2px solid
        rgba(
            255,
            255,
            255,
            .5
        );
}

/* Shoot button */

#shootButton {
    position: absolute;

    right: 30px;
    bottom: 45px;

    width: 100px;
    height: 100px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        rgba(
            255,
            60,
            60,
            .65
        );

    border:
        3px solid
        rgba(
            255,
            255,
            255,
            .7
        );

    color: white;

    font-size: 38px;

    pointer-events: auto;
}

#shootButton:active {
    transform: scale(.9);

    background:
        rgba(
            255,
            30,
            30,
            .9
        );
}

/* Aim area */

#aimArea {
    position: absolute;

    right: 0;
    top: 0;

    width: 55%;
    height: 100%;

    pointer-events: auto;
}

/* =========================
   MOBILE
========================= */

@media (
    pointer: coarse
) {

    #touchControls {
        display: block;
    }

    #help {
        display: none;
    }

}

/* =========================
   LANDSCAPE PHONE
========================= */

@media (
    max-height: 500px
) {

    #joystick {
        width: 115px;
        height: 115px;

        left: 18px;
        bottom: 18px;
    }

    #stick {
        width: 55px;
        height: 55px;
    }

    #shootButton {
        width: 80px;
        height: 80px;

        right: 20px;
        bottom: 25px;
    }

}

</style>
</head>

<body>

<!-- =========================
     MENU
========================= -->

<div id="menu">

    <h1>⚡ BATTLE ZONE</h1>

    <p>Fight • Survive • Win</p>

    <input
        id="room"
        placeholder="RAUMCODE"
        maxlength="8"
    >

    <div>

        <button
            class="primary"
            onclick="createRoom()"
        >
            🎮 Raum erstellen
        </button>

        <button
            onclick="joinRoom()"
        >
            👥 Beitreten
        </button>

    </div>

    <button
        onclick="startTraining()"
    >
        🏋️ Training
    </button>

    <div id="status">
        🔄 Verbinde...
    </div>

</div>


<!-- =========================
     HUD
========================= -->

<div id="hud">

    ❤️ HP:
    <span id="hp">
        100
    </span>

    <div class="bar">
        <div id="hpbar"></div>
    </div>

    🛡️ Schild:
    <span id="shield">
        50
    </span>

    <div class="bar">
        <div id="shieldbar"></div>
    </div>

    ☠️ Kills:
    <span id="kills">
        0
    </span>

    <br>

    ⭐ Level:
    <span id="level">
        1
    </span>

    <br>

    👥 Spieler:
    <span id="players">
        0
    </span>

</div>


<div id="connection">
    🔴 Offline
</div>


<div id="weapon">
    🔫 Keine Waffe
</div>


<div id="message"></div>


<canvas
    id="game"
    width="1000"
    height="650">
</canvas>


<!-- =========================
     TOUCH CONTROLS
========================= -->

<div id="touchControls">

    <div id="aimArea"></div>

    <div id="joystick">

        <div id="stick"></div>

    </div>

    <div id="shootButton">
        🔥
    </div>

</div>


<script>

/* ==================================================
   SERVER
================================================== */

const SERVER_URL =
    "wss://svgbattle-server.onrender.com";


let socket = null;

let connected = false;

let gameStarted = false;

let myId = null;

const players = {};

const keys = {};

let joystickX = 0;
let joystickY = 0;

let shooting = false;

let aimX = 700;
let aimY = 325;

let particles = [];


/* ==================================================
   CANVAS
================================================== */

const canvas =
    document.getElementById(
        "game"
    );

const ctx =
    canvas.getContext(
        "2d"
    );


/* ==================================================
   WEAPONS
================================================== */

const weaponNames = {

    pistol:
        "🔫 Pistole",

    smg:
        "🔫 SMG",

    shotgun:
        "💥 Shotgun",

    sniper:
        "🎯 Sniper",

    sword:
        "⚔️ Schwert",

    hammer:
        "🔨 Hammer"

};


/* ==================================================
   CONNECT
================================================== */

function connectServer() {

    setStatus(
        "🔄 Verbinde..."
    );

    socket =
        new WebSocket(
            SERVER_URL
        );


    socket.onopen = () => {

        connected = true;

        document.getElementById(
            "connection"
        ).textContent =
            "🟢 Online";

        setStatus(
            "🟢 Online!"
        );

    };


    socket.onclose = () => {

        connected = false;

        document.getElementById(
            "connection"
        ).textContent =
            "🔴 Offline";

        setStatus(
            "🔴 Server getrennt"
        );

    };


    socket.onerror = () => {

        setStatus(
            "❌ Verbindungsfehler"
        );

    };


    socket.onmessage =
        event => {

            try {

                const data =
                    JSON.parse(
                        event.data
                    );

                handleServerMessage(
                    data
                );

            } catch {

                console.log(
                    "Ungültige Nachricht"
                );

            }

        };

}


/* ==================================================
   SEND
================================================== */

function send(data) {

    if (
        socket &&
        socket.readyState ===
        WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify(
                data
            )
        );

    }

}


/* ==================================================
   SERVER
================================================== */

function handleServerMessage(
    data
) {

    if (
        data.type === "id"
    ) {

        myId =
            data.id;

    }


    if (
        data.type === "created" ||
        data.type === "joined"
    ) {

        gameStarted = true;

        document.getElementById(
            "menu"
        ).style.display =
            "none";

        showMessage(
            "🎮 LOS!"
        );

    }


    if (
        data.type === "state"
    ) {

        Object.keys(
            players
        ).forEach(
            id => {

                if (
                    !data.players[id]
                ) {

                    delete players[id];

                }

            }
        );


        Object.assign(
            players,
            data.players
        );

        updateHUD();

    }


    if (
        data.type === "elimination"
    ) {

        showMessage(
            "☠️ ELIMINIERT!"
        );

        soundKill();

    }


    if (
        data.type === "winner"
    ) {

        showMessage(
            data.id === myId
                ? "🏆 SIEG!"
                : "💀 VERLOREN!"
        );

        if (
            data.id === myId
        ) {

            soundWin();

        } else {

            soundDeath();

        }

    }


    if (
        data.type === "levelUp"
    ) {

        showMessage(
            "⭐ LEVEL " +
            data.level
        );

        soundLevel();

    }


    if (
        data.type === "error"
    ) {

        setStatus(
            "❌ " +
            data.message
        );

    }

}


/* ==================================================
   ROOMS
================================================== */

function createRoom() {

    if (!connected) {

        setStatus(
            "❌ Nicht verbunden"
        );

        return;

    }


    const code =
        Math.random()
        .toString(36)
        .substring(
            2,
            8
        )
        .toUpperCase();


    document.getElementById(
        "room"
    ).value =
        code;


    send({

        type:
            "create",

        room:
            code

    });

}


function joinRoom() {

    if (!connected) {

        setStatus(
            "❌ Nicht verbunden"
        );

        return;

    }


    const code =
        document.getElementById(
            "room"
        )
        .value
        .trim()
        .toUpperCase();


    if (
        code.length < 3
    ) {

        setStatus(
            "❌ Raumcode eingeben"
        );

        return;

    }


    send({

        type:
            "join",

        room:
            code

    });

}


function startTraining() {

    if (!connected) {

        setStatus(
            "❌ Nicht verbunden"
        );

        return;

    }


    const code =
        "TRAIN" +
        Math.floor(
            Math.random() *
            9999
        );


    send({

        type:
            "create",

        room:
            code

    });

}


/* ==================================================
   KEYBOARD
================================================== */

document.addEventListener(
    "keydown",
    event => {

        keys[
            event.key
        ] = true;

    }
);


document.addEventListener(
    "keyup",
    event => {

        keys[
            event.key
        ] = false;

    }
);


/* ==================================================
   MOUSE AIM
================================================== */

canvas.addEventListener(
    "mousemove",
    event => {

        const rect =
            canvas.getBoundingClientRect();


        aimX =
            (
                event.clientX -
                rect.left
            ) *
            canvas.width /
            rect.width;


        aimY =
            (
                event.clientY -
                rect.top
            ) *
            canvas.height /
            rect.height;

    }
);


canvas.addEventListener(
    "mousedown",
    event => {

        if (
            event.button === 0
        ) {

            shooting = true;

        }

    }
);


document.addEventListener(
    "mouseup",
    () => {

        shooting = false;

    }
);


/* ==================================================
   TOUCH AIM
================================================== */

const aimArea =
    document.getElementById(
        "aimArea"
    );


aimArea.addEventListener(
    "touchmove",
    event => {

        const touch =
            event.touches[0];


        const rect =
            canvas.getBoundingClientRect();


        aimX =
            (
                touch.clientX -
                rect.left
            ) *
            canvas.width /
            rect.width;


        aimY =
            (
                touch.clientY -
                rect.top
            ) *
            canvas.height /
            rect.height;

    },
    {
        passive: false
    }
);


/* ==================================================
   SHOOT BUTTON
================================================== */

const shootButton =
    document.getElementById(
        "shootButton"
    );


shootButton.addEventListener(
    "touchstart",
    event => {

        event.preventDefault();

        shooting = true;

        soundShot();

    },
    {
        passive: false
    }
);


shootButton.addEventListener(
    "touchend",
    event => {

        event.preventDefault();

        shooting = false;

    },
    {
        passive: false
    }
);


/* ==================================================
   JOYSTICK
================================================== */

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );


let joystickTouch =
    null;


joystick.addEventListener(
    "touchstart",
    event => {

        event.preventDefault();

        joystickTouch =
            event.changedTouches[0].identifier;

        updateJoystick(
            event.changedTouches[0]
        );

    },
    {
        passive: false
    }
);


joystick.addEventListener(
    "touchmove",
    event => {

        event.preventDefault();

        for (
            const touch of
            event.changedTouches
        ) {

            if (
                touch.identifier ===
                joystickTouch
            ) {

                updateJoystick(
                    touch
                );

            }

        }

    },
    {
        passive: false
    }
);


joystick.addEventListener(
    "touchend",
    event => {

        event.preventDefault();

        joystickX = 0;
        joystickY = 0;

        stick.style.left =
            "50%";

        stick.style.top =
            "50%";

        joystickTouch =
            null;

    },
    {
        passive: false
    }
);


function updateJoystick(
    touch
) {

    const rect =
        joystick.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        touch.clientX -
        centerX;


    let dy =
        touch.clientY -
        centerY;


    const max =
        rect.width / 2 -
        32;


    const distance =
        Math.hypot(
            dx,
            dy
        );


    if (
        distance > max
    ) {

        dx =
            dx / distance *
            max;

        dy =
            dy / distance *
            max;

    }


    joystickX =
        dx / max;

    joystickY =
        dy / max;


    stick.style.left =
        `calc(50% + ${dx}px)`;

    stick.style.top =
        `calc(50% + ${dy}px)`;

}


/* ==================================================
   GAME CONTROL
================================================== */

setInterval(
    () => {

        if (
            !gameStarted ||
            !connected
        ) {

            return;

        }


        let dx = 0;
        let dy = 0;


        /*
           TOUCH JOYSTICK
        */

        dx +=
            joystickX;

        dy +=
            joystickY;


        /*
           KEYBOARD
        */

        if (
            keys["ArrowUp"]
        ) dy--;


        if (
            keys["ArrowDown"]
        ) dy++;


        if (
            keys["ArrowLeft"]
        ) dx--;


        if (
            keys["ArrowRight"]
        ) dy++;


        if (
            dx !== 0 ||
            dy !== 0
        ) {

            send({

                type:
                    "move",

                dx,
                dy

            });

        }


        const me =
            players[myId];


        if (!me)
            return;


        const angle =
            Math.atan2(
                aimY - me.y,
                aimX - me.x
            );


        send({

            type:
                "aim",

            angle

        });


        if (
            shooting
        ) {

            send({

                type:
                    "shoot",

                angle

            });

        }

    },
    100
);


/* ==================================================
   HUD
================================================== */

function updateHUD() {

    const me =
        players[myId];


    document.getElementById(
        "players"
    ).textContent =
        Object.keys(
            players
        ).length;


    if (!me)
        return;


    document.getElementById(
        "hp"
    ).textContent =
        Math.round(
            me.hp
        );


    document.getElementById(
        "shield"
    ).textContent =
        Math.round(
            me.shield
        );


    document.getElementById(
        "kills"
    ).textContent =
        me.kills;


    document.getElementById(
        "level"
    ).textContent =
        me.level;


    document.getElementById(
        "hpbar"
    ).style.width =
        Math.max(
            0,
            me.hp
        ) + "%";


    document.getElementById(
        "shieldbar"
    ).style.width =
        Math.max(
            0,
            me.shield * 2
        ) + "%";


    document.getElementById(
        "weapon"
    ).textContent =
        weaponNames[
            me.weapon
        ] ||
        "🔫 Keine Waffe";

}


/* ==================================================
   MAP
================================================== */

const walls = [

    {
        x: 100,
        y: 100,
        w: 200,
        h: 30
    },

    {
        x: 400,
        y: 100,
        w: 200,
        h: 30
    },

    {
        x: 700,
        y: 100,
        w: 180,
        h: 30
    },

    {
        x: 180,
        y: 270,
        w: 170,
        h: 30
    },

    {
        x: 650,
        y: 270,
        w: 170,
        h: 30
    },

    {
        x: 400,
        y: 300,
        w: 200,
        h: 30
    },

    {
        x: 100,
        y: 500,
        w: 200,
        h: 30
    },

    {
        x: 400,
        y: 500,
        w: 200,
        h: 30
    },

    {
        x: 700,
        y: 500,
        w: 180,
        h: 30
    }

];


function drawMap() {

    ctx.fillStyle =
        "#29452b";

    ctx.fillRect(
        0,
        0,
        1000,
        650
    );


    /* Boden */

    ctx.strokeStyle =
        "rgba(255,255,255,.04)";


    for (
        let x = 0;
        x < 1000;
        x += 50
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            650
        );

        ctx.stroke();

    }


    for (
        let y = 0;
        y < 650;
        y += 50
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            1000,
            y
        );

        ctx.stroke();

    }


    /* Wände */

    walls.forEach(
        wall => {

            ctx.fillStyle =
                "#68736d";

            ctx.fillRect(
                wall.x,
                wall.y,
                wall.w,
                wall.h
            );


            ctx.strokeStyle =
                "#d0d5d2";

            ctx.strokeRect(
                wall.x,
                wall.y,
                wall.w,
                wall.h
            );

        }
    );

}


/* ==================================================
   PLAYERS
================================================== */

function drawPlayer(
    p
) {

    ctx.save();

    ctx.translate(
        p.x,
        p.y
    );


    const angle =
        p.id === myId

            ? Math.atan2(
                aimY - p.y,
                aimX - p.x
            )

            : p.angle;


    /* Schatten */

    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        20,
        21,
        8,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Spieler */

    ctx.fillStyle =
        p.color ||
        "#ffffff";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        18,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* Ring */

    if (
        p.id === myId
    ) {

        ctx.strokeStyle =
            "white";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            23,
            0,
            Math.PI * 2
        );

        ctx.stroke();

    }


    /* Waffe */

    ctx.rotate(
        angle
    );

    ctx.fillStyle =
        "#171717";

    ctx.fillRect(
        12,
        -4,
        28,
        8
    );


    ctx.restore();


    /* HP */

    ctx.fillStyle =
        "#111";

    ctx.fillRect(
        p.x - 22,
        p.y - 35,
        44,
        6
    );


    ctx.fillStyle =
        "#28d969";

    ctx.fillRect(
        p.x - 22,
        p.y - 35,
        44 *
        Math.max(
            0,
            p.hp / 100
        ),
        6
    );


    /* Schild */

    if (
        p.shield > 0
    ) {

        ctx.strokeStyle =
            "#37c5ff";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            27,
            0,
            Math.PI * 2
        );

        ctx.stroke();

    }


    ctx.fillStyle =
        "white";

    ctx.font =
        "12px Arial";

    ctx.textAlign =
        "center";


    ctx.fillText(
        p.id === myId
            ? "DU"
            : p.bot
                ? "BOT"
                : "SPIELER",
        p.x,
        p.y - 43
    );

}


/* ==================================================
   PARTICLES
================================================== */

function createExplosion(
    x,
    y
) {

    for (
        let i = 0;
        i < 25;
        i++
    ) {

        particles.push({

            x,
            y,

            vx:
                (
                    Math.random()
                    - .5
                ) * 7,

            vy:
                (
                    Math.random()
                    - .5
                ) * 7,

            life:
                20 +
                Math.random() *
                20,

            size:
                2 +
                Math.random() *
                5

        });

    }

}


function drawParticles() {

    particles.forEach(
        p => {

            p.x += p.vx;
            p.y += p.vy;

            p.life--;

            ctx.fillStyle =
                "#ffd43b";

            ctx.fillRect(
                p.x,
                p.y,
                p.size,
                p.size
            );

        }
    );


    particles =
        particles.filter(
            p =>
                p.life > 0
        );

}


/* ==================================================
   UI
================================================== */

function setStatus(
    text
) {

    document.getElementById(
        "status"
    ).textContent =
        text;

}


function showMessage(
    text
) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    setTimeout(
        () => {

            message.textContent =
                "";

        },
        1800
    );

}


/* ==================================================
   SOUNDS
================================================== */

let audioContext = null;


function audio() {

    if (
        !audioContext
    ) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

}


function beep(
    frequency,
    duration,
    volume = .06
) {

    audio();


    const oscillator =
        audioContext
        .createOscillator();


    const gain =
        audioContext
        .createGain();


    oscillator.frequency.value =
        frequency;


    gain.gain.value =
        volume;


    oscillator.connect(
        gain
    );

    gain.connect(
        audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
        audioContext.currentTime +
        duration
    );

}


function soundShot() {

    beep(
        180,
        .05,
        .04
    );

}


function soundKill() {

    beep(
        600,
        .1,
        .08
    );

    setTimeout(
        () => {

            beep(
                900,
                .12,
                .08
            );

        },
        100
    );

}


function soundDeath() {

    beep(
        80,
        .4,
        .1
    );

}


function soundWin() {

    beep(
        500,
        .12
    );

    setTimeout(
        () => beep(
            700,
            .12
        ),
        120
    );

    setTimeout(
        () => beep(
            1000,
            .2
        ),
        240
    );

}


function soundLevel() {

    beep(
        700,
        .1
    );

    setTimeout(
        () => beep(
            1000,
            .15
        ),
        100
    );

}


/* ==================================================
   RENDER
================================================== */

function render() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawMap();


    Object.values(
        players
    ).forEach(
        player => {

            if (
                player.alive
            ) {

                drawPlayer(
                    player
                );

            }

        }
    );


    drawParticles();


    requestAnimationFrame(
        render
    );

}


render();

connectServer();

</script>
