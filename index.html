<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>SVG Battle Zone</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(
            circle at center,
            #263852,
            #090d15
        );
    color: white;
    touch-action: none;
}

button {
    border: none;
    cursor: pointer;
    font-weight: bold;
}

/* =========================
   MENÜ
========================= */

#menu {

    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        radial-gradient(
            circle,
            rgba(40,80,130,.8),
            #05070c
        );

    z-index: 100;
}

.menuBox {

    width: min(500px, 92vw);

    padding: 30px;

    border-radius: 25px;

    background:
        rgba(15,20,30,.92);

    box-shadow:
        0 20px 80px
        rgba(0,0,0,.6);

    text-align: center;
}

.logo {

    font-size: 42px;

    font-weight: 900;

    margin-bottom: 10px;

    text-shadow:
        0 0 20px #38bdf8;
}

.subtitle {

    color: #94a3b8;

    margin-bottom: 25px;
}

input,
select {

    width: 100%;

    padding: 14px;

    margin: 7px 0;

    border-radius: 12px;

    border: 1px solid #334155;

    background: #111827;

    color: white;

    font-size: 16px;
}

.mainButton {

    width: 100%;

    padding: 15px;

    margin-top: 10px;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #38bdf8,
            #2563eb
        );

    color: white;

    font-size: 17px;

    transition: .2s;
}

.mainButton:hover {

    transform:
        translateY(-2px);

    filter:
        brightness(1.15);
}

.secondary {

    background:
        #1e293b;
}

/* =========================
   SKIN MENU
========================= */

#skinMenu {

    position: fixed;

    inset: 0;

    display: none;

    z-index: 110;

    background:
        rgba(3,7,18,.96);

    padding: 20px;

    overflow: auto;
}

.skinGrid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(110px,1fr)
        );

    gap: 12px;

    max-width: 900px;

    margin: 20px auto;
}

.skinCard {

    min-height: 130px;

    padding: 10px;

    border-radius: 16px;

    background:
        #111827;

    border:
        2px solid #334155;

    text-align: center;
}

.skinCharacter {

    width: 55px;

    height: 70px;

    margin: auto;

    border-radius:
        25px 25px 15px 15px;

    background:
        linear-gradient(
            145deg,
            #38bdf8,
            #1d4ed8
        );

    box-shadow:
        inset -8px -8px 15px
        rgba(0,0,0,.35);
}

.skinCard button {

    margin-top: 8px;

    padding: 8px;

    width: 100%;

    border-radius: 8px;

    background: #2563eb;

    color: white;
}

/* =========================
   TUTORIAL
========================= */

#tutorial {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 200;

    background:
        rgba(0,0,0,.75);
}

.tutorialBox {

    width: min(500px, 90vw);

    padding: 30px;

    border-radius: 22px;

    background:
        #111827;

    text-align: center;

    box-shadow:
        0 20px 80px
        rgba(0,0,0,.8);
}

.tutorialBox h2 {

    margin-bottom: 15px;

    font-size: 28px;
}

.tutorialBox p {

    color: #cbd5e1;

    line-height: 1.6;

    margin-bottom: 20px;
}

/* =========================
   GAME
========================= */

#game {

    position: fixed;

    inset: 0;

    display: none;

    background:
        #101820;
}

#canvas {

    width: 100%;

    height: 100%;

    display: block;
}

/* =========================
   HUD
========================= */

#hud {

    position: fixed;

    top: 12px;

    left: 12px;

    right: 12px;

    display: flex;

    justify-content:
        space-between;

    pointer-events: none;

    z-index: 20;
}

.hudBox {

    padding: 10px 14px;

    border-radius: 12px;

    background:
        rgba(10,15,25,.75);

    backdrop-filter:
        blur(8px);

    border:
        1px solid #334155;
}

#weaponDisplay {

    font-weight: bold;

    color: #facc15;
}

/* =========================
   JOYSTICK
========================= */

#joystick {

    position: fixed;

    left: 25px;

    bottom: 25px;

    width: 130px;

    height: 130px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.12);

    border:
        2px solid
        rgba(255,255,255,.25);

    display: none;

    z-index: 50;
}

#stick {

    position: absolute;

    width: 58px;

    height: 58px;

    left: 36px;

    top: 36px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.45);

}

/* =========================
   SCHUSSTASTE
========================= */

#shootButton {

    position: fixed;

    right: 30px;

    bottom: 35px;

    width: 90px;

    height: 90px;

    border-radius: 50%;

    display: none;

    z-index: 50;

    background:
        radial-gradient(
            circle,
            #ef4444,
            #991b1b
        );

    border:
        4px solid
        rgba(255,255,255,.4);

    color: white;

    font-size: 30px;

    box-shadow:
        0 0 25px
        rgba(239,68,68,.6);
}

/* =========================
   LOBBY
========================= */

#lobby {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 150;

    background:
        rgba(3,7,18,.96);
}

.lobbyBox {

    width: min(450px,92vw);

    padding: 30px;

    background: #111827;

    border-radius: 22px;

    text-align: center;
}

.roomCode {

    font-size: 42px;

    font-weight: 900;

    letter-spacing: 8px;

    margin: 20px 0;

    color: #38bdf8;
}

/* =========================
   DEATH
========================= */

#death {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    background:
        rgba(80,0,0,.55);

    z-index: 80;
}

.deathText {

    font-size: 55px;

    font-weight: 900;

    text-shadow:
        0 0 30px red;
}

/* =========================
   MOBILE
========================= */

@media
(pointer: coarse) {

    #joystick {

        display: block;
    }

    #shootButton {

        display: block;
    }
}

</style>

</head>

<body>

<!-- =========================
     MENU
========================= -->

<div id="menu">

    <div class="menuBox">

        <div class="logo">
            ⚡ BATTLE ZONE
        </div>

        <div class="subtitle">
            Multiplayer Arena
        </div>

        <input
            id="nameInput"
            placeholder="Dein Name"
            maxlength="15"
        >

        <button
            class="mainButton"
            onclick="createRoom()"
        >
            🎮 Raum erstellen
        </button>

        <input
            id="roomInput"
            placeholder="Raumcode"
            maxlength="4"
        >

        <button
            class="mainButton secondary"
            onclick="joinRoom()"
        >
            🚪 Raum beitreten
        </button>

        <button
            class="mainButton secondary"
            onclick="openSkins()"
        >
            👤 Skins
        </button>

        <button
            class="mainButton secondary"
            onclick="startTutorial()"
        >
            📖 Tutorial
        </button>

    </div>

</div>

<!-- =========================
     SKINS
========================= -->

<div id="skinMenu">

    <h1>
        👤 Skins
    </h1>

    <p>
        Standard + 5 seltene + 5 superseltene +
        5 epische + 5 mythische + 3 legendäre
    </p>

    <div
        id="skinGrid"
        class="skinGrid"
    ></div>

    <button
        class="mainButton"
        onclick="closeSkins()"
    >
        Zurück
    </button>

</div>

<!-- =========================
     TUTORIAL
========================= -->

<div id="tutorial">

    <div class="tutorialBox">

        <h2 id="tutorialTitle">
            Tutorial
        </h2>

        <p id="tutorialText">
        </p>

        <div id="tutorialCounter">
        </div>

        <button
            class="mainButton"
            onclick="nextTutorial()"
        >
            Weiter
        </button>

    </div>

</div>

<!-- =========================
     LOBBY
========================= -->

<div id="lobby">

    <div class="lobbyBox">

        <h1>
            🎮 Lobby
        </h1>

        <p>
            Teile diesen Code mit deinen Freunden:
        </p>

        <div
            id="roomCode"
            class="roomCode"
        >
            ----
        </div>

        <button
            class="mainButton"
            onclick="copyRoomCode()"
        >
            📋 Code kopieren
        </button>

        <button
            class="mainButton"
            onclick="startGame()"
        >
            ▶ Spielen
        </button>

    </div>

</div>

<!-- =========================
     GAME
========================= -->

<div id="game">

    <canvas id="canvas"></canvas>

    <div id="hud">

        <div class="hudBox">
            ❤️ <span id="hp">100</span>
        </div>

        <div class="hudBox">
            🔫
            <span id="weaponDisplay">
                -
            </span>
        </div>

        <div class="hudBox">
            💀 <span id="kills">0</span>
        </div>

    </div>

    <div id="joystick">

        <div id="stick">
        </div>

    </div>

    <button id="shootButton">
        🔥
    </button>

</div>

<!-- =========================
     DEATH
========================= -->

<div id="death">

    <div class="deathText">
        DU BIST AUSGESCHIEDEN
    </div>

</div>

<script>

/*
==================================================
SOCKET
==================================================
*/

const socket =
    io(
        "https://svgbattle-server.onrender.com"
    );

/*
==================================================
VARIABLEN
==================================================
*/

const canvas =
    document.getElementById(
        "canvas"
    );

const ctx =
    canvas.getContext(
        "2d"
    );

let players = {};

let bots = [];

let bullets = [];

let effects = [];

let myId = null;

let roomCode = null;

let mySkin = "standard";

let myKills = 0;

let myWeapon = "-";

let tutorialSteps = [];

let tutorialIndex = 0;

let keys = {};

let joystickX = 0;

let joystickY = 0;

let shooting = false;

let lastTime = performance.now();

/*
==================================================
CANVAS
==================================================
*/

function resizeCanvas() {

    canvas.width =
        window.innerWidth *
        devicePixelRatio;

    canvas.height =
        window.innerHeight *
        devicePixelRatio;

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();

/*
==================================================
TUTORIAL
==================================================
*/

socket.on(
    "tutorial",
    steps => {

        tutorialSteps =
            steps;

        if (
            !localStorage.getItem(
                "battleTutorialDone"
            )
        ) {

            startTutorial();
        }
    }
);

function startTutorial() {

    if (
        tutorialSteps.length === 0
    )
        return;

    tutorialIndex = 0;

    document.getElementById(
        "tutorial"
    ).style.display =
        "flex";

    updateTutorial();
}

function updateTutorial() {

    const step =
        tutorialSteps[
            tutorialIndex
        ];

    document.getElementById(
        "tutorialTitle"
    ).textContent =
        step.title;

    document.getElementById(
        "tutorialText"
    ).textContent =
        step.text;

    document.getElementById(
        "tutorialCounter"
    ).textContent =
        `${tutorialIndex + 1} / ${tutorialSteps.length}`;
}

function nextTutorial() {

    tutorialIndex++;

    if (
        tutorialIndex >=
        tutorialSteps.length
    ) {

        document.getElementById(
            "tutorial"
        ).style.display =
            "none";

        localStorage.setItem(
            "battleTutorialDone",
            "yes"
        );

        socket.emit(
            "tutorialComplete"
        );

        return;
    }

    updateTutorial();
}

/*
==================================================
SKINS
==================================================
*/

const skinNames = [

    ["standard", "Standard"],

    ["rare1", "Blue"],
    ["rare2", "Green"],
    ["rare3", "Red"],
    ["rare4", "Purple"],
    ["rare5", "Orange"],

    ["super1", "Cyber"],
    ["super2", "Shadow"],
    ["super3", "Ice"],
    ["super4", "Fire"],
    ["super5", "Toxic"],

    ["epic1", "Galaxy"],
    ["epic2", "Neon"],
    ["epic3", "Storm"],
    ["epic4", "Inferno"],
    ["epic5", "Void"],

    ["mythic1", "Dragon"],
    ["mythic2", "Demon"],
    ["mythic3", "Titan"],
    ["mythic4", "Phoenix"],
    ["mythic5", "Cosmic"],

    ["legend1", "Legend"],
    ["legend2", "King"],
    ["legend3", "Battle God"]
];

function openSkins() {

    document.getElementById(
        "skinMenu"
    ).style.display =
        "block";

    const grid =
        document.getElementById(
            "skinGrid"
        );

    grid.innerHTML = "";

    skinNames.forEach(
        skin => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "skinCard";

            const character =
                document.createElement(
                    "div"
                );

            character.className =
                "skinCharacter";

            character.style.filter =
                skinFilter(
                    skin[0]
                );

            const title =
                document.createElement(
                    "div"
                );

            title.textContent =
                skin[1];

            const button =
                document.createElement(
                    "button"
                );

            button.textContent =
                "Auswählen";

            button.onclick =
                () => {

                    mySkin =
                        skin[0];

                    socket.emit(
                        "changeSkin",
                        mySkin
                    );

                    closeSkins();
                };

            card.appendChild(
                character
            );

            card.appendChild(
                title
            );

            card.appendChild(
                button
            );

            grid.appendChild(
                card
            );
        }
    );
}

function skinFilter(id) {

    const filters = {

        standard:
            "none",

        rare1:
            "hue-rotate(0deg)",

        rare2:
            "hue-rotate(70deg)",

        rare3:
            "hue-rotate(130deg)",

        rare4:
            "hue-rotate(220deg)",

        rare5:
            "hue-rotate(290deg)",

        super1:
            "saturate(2)",

        super2:
            "brightness(.5)",

        super3:
            "hue-rotate(180deg)",

        super4:
            "saturate(3)",

        super5:
            "hue-rotate(80deg)",

        epic1:
            "brightness(1.5)",

        epic2:
            "contrast(2)",

        epic3:
            "hue-rotate(200deg)",

        epic4:
            "saturate(4)",

        epic5:
            "invert(.8)",

        mythic1:
            "hue-rotate(40deg) saturate(4)",

        mythic2:
            "brightness(.4) saturate(5)",

        mythic3:
            "contrast(2) saturate(4)",

        mythic4:
            "hue-rotate(330deg) saturate(4)",

        mythic5:
            "invert(.6) saturate(3)",

        legend1:
            "brightness(1.7) saturate(3)",

        legend2:
            "contrast(2.5)",

        legend3:
            "brightness(1.8) contrast(2)"
    };

    return filters[id] ||
        "none";
}

function closeSkins() {

    document.getElementById(
        "skinMenu"
    ).style.display =
        "none";
}

/*
==================================================
CREATE ROOM
==================================================
*/

function createRoom() {

    const name =
        document.getElementById(
            "nameInput"
        ).value ||
        "Player";

    const bots =
        Number(
            prompt(
                "Wie viele Bots? 0 bis 5",
                "3"
            )
        );

    socket.emit(
        "createRoom",
        {
            name,
            bots:
                Number.isFinite(
                    bots
                )
                    ? Math.max(
                        0,
                        Math.min(
                            5,
                            bots
                        )
                    )
                    : 0,

            skin:
                mySkin
        }
    );
}

socket.on(
    "roomCreated",
    data => {

        roomCode =
            data.code;

        showLobby();
    }
);

/*
==================================================
JOIN ROOM
==================================================
*/

function joinRoom() {

    const name =
        document.getElementById(
            "nameInput"
        ).value ||
        "Player";

    const code =
        document.getElementById(
            "roomInput"
        ).value
        .trim()
        .toUpperCase();

    if (
        code.length !== 4
    ) {

        alert(
            "Bitte einen 4-stelligen Raumcode eingeben."
        );

        return;
    }

    socket.emit(
        "joinRoom",
        {
            name,
            code,
            skin:
                mySkin
        }
    );
}

socket.on(
    "joinedRoom",
    data => {

        roomCode =
            data.code;

        showLobby();
    }
);

socket.on(
    "errorMessage",
    message => {

        alert(message);
    }
);

function showLobby() {

    document.getElementById(
        "menu"
    ).style.display =
        "none";

    document.getElementById(
        "lobby"
    ).style.display =
        "flex";

    document.getElementById(
        "roomCode"
    ).textContent =
        roomCode;
}

function copyRoomCode() {

    navigator.clipboard.writeText(
        roomCode
    );

    alert(
        "Raumcode kopiert: " +
        roomCode
    );
}

function startGame() {

    document.getElementById(
        "lobby"
    ).style.display =
        "none";

    document.getElementById(
        "game"
    ).style.display =
        "block";
}

/*
==================================================
STATE
==================================================
*/

socket.on(
    "connect",
    () => {

        myId =
            socket.id;
    }
);

socket.on(
    "state",
    data => {

        players =
            data.players || {};

        bots =
            data.bots || [];

        if (
            players[myId]
        ) {

            const me =
                players[myId];

            document.getElementById(
                "hp"
            ).textContent =
                Math.max(
                    0,
                    Math.round(
                        me.hp
                    )
                );

            document.getElementById(
                "weaponDisplay"
            ).textContent =
                me.weapon;

            document.getElementById(
                "kills"
            ).textContent =
                me.kills;

            myWeapon =
                me.weapon;

            myKills =
                me.kills;

            if (
                !me.alive
            ) {

                document.getElementById(
                    "death"
                ).style.display =
                    "flex";
            }
        }
    }
);

/*
==================================================
KEYBOARD
==================================================
*/

window.addEventListener(
    "keydown",
    e => {

        if (
            [
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight"
            ].includes(e.key)
        ) {

            e.preventDefault();

            keys[e.key] =
                true;
        }
    }
);

window.addEventListener(
    "keyup",
    e => {

        keys[e.key] =
            false;
    }
);

/*
==================================================
JOYSTICK
==================================================
*/

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );

let joystickActive =
    false;

function updateJoystick(
    x,
    y
) {

    const rect =
        joystick.getBoundingClientRect();

    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height / 2;

    let dx =
        x -
        centerX;

    let dy =
        y -
        centerY;

    const max =
        42;

    const d =
        Math.hypot(
            dx,
            dy
        );

    if (
        d > max
    ) {

        dx =
            dx /
            d *
            max;

        dy =
            dy /
            d *
            max;
    }

    stick.style.left =
        36 +
        dx +
        "px";

    stick.style.top =
        36 +
        dy +
        "px";

    joystickX =
        dx / max;

    joystickY =
        dy / max;
}

joystick.addEventListener(
    "pointerdown",
    e => {

        joystickActive =
            true;

        joystick.setPointerCapture(
            e.pointerId
        );

        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
);

joystick.addEventListener(
    "pointermove",
    e => {

        if (
            joystickActive
        ) {

            updateJoystick(
                e.clientX,
                e.clientY
            );
        }
    }
);

joystick.addEventListener(
    "pointerup",
    () => {

        joystickActive =
            false;

        joystickX = 0;

        joystickY = 0;

        stick.style.left =
            "36px";

        stick.style.top =
            "36px";
    }
);

/*
==================================================
MOVEMENT
==================================================
*/

setInterval(
    () => {

        const me =
            players[myId];

        if (!me)
            return;

        if (!me.alive)
            return;

        let x =
            me.x;

        let y =
            me.y;

        if (
            keys.ArrowUp
        )
            y -= 5;

        if (
            keys.ArrowDown
        )
            y += 5;

        if (
            keys.ArrowLeft
        )
            x -= 5;

        if (
            keys.ArrowRight
        )
            x += 5;

        x +=
            joystickX * 5;

        y +=
            joystickY * 5;

        if (
            x !== me.x ||
            y !== me.y
        ) {

            socket.emit(
                "move",
                {
                    x,
                    y
                }
            );
        }

    },
    1000 / 30
);

/*
==================================================
SHOOT BUTTON
==================================================
*/

const shootButton =
    document.getElementById(
        "shootButton"
    );

shootButton.addEventListener(
    "pointerdown",
    () => {

        shooting = true;

        shoot();
    }
);

shootButton.addEventListener(
    "pointerup",
    () => {

        shooting = false;
    }
);

/*
==================================================
SHOOT
==================================================
*/

function shoot() {

    const me =
        players[myId];

    if (!me)
        return;

    let dx = 1;

    let dy = 0;

    /*
    Joystick gibt Richtung vor.
    */

    if (
        Math.abs(
            joystickX
        ) +
        Math.abs(
            joystickY
        ) > .2
    ) {

        dx =
            joystickX;

        dy =
            joystickY;
    }

    /*
    PC:
    In Richtung des nächsten Gegners.
    */

    else {

        const targets = [
            ...Object.values(
                players
            ),
            ...bots
        ].filter(
            p =>
                p.alive &&
                p.id !== myId
        );

        if (
            targets.length
        ) {

            targets.sort(
                (a,b) =>
                    Math.hypot(
                        me.x-a.x,
                        me.y-a.y
                    ) -
                    Math.hypot(
                        me.x-b.x,
                        me.y-b.y
                    )
            );

            const target =
                targets[0];

            dx =
                target.x -
                me.x;

            dy =
                target.y -
                me.y;
        }
    }

    socket.emit(
        "shoot",
        {
            dx,
            dy
        }
    );
}

/*
==================================================
PROJECTILE

*/

socket.on(

/*

ELIMINATION

socket.on(

/*
==================================================
DRAW PLAYER
==================================================
*/

function drawCharacter(
    p
) {

    const scale =
        1;

    const x =
        p.x;

    const y =
        p.y;

    /*
    Schatten
    */

    ctx.beginPath();

    ctx.ellipse(
        x,
        y + 22,
        20,
        8,
        0,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.fill();

    /*
    Körper
    */

    const gradient =
        ctx.createLinearGradient(
            x - 18,
            y - 30,
            x + 18,
            y + 25
        );

    gradient.addColorStop(
        0,
        "#60a5fa"
    );

    gradient.addColorStop(
        1,
        "#1e3a8a"
    );

    ctx.fillStyle =
        gradient;

    ctx.beginPath();

    ctx.roundRect(
        x - 15,
        y - 8,
        30,
        32,
        8
    );

    ctx.fill();

    /*
    Kopf
    */

    ctx.beginPath();

    ctx.arc(
        x,
        y - 18,
        13,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#f2c7a5";

    ctx.fill();

    /*
    Haare / Helm
    */

    ctx.beginPath();

    ctx.arc(
        x,
        y - 22,
        13,
        Math.PI,
        0
    );

    ctx.fillStyle =
        skinColor(
            p.skin
        );

    ctx.fill();

    /*
    Waffe
    */

    ctx.strokeStyle =
        "#e5e7eb";

    ctx.lineWidth =
        5;

    ctx.beginPath();

    ctx.moveTo(
        x + 8,
        y
    );

    ctx.lineTo(
        x + 28,
        y
    );

    ctx.stroke();

    /*
    Name
    */

    ctx.font =
        "bold 12px Arial";

    ctx.textAlign =
        "center";

    ctx.fillStyle =
        "white";

    ctx.fillText(
        p.name,
        x,
        y - 42
    );

    /*
    HP
    */

    ctx.fillStyle =
        "#450a0a";

    ctx.fillRect(
        x - 20,
        y - 37,
        40,
        5
    );

    ctx.fillStyle =
        "#22c55e";

    ctx.fillRect(
        x - 20,
        y - 37,
        40 *
        Math.max(
            0,
            p.hp / 100
        ),
        5
    );
}

function skinColor(
    id
) {

    const colors = {

        standard:
            "#38bdf8",

        rare1:
            "#2563eb",

        rare2:
            "#22c55e",

        rare3:
            "#ef4444",

        rare4:
            "#a855f7",

        rare5:
            "#f97316",

        super1:
            "#06b6d4",

        super2:
            "#020617",

        super3:
            "#bae6fd",

        super4:
            "#f97316",

        super5:
            "#84cc16",

        epic1:
            "#8b5cf6",

        epic2:
            "#ec4899",

        epic3:
            "#38bdf8",

        epic4:
            "#dc2626",

        epic5:
            "#312e81",

        mythic1:
            "#f59e0b",

        mythic2:
            "#7f1d1d",

        mythic3:
            "#64748b",

        mythic4:
            "#f97316",

        mythic5:
            "#6366f1",

        legend1:
            "#facc15",

        legend2:
            "#fde68a",

        legend3:
            "#ffffff"
    };

    return (
        colors[id] ||
        "#38bdf8"
    );
}

/*
==================================================
ARENA
==================================================
*/

function drawArena() {

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;

    ctx.fillStyle =
        "#17212b";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    /*
    Raster
    */

    ctx.strokeStyle =
        "rgba(255,255,255,.04)";

    ctx.lineWidth =
        1;

    for (
        let x = 0;
        x < width;
        x += 40
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            height
        );

        ctx.stroke();
    }

    for (
        let y = 0;
        y < height;
        y += 40
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            width,
            y
        );

        ctx.stroke();
    }

    /*
    Wände
    */

    const walls = [

        {
            x: 100,
            y: 120,
            w: 300,
            h: 35
        },

        {
            x: 600,
            y: 100,
            w: 350,
            h: 35
        },

        {
            x: 300,
            y: 300,
            w: 250,
            h: 35
        },

        {
            x: 700,
            y: 330,
            w: 250,
            h: 35
        },

        {
            x: 150,
            y: 520,
            w: 350,
            h: 35
        },

        {
            x: 700,
            y: 520,
            w: 300,
            h: 35
        }
    ];

    walls.forEach(
        wall => {

            const g =
                ctx.createLinearGradient(
                    wall.x,
                    wall.y,
                    wall.x,
                    wall.y +
                    wall.h
                );

            g.addColorStop(
                0,
                "#64748b"
            );

            g.addColorStop(
                1,
                "#1e293b"
            );

            ctx.fillStyle =
                g;

            ctx.fillRect(
                wall.x,
                wall.y,
                wall.w,
                wall.h
            );

            ctx.strokeStyle =
                "#94a3b8";

            ctx.strokeRect(
                wall.x,
                wall.y,
                wall.w,
                wall.h
            );
        }
    );
}

/*
==================================================
GAME LOOP
==================================================
*/

function gameLoop(
    time
) {

    const dt =
        Math.min(
            32,
            time - lastTime
        );

    lastTime =
        time;

    drawArena();

    /*
    Bullets
    */

    bullets =
        bullets.filter(
            bullet => {

                bullet.x +=
                    bullet.dx *
                    bullet.speed;

                bullet.y +=
                    bullet.dy *
                    bullet.speed;

                bullet.life--;

                ctx.beginPath();

                ctx.arc(
                    bullet.x,
                    bullet.y,
                    5,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    bullet.color;

                ctx.shadowBlur =
                    15;

                ctx.shadowColor =
                    bullet.color;

                ctx.fill();

                ctx.shadowBlur =
                    0;

                return (
                    bullet.life > 0
                );
            }
        );

    /*
    Players
    */

    Object.values(
        players
    ).forEach(
        p => {

            if (
                p.alive
            ) {

                drawCharacter(
                    p
                );
            }
        }
    );

    /*
    Bots
    */

    bots.forEach(
        bot => {

            if (
                bot.alive
            ) {

                drawCharacter(
                    bot
                );
            }
        }
    );

    /*
    Effects
    */

    effects =
        effects.filter(
            effect => {

                effect.life--;

                if (
                    effect.type ===
                    "muzzle"
                ) {

                    ctx.beginPath();

                    ctx.arc(
                        effect.x,
                        effect.y,
                        12 +
                        (10 -
                        effect.life),
                        0,
                        Math.PI * 2
                    );

                    ctx.strokeStyle =
                        "#facc15";

                    ctx.lineWidth =
                        3;

                    ctx.stroke();
                }

                if (
                    effect.type ===
                    "slash"
                ) {

                    ctx.beginPath();

                    ctx.arc(
                        effect.x,
                        effect.y,
                        50,
                        -.8,
                        .8
                    );

                    ctx.strokeStyle =
                        "#fff";

                    ctx.lineWidth =
                        8;

                    ctx.stroke();
                }

                if (
                    effect.text
                ) {

                    ctx.font =
                        "bold 18px Arial";

                    ctx.fillStyle =
                        "#facc15";

                    ctx.fillText(
                        effect.text,
                        30,
                        120
                    );
                }

                return (
                    effect.life > 0
                );
            }
        );

    requestAnimationFrame(
        gameLoop
    );
}

requestAnimationFrame(
    gameLoop
);

</script>
