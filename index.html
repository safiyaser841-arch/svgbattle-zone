<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>SVG Battle Zone</title>

<script src="/socket.io/socket.io.js"></script>

<style>

* {
    box-sizing: border-box;
    user-select: none;
}

body {
    margin: 0;
    overflow: hidden;
    background: #101827;
    font-family: Arial, sans-serif;
    color: white;
}

#menu {

    position: fixed;
    inset: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 12px;

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #1e3a8a
    );

    z-index: 20;
}

#menu h1 {

    font-size: 42px;

    margin: 0 0 15px;

    color: #38bdf8;

    text-shadow:
    0 0 15px #38bdf8;
}

input,
select,
button {

    width: 270px;

    padding: 14px;

    border: none;

    border-radius: 10px;

    font-size: 16px;
}

button {

    background: #2563eb;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

button:hover {

    background: #3b82f6;
}

#game {

    display: none;

    position: fixed;

    inset: 0;
}

canvas {

    width: 100%;

    height: 100%;

    display: block;

    background: #263238;
}

#hud {

    position: fixed;

    top: 10px;

    left: 10px;

    z-index: 5;
}

.hudBox {

    background: rgba(0,0,0,.65);

    padding: 8px 14px;

    border-radius: 8px;

    margin-bottom: 5px;
}

#joystick {

    position: fixed;

    width: 130px;

    height: 130px;

    left: 25px;

    bottom: 25px;

    border-radius: 50%;

    background:
    rgba(255,255,255,.15);

    border:
    2px solid
    rgba(255,255,255,.3);

    z-index: 10;
}

#stick {

    position: absolute;

    width: 55px;

    height: 55px;

    left: 36px;

    top: 36px;

    border-radius: 50%;

    background:
    rgba(255,255,255,.7);
}

#shoot {

    position: fixed;

    right: 25px;

    bottom: 40px;

    width: 100px;

    height: 100px;

    border-radius: 50%;

    background: #ef4444;

    border: 4px solid white;

    z-index: 10;
}

@media (min-width: 900px) {

    #joystick,
    #shoot {

        display: none;
    }
}

</style>

</head>

<body>

<div id="menu">

<h1>⚔️ BATTLE ZONE</h1>

<input
id="name"
placeholder="Dein Name">

<select id="skin">

<option value="blue">
🔵 Blau
</option>

<option value="red">
🔴 Rot
</option>

<option value="green">
🟢 Grün
</option>

<option value="gold">
🟡 Gold
</option>

</select>

<select id="bots">

<option value="0">
0 Bots
</option>

<option value="1">
1 Bot
</option>

<option value="2">
2 Bots
</option>

<option value="3">
3 Bots
</option>

<option value="4">
4 Bots
</option>

<option value="5">
5 Bots
</option>

</select>

<button onclick="createRoom()">
🏠 Raum erstellen
</button>

<input
id="roomCode"
placeholder="Raum-Code">

<button onclick="joinRoom()">
👥 Raum beitreten
</button>

</div>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">

<div class="hudBox">
❤️ <span id="health">100</span>
</div>

<div class="hudBox">
🏠 Raum:
<span id="roomDisplay">---</span>
</div>

</div>

<div id="joystick">

<div id="stick"></div>

</div>

<button id="shoot">
🔫
</button>

</div>

<script>

const socket = io();

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

let W;
let H;

function resize() {

    W = canvas.width =
    window.innerWidth;

    H = canvas.height =
    window.innerHeight;
}

resize();

window.addEventListener(
"resize",
resize
);

let player = {

    x: 400,

    y: 300,

    hp: 100,

    skin: "blue"
};

let players = {};

let bullets = [];

let keys = {};

let joystickX = 0;
let joystickY = 0;

let mouseX = 500;
let mouseY = 300;

const walls = [

    {
        x: 150,
        y: 120,
        w: 250,
        h: 35
    },

    {
        x: 600,
        y: 120,
        w: 250,
        h: 35
    },

    {
        x: 150,
        y: 500,
        w: 250,
        h: 35
    },

    {
        x: 600,
        y: 500,
        w: 250,
        h: 35
    },

    {
        x: 450,
        y: 250,
        w: 100,
        h: 220
    }

];

document.addEventListener(
"keydown",
(e) => {

    keys[e.key.toLowerCase()] = true;

});

document.addEventListener(
"keyup",
(e) => {

    keys[e.key.toLowerCase()] = false;

});

canvas.addEventListener(
"mousemove",
(e) => {

    mouseX = e.clientX;
    mouseY = e.clientY;

});

canvas.addEventListener(
"mousedown",
shoot
);

document
.getElementById("shoot")
.addEventListener(
"touchstart",
(e) => {

    e.preventDefault();

    shoot();

});

function createRoom() {

    player.skin =
    document.getElementById(
        "skin"
    ).value;

    socket.emit(
        "createRoom",
        {

            name:
            document.getElementById(
                "name"
            ).value || "Player",

            skin: player.skin,

            bots:
            Number(
                document.getElementById(
                    "bots"
                ).value
            )

        }
    );

}

function joinRoom() {

    player.skin =
    document.getElementById(
        "skin"
    ).value;

    socket.emit(
        "joinRoom",
        {

            name:
            document.getElementById(
                "name"
            ).value || "Player",

            skin: player.skin,

            code:
            document.getElementById(
                "roomCode"
            ).value
            .toUpperCase()

        }
    );

}

socket.on(
"roomCreated",
(code) => {

    startGame(code);

});

socket.on(
"joinedRoom",
(code) => {

    startGame(code);

});

socket.on(
"errorMessage",
(message) => {

    alert(message);

});

socket.on(
"roomUpdate",
(data) => {

    players =
    data.players || {};

});

socket.on(
"playerMove",
(p) => {

    players[p.id] = p;

});

socket.on(
"shot",
(b) => {

    bullets.push({

        x: b.x,

        y: b.y,

        dx: b.dx,

        dy: b.dy,

        owner: b.id

    });

});

function startGame(code) {

    document.getElementById(
        "menu"
    ).style.display = "none";

    document.getElementById(
        "game"
    ).style.display = "block";

    document.getElementById(
        "roomDisplay"
    ).textContent = code;

}

function blocked(x,y) {

    for (const wall of walls) {

        if (

            x > wall.x - 20 &&

            x < wall.x +
            wall.w + 20 &&

            y > wall.y - 20 &&

            y < wall.y +
            wall.h + 20

        ) {

            return true;
        }
    }

    return false;
}

function move() {

    let dx = 0;
    let dy = 0;

    if (
        keys["w"] ||
        keys["arrowup"]
    ) dy -= 4;

    if (
        keys["s"] ||
        keys["arrowdown"]
    ) dy += 4;

    if (
        keys["a"] ||
        keys["arrowleft"]
    ) dx -= 4;

    if (
        keys["d"] ||
        keys["arrowright"]
    ) dx += 4;

    dx += joystickX * 4;
    dy += joystickY * 4;

    if (!blocked(
        player.x + dx,
        player.y
    )) {

        player.x += dx;
    }

    if (!blocked(
        player.x,
        player.y + dy
    )) {

        player.y += dy;
    }

    player.x =
    Math.max(
        25,
        Math.min(
            W - 25,
            player.x
        )
    );

    player.y =
    Math.max(
        25,
        Math.min(
            H - 25,
            player.y
        )
    );

    socket.emit(
        "move",
        {
            x: player.x,
            y: player.y
        }
    );

}

function shoot() {

    const angle =
    Math.atan2(
        mouseY - player.y,
        mouseX - player.x
    );

    const speed = 10;

    bullets.push({

        x: player.x,

        y: player.y,

        dx:
        Math.cos(angle) *
        speed,

        dy:
        Math.sin(angle) *
        speed,

        owner: "me"

    });

    socket.emit(
        "shoot",
        {

            x: player.x,

            y: player.y,

            dx:
            Math.cos(angle) *
            speed,

            dy:
            Math.sin(angle) *
            speed

        }
    );

}

function colorForSkin(skin) {

    if (skin === "red")
        return "#ef4444";

    if (skin === "green")
        return "#22c55e";

    if (skin === "gold")
        return "#facc15";

    return "#3b82f6";
}

function drawCharacter(
    x,
    y,
    skin,
    name
) {

    ctx.fillStyle =
    colorForSkin(skin);

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        22,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle = "white";

    ctx.beginPath();

    ctx.arc(
        x - 7,
        y - 5,
        3,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 7,
        y - 5,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.font =
    "12px Arial";

    ctx.textAlign =
    "center";

    ctx.fillStyle =
    "white";

    ctx.fillText(
        name || "Player",
        x,
        y - 30
    );

}

function draw() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    // Boden

    ctx.fillStyle =
    "#334155";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    // Raster

    ctx.strokeStyle =
    "rgba(255,255,255,.04)";

    for (
        let x = 0;
        x < W;
        x += 40
    ) {

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(x,H);

        ctx.stroke();

    }

    for (
        let y = 0;
        y < H;
        y += 40
    ) {

        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(W,y);

        ctx.stroke();

    }

    // Wände

    for (const wall of walls) {

        ctx.fillStyle =
        "#475569";

        ctx.fillRect(
            wall.x,
            wall.y,
            wall.w,
            wall.h
        );

        ctx.strokeStyle =
        "#94a3b8";

        ctx.strokeRect(
            wall.x,
            wall.y,
            wall.w,
            wall.h
        );

    }

    // Spieler

    drawCharacter(
        player.x,
        player.y,
        player.skin,
        "DU"
    );

    // Andere Spieler

    for (
        const id in players
    ) {

        if (id === socket.id)
            continue;

        const p =
        players[id];

        drawCharacter(
            p.x,
            p.y,
            p.skin,
            p.name
        );

    }

    // Schüsse

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const b =
        bullets[i];

        const oldX =
        b.x;

        const oldY =
        b.y;

        b.x += b.dx;
        b.y += b.dy;

        if (
            blocked(
                b.x,
                b.y
            )
        ) {

            // Treffer-Effekt

            ctx.fillStyle =
            "#facc15";

            ctx.beginPath();

            ctx.arc(
                oldX,
                oldY,
                12,
                0,
                Math.PI * 2
            );

            ctx.fill();

            bullets.splice(
                i,
                1
            );

            continue;
        }

        ctx.strokeStyle =
        "#facc15";

        ctx.lineWidth = 4;

        ctx.beginPath();

        ctx.moveTo(
            oldX,
            oldY
        );

        ctx.lineTo(
            b.x,
            b.y
        );

        ctx.stroke();

        ctx.fillStyle =
        "#fff";

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();

        if (
            b.x < 0 ||
            b.x > W ||
            b.y < 0 ||
            b.y > H
        ) {

            bullets.splice(
                i,
                1
            );

        }

    }

    requestAnimationFrame(
        draw
    );

}

function joystickStart(e) {

    e.preventDefault();

    joystickMove(e);

}

function joystickMove(e) {

    e.preventDefault();

    const touch =
    e.touches[0];

    if (!touch) return;

    const joystick =
    document.getElementById(
        "joystick"
    );

    const rect =
    joystick.getBoundingClientRect();

    const centerX =
    rect.left +
    rect.width / 2;

    const centerY =
    rect.top +
    rect.height / 2;

    let dx =
    touch.clientX -
    centerX;

    let dy =
    touch.clientY -
    centerY;

    const max = 40;

    const distance =
    Math.sqrt(
        dx * dx +
        dy * dy
    );

    if (distance > max) {

        dx =
        dx / distance *
        max;

        dy =
        dy / distance *
        max;
    }

    joystickX =
    dx / max;

    joystickY =
    dy / max;

    document.getElementById(
        "stick"
    ).style.transform =
    `translate(${dx}px,${dy}px)`;

}

function joystickEnd() {

    joystickX = 0;

    joystickY = 0;

    document.getElementById(
        "stick"
    ).style.transform =
    "translate(0,0)";

}

const joystick =
document.getElementById(
    "joystick"
);

joystick.addEventListener(
"touchstart",
joystickStart,
{passive:false}
);

joystick.addEventListener(
"touchmove",
joystickMove,
{passive:false}
);

joystick.addEventListener(
"touchend",
joystickEnd
);

draw();

</script>

</body>

</html>
