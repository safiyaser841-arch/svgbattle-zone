<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>SVG Battle Zone</title>

<script src="/socket.io/socket.io.js"></script>

<style>

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
}

body {
    margin: 0;
    overflow: hidden;
    background: #0f172a;
    font-family: Arial;
    color: white;
}

#menu {
    position: fixed;
    inset: 0;
    z-index: 20;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    gap: 12px;

    background:
    radial-gradient(
        circle at center,
        #1e40af,
        #020617
    );
}

#menu h1 {
    font-size: 42px;
    color: #38bdf8;
    text-shadow: 0 0 20px #38bdf8;
}

input,
select,
button {
    width: 280px;
    padding: 14px;
    border: 0;
    border-radius: 12px;
    font-size: 16px;
}

button {
    background: #2563eb;
    color: white;
    font-weight: bold;
}

#game {
    display: none;
    position: fixed;
    inset: 0;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

#hud {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 5;
}

.box {
    background: rgba(0,0,0,.7);
    padding: 8px 14px;
    border-radius: 8px;
    margin-bottom: 5px;
}

#joystick {
    position: fixed;

    left: 25px;
    bottom: 25px;

    width: 140px;
    height: 140px;

    border-radius: 50%;

    background:
    rgba(255,255,255,.12);

    border:
    3px solid
    rgba(255,255,255,.3);

    z-index: 10;
}

#stick {
    position: absolute;

    left: 40px;
    top: 40px;

    width: 60px;
    height: 60px;

    border-radius: 50%;

    background:
    rgba(255,255,255,.75);
}

#shoot {
    position: fixed;

    right: 25px;
    bottom: 40px;

    width: 105px;
    height: 105px;

    border-radius: 50%;

    background: #ef4444;

    border: 5px solid white;

    z-index: 10;

    font-size: 25px;
}

#weapon {
    position: fixed;

    bottom: 10px;
    left: 50%;

    transform: translateX(-50%);

    background:
    rgba(0,0,0,.7);

    padding: 10px 20px;

    border-radius: 12px;

    z-index: 5;
}

@media(min-width:900px) {

    #joystick,
    #shoot {
        display: none;
    }
}

</style>

</head>

<body>

<div id="menu">

<h1>⚔️ BATTLE ZONE</h1>

<input
id="name"
placeholder="Dein Name">

<select id="skin">

<option value="standard">
⭐ Standard
</option>

<option value="rare1">
🔵 Selten 1
</option>

<option value="rare2">
🔵 Selten 2
</option>

<option value="rare3">
🔵 Selten 3
</option>

<option value="rare4">
🔵 Selten 4
</option>

<option value="rare5">
🔵 Selten 5
</option>

<option value="super1">
🟣 Superselten 1
</option>

<option value="super2">
🟣 Superselten 2
</option>

<option value="super3">
🟣 Superselten 3
</option>

<option value="super4">
🟣 Superselten 4
</option>

<option value="super5">
🟣 Superselten 5
</option>

<option value="epic1">
🟪 Episch 1
</option>

<option value="epic2">
🟪 Episch 2
</option>

<option value="epic3">
🟪 Episch 3
</option>

<option value="epic4">
🟪 Episch 4
</option>

<option value="epic5">
🟪 Episch 5
</option>

<option value="mythic1">
🟠 Mythisch 1
</option>

<option value="mythic2">
🟠 Mythisch 2
</option>

<option value="mythic3">
🟠 Mythisch 3
</option>

<option value="mythic4">
🟠 Mythisch 4
</option>

<option value="mythic5">
🟠 Mythisch 5
</option>

<option value="legend1">
🟡 Legendär 1
</option>

<option value="legend2">
🟡 Legendär 2
</option>

<option value="legend3">
🟡 Legendär 3
</option>

<option value="special">
👑 SPEZIAL 2001
</option>

</select>

<select id="bots">

<option value="0">
0 Bots
</option>

<option value="1">
1 Bot
</option>

<option value="2">
2 Bots
</option>

<option value="3">
3 Bots
</option>

<option value="4">
4 Bots
</option>

<option value="5">
5 Bots
</option>

</select>

<button onclick="createRoom()">
🏠 Raum erstellen
</button>

<input
id="room"
placeholder="Raum-Code">

<button onclick="joinRoom()">
👥 Beitreten
</button>

</div>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">

<div class="box">
❤️ <span id="hp">100</span>
</div>

<div class="box">
💀 Kills:
<span id="kills">0</span>
</div>

<div class="box">
🏠 Raum:
<span id="roomText">---</span>
</div>

</div>

<div id="weapon">
🔫 <span id="weaponName">---</span>
</div>

<div id="joystick">

<div id="stick"></div>

</div>

<button id="shoot">
🔥
</button>

</div>

<script>

const socket = io();

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

canvas.width = W;
canvas.height = H;

window.addEventListener(
"resize",
() => {

    W = innerWidth;
    H = innerHeight;

    canvas.width = W;
    canvas.height = H;

});

let kills =
Number(
localStorage.getItem(
"battleKills"
) || 0
);

document.getElementById(
"kills"
).textContent = kills;

let player = {

    x: W / 2,
    y: H / 2,

    hp: 100,

    alive: true,

    skin: "standard",

    weapon: ""
};

let entities = {};

let bullets = [];

let keys = {};

let joyX = 0;
let joyY = 0;

let aimX = W / 2 + 100;
let aimY = H / 2;

const walls = [

    {
        x: W * .1,
        y: H * .2,
        w: 230,
        h: 35
    },

    {
        x: W * .65,
        y: H * .2,
        w: 230,
        h: 35
    },

    {
        x: W * .1,
        y: H * .7,
        w: 230,
        h: 35
    },

    {
        x: W * .65,
        y: H * .7,
        w: 230,
        h: 35
    },

    {
        x: W * .43,
        y: H * .35,
        w: 110,
        h: 220
    }

];

document.addEventListener(
"keydown",
e => {

    keys[e.key] = true;

});

document.addEventListener(
"keyup",
e => {

    keys[e.key] = false;

});

canvas.addEventListener(
"mousemove",
e => {

    aimX = e.clientX;
    aimY = e.clientY;

});

canvas.addEventListener(
"mousedown",
shoot
);

document
.getElementById("shoot")
.addEventListener(
"touchstart",
e => {

    e.preventDefault();

    shoot();

},
{passive:false}
);

function createRoom() {

    player.skin =
    document.getElementById(
        "skin"
    ).value;

    socket.emit(
        "createRoom",
        {

            name:
            document.getElementById(
                "name"
            ).value || "Player",

            skin: player.skin,

            bots:
            Number(
                document.getElementById(
                    "bots"
                ).value
            )

        }
    );

}

function joinRoom() {

    player.skin =
    document.getElementById(
        "skin"
    ).value;

    socket.emit(
        "joinRoom",
        {

            name:
            document.getElementById(
                "name"
            ).value || "Player",

            skin: player.skin,

            code:
            document.getElementById(
                "room"
            ).value.toUpperCase()

        }
    );

}

socket.on(
"roomCreated",
data => {

    start(data.code);

});

socket.on(
"joinedRoom",
data => {

    start(data.code);

});

socket.on(
"errorMessage",
msg => {

    alert(msg);

});

socket.on(
"state",
data => {

    entities = data.players || {};

    for (
        const bot of data.bots || []
    ) {

        entities[bot.id] = bot;

    }

});

socket.on(
"bullet",
data => {

    bullets.push({

        x: data.x,
        y: data.y,

        dx: data.dx,
        dy: data.dy,

        damage: data.damage,

        color: data.color,

        owner: data.owner

    });

});

socket.on(
"elimination",
data => {

    if (
        data.killer ===
        document.getElementById(
            "name"
        ).value
    ) {

        kills++;

        localStorage.setItem(
            "battleKills",
            kills
        );

        document.getElementById(
            "kills"
        ).textContent =
        kills;

    }

});

function start(code) {

    document.getElementById(
        "menu"
    ).style.display =
    "none";

    document.getElementById(
        "game"
    ).style.display =
    "block";

    document.getElementById(
        "roomText"
    ).textContent =
    code;

}

function blocked(x,y) {

    for (
        const wall of walls
    ) {

        if (

            x > wall.x - 22 &&

            x <
            wall.x +
            wall.w +
            22 &&

            y > wall.y - 22 &&

            y <
            wall.y +
            wall.h +
            22

        ) {

            return true;

        }

    }

    return false;

}

function move() {

    let dx = 0;
    let dy = 0;

    // NUR PFEILTASTEN

    if (
        keys["ArrowUp"]
    ) dy -= 4;

    if (
        keys["ArrowDown"]
    ) dy += 4;

    if (
        keys["ArrowLeft"]
    ) dx -= 4;

    if (
        keys["ArrowRight"]
    ) dx += 4;

    // MOBILE

    dx += joyX * 4;
    dy += joyY * 4;

    if (
        !blocked(
            player.x + dx,
            player.y
        )
    ) {

        player.x += dx;

    }

    if (
        !blocked(
            player.x,
            player.y + dy
        )
    ) {

        player.y += dy;

    }

    player.x =
    Math.max(
        25,
        Math.min(
            W - 25,
            player.x
        )
    );

    player.y =
    Math.max(
        25,
        Math.min(
            H - 25,
            player.y
        )
    );

    socket.emit(
        "move",
        {
            x: player.x,
            y: player.y
        }
    );

}

function shoot() {

    if (!player.alive)
        return;

    const angle =
    Math.atan2(
        aimY - player.y,
        aimX - player.x
    );

    const speed = 12;

    bullets.push({

        x: player.x,
        y: player.y,

        dx:
        Math.cos(angle) *
        speed,

        dy:
        Math.sin(angle) *
        speed,

        damage: 15,

        color: "#facc15",

        owner: "me"

    });

    socket.emit(
        "shoot",
        {

            x: player.x,
            y: player.y,

            dx:
            Math.cos(angle) *
            speed,

            dy:
            Math.sin(angle) *
            speed

        }
    );

}

function skinColor(skin) {

    if (
        skin.startsWith("rare")
    )
        return "#38bdf8";

    if (
        skin.startsWith("super")
    )
        return "#a855f7";

    if (
        skin.startsWith("epic")
    )
        return "#ec4899";

    if (
        skin.startsWith("mythic")
    )
        return "#f97316";

    if (
        skin.startsWith("legend")
    )
        return "#facc15";

    if (
        skin === "special"
    )
        return "#ffffff";

    if (
        skin === "botRed"
    )
        return "#ef4444";

    if (
        skin === "botBlue"
    )
        return "#3b82f6";

    return "#64748b";

}

function drawCharacter(
    x,
    y,
    skin,
    name
) {

    const color =
    skinColor(skin);

    // Schatten

    ctx.fillStyle =
    "rgba(0,0,0,.3)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y + 18,
        22,
        9,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    // Körper

    ctx.fillStyle =
    color;

    ctx.beginPath();

    ctx.roundRect(
        x - 18,
        y - 10,
        36,
        38,
        10
    );

    ctx.fill();

    // Kopf

    ctx.beginPath();

    ctx.arc(
        x,
        y - 18,
        15,
        0,
        Math.PI * 2
    );

    ctx.fill();

    // Augen

    ctx.fillStyle =
    "white";

    ctx.beginPath();

    ctx.arc(
        x - 5,
        y - 20,
        3,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 5,
        y - 20,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();

    // Name

    ctx.font =
    "12px Arial";

    ctx.textAlign =
    "center";

    ctx.fillStyle =
    "white";

    ctx.fillText(
        name,
        x,
        y - 42
    );

}

function updateBullets() {

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const b =
        bullets[i];

        const oldX =
        b.x;

        const oldY =
        b.y;

        b.x += b.dx;
        b.y += b.dy;

        // Wand getroffen

        if (
            blocked(
                b.x,
                b.y
            )
        ) {

            ctx.fillStyle =
            "#facc15";

            ctx.beginPath();

            ctx.arc(
                b.x,
                b.y,
                12,
                0,
                Math.PI * 2
            );

            ctx.fill();

            bullets.splice(
                i,
                1
            );

            continue;

        }

        // Projektil sichtbar

        ctx.strokeStyle =
        b.color;

        ctx.lineWidth = 5;

        ctx.beginPath();

        ctx.moveTo(
            oldX,
            oldY
        );

        ctx.lineTo(
            b.x,
            b.y
        );

        ctx.stroke();

        ctx.fillStyle =
        "white";

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();

        if (
            b.x < 0 ||
            b.x > W ||
            b.y < 0 ||
            b.y > H
        ) {

            bullets.splice(
                i,
                1
            );

        }

    }

}

function drawGame() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    ctx.fillStyle =
    "#334155";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    // Wände

    for (
        const wall of walls
    ) {

        ctx.fillStyle =
        "#475569";

        ctx.fillRect(
            wall.x,
            wall.y,
            wall.w,
            wall.h
        );

        ctx.strokeStyle =
        "#94a3b8";

        ctx.lineWidth = 3;

        ctx.strokeRect(
            wall.x,
            wall.y,
            wall.w,
            wall.h
        );

    }

    move();

    drawCharacter(
        player.x,
        player.y,
        player.skin,
        "DU"
    );

    for (
        const id in entities
    ) {

        const p =
        entities[id];

        if (
            id === socket.id
        )
            continue;

        if (
            p.alive === false
        )
            continue;

        drawCharacter(
            p.x,
            p.y,
            p.skin,
            p.name
        );

    }

    updateBullets();

    document.getElementById(
        "hp"
    ).textContent =
    player.hp;

    document.getElementById(
        "weaponName"
    ).textContent =
    player.weapon || "Random";

    requestAnimationFrame(
        drawGame
    );

}

const joystick =
document.getElementById(
    "joystick"
);

const stick =
document.getElementById(
    "stick"
);

function joystickMove(e) {

    e.preventDefault();

    const touch =
    e.touches[0];

    if (!touch)
        return;

    const r =
    joystick.getBoundingClientRect();

    const cx =
    r.left + r.width / 2;

    const cy =
    r.top + r.height / 2;

    let dx =
    touch.clientX - cx;

    let dy =
    touch.clientY - cy;

    const max = 42;

    const d =
    Math.hypot(dx,dy);

    if (d > max) {

        dx =
        dx / d * max;

        dy =
        dy / d * max;

    }

    joyX =
    dx / max;

    joyY =
    dy / max;

    stick.style.transform =
    `translate(${dx}px,${dy}px)`;

}

function joystickEnd() {

    joyX = 0;
    joyY = 0;

    stick.style.transform =
    "translate(0,0)";

}

joystick.addEventListener(
"touchstart",
joystickMove,
{passive:false}
);

joystick.addEventListener(
"touchmove",
joystickMove,
{passive:false}
);

joystick.addEventListener(
"touchend",
joystickEnd
);

drawGame();

</script>

</body>
</html>
