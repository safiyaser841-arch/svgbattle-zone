<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Battle Zone</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

body{
    margin:0;
    background:#080b10;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

canvas{
    display:block;
    margin:auto;
    background:#263b29;
    max-width:100vw;
    max-height:100vh;
}

#menu{
    position:fixed;
    inset:0;
    z-index:20;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:
    radial-gradient(circle,#263d59 0%,#090c12 70%);
}

#menu h1{
    font-size:60px;
    margin:0;

    text-shadow:
    0 0 10px #42a5ff,
    0 0 30px #42a5ff;
}

#menu p{
    color:#bbb;
    margin:8px 0 25px;
}

input{
    width:240px;
    padding:14px;
    border:0;
    border-radius:10px;

    text-align:center;
    font-size:18px;
    text-transform:uppercase;

    outline:none;
}

button{
    margin:7px;
    padding:13px 22px;

    border:0;
    border-radius:10px;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    transition:.15s;
}

button:hover{
    transform:scale(1.06);
}

.primary{
    background:#309cff;
    color:white;
}

.secondary{
    background:#30343b;
    color:white;
}

#status{
    margin-top:10px;
    color:#72ff91;
}

#hud{
    position:fixed;
    top:15px;
    left:15px;

    z-index:10;

    font-size:18px;
    line-height:1.7;

    text-shadow:2px 2px 5px black;
}

#weapon{
    position:fixed;

    bottom:20px;
    left:50%;

    transform:translateX(-50%);

    z-index:10;

    padding:10px 20px;

    background:rgba(0,0,0,.65);

    border-radius:12px;

    font-size:20px;
    font-weight:bold;
}

#message{
    position:fixed;

    top:40%;
    left:0;

    width:100%;

    z-index:15;

    text-align:center;

    font-size:55px;
    font-weight:bold;

    text-shadow:
    0 0 10px black,
    0 0 30px black;

    pointer-events:none;
}

#help{
    position:fixed;

    bottom:10px;
    left:10px;

    z-index:10;

    color:#ccc;
    font-size:13px;

    opacity:.7;
}

#crosshair{
    position:fixed;

    width:18px;
    height:18px;

    border:2px solid white;
    border-radius:50%;

    pointer-events:none;

    z-index:12;

    transform:translate(-50%,-50%);

    box-shadow:0 0 5px black;
}

.bar{
    width:160px;
    height:8px;

    background:#222;

    border-radius:5px;

    overflow:hidden;

    margin-top:2px;
}

#hpbar{
    height:100%;
    width:100%;
    background:#29d66d;
}

#shieldbar{
    height:100%;
    width:100%;
    background:#35bfff;
}
</style>
</head>

<body>

<div id="menu">

    <h1>⚡ BATTLE ZONE</h1>

    <p>Fight • Survive • Win</p>

    <input
        id="room"
        maxlength="6"
        placeholder="RAUMCODE"
    >

    <div>

        <button
            class="primary"
            onclick="createRoom()"
        >
            🎮 Raum erstellen
        </button>

        <button
            class="secondary"
            onclick="joinRoom()"
        >
            👥 Beitreten
        </button>

    </div>

    <button
        class="secondary"
        onclick="startTraining()"
    >
        🏋️ Training
    </button>

    <div id="status">
        Verbinde mit Server...
    </div>

</div>


<div id="hud">

    ❤️ <span id="hp">100</span>

    <div class="bar">
        <div id="hpbar"></div>
    </div>

    🛡️ <span id="shield">50</span>

    <div class="bar">
        <div id="shieldbar"></div>
    </div>

    ☠️ Kills:
    <span id="kills">0</span>

    <br>

    ⭐ Level:
    <span id="level">1</span>

    <br>

    👥 Spieler:
    <span id="players">0</span>

</div>


<div id="weapon">
    🔫 <span id="weaponName">Keine Waffe</span>
</div>


<div id="message"></div>

<div id="crosshair"></div>


<div id="help">
    ⬆️⬇️⬅️➡️ Bewegen |
    Maus Zielen |
    Linksklick Angreifen
</div>


<canvas
    id="game"
    width="1000"
    height="650"
></canvas>


<script>

/* =========================================
   SERVER
========================================= */

/*
    SPÄTER deine Render-Adresse eintragen.

    Beispiel:

    const SERVER_URL =
        "wss://battle-zone.onrender.com";

*/

const SERVER_URL =
    "wss://DEIN-SERVER.onrender.com";


let socket = null;

let myId = null;

let connected = false;

let gameStarted = false;

const players = {};

let mouse = {
    x:500,
    y:325,
    down:false
};

const keys = {};

let particles = [];

let floatingTexts = [];

let lastAttack = 0;


/* =========================================
   CANVAS
========================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


/* =========================================
   WEAPON NAMES
========================================= */

const weaponNames = {

    pistol:"🔫 Pistole",

    smg:"🔫 SMG",

    shotgun:"💥 Shotgun",

    sniper:"🎯 Sniper",

    sword:"⚔️ Schwert",

    hammer:"🔨 Hammer"

};


/* =========================================
   CONNECT
========================================= */

function connectServer(){

    if(
        SERVER_URL.includes(
            "DEIN-SERVER"
        )
    ){

        setStatus(
            "⚠️ Server-Adresse fehlt"
        );

        return;

    }

    socket =
        new WebSocket(
            SERVER_URL
        );

    socket.onopen = () => {

        connected = true;

        setStatus(
            "🟢 Server verbunden"
        );

    };


    socket.onclose = () => {

        connected = false;

        setStatus(
            "🔴 Verbindung verloren"
        );

    };


    socket.onerror = () => {

        setStatus(
            "❌ Server nicht erreichbar"
        );

    };


    socket.onmessage = event => {

        let data;

        try{

            data =
                JSON.parse(
                    event.data
                );

        }catch{

            return;

        }

        handleServerMessage(
            data
        );

    };

}


function send(data){

    if(
        socket &&
        socket.readyState ===
        WebSocket.OPEN
    ){

        socket.send(
            JSON.stringify(data)
        );

    }

}


/* =========================================
   ROOM
========================================= */

function createRoom(){

    if(!connected){

        setStatus(
            "❌ Nicht mit Server verbunden"
        );

        return;

    }

    const code =
        Math.random()
        .toString(36)
        .substring(2,8)
        .toUpperCase();

    document.getElementById(
        "room"
    ).value = code;

    send({

        type:"create",

        room:code

    });

}


function joinRoom(){

    if(!connected){

        setStatus(
            "❌ Nicht mit Server verbunden"
        );

        return;

    }

    const code =
        document.getElementById(
            "room"
        ).value
        .trim()
        .toUpperCase();

    if(
        code.length < 3
    ){

        setStatus(
            "❌ Raumcode eingeben"
        );

        return;

    }

    send({

        type:"join",

        room:code

    });

}


function startTraining(){

    if(!connected){

        setStatus(
            "❌ Server nicht verbunden"
        );

        return;

    }

    const code =
        "TRAIN" +
        Math.floor(
            Math.random()*999
        );

    send({

        type:"create",

        room:code

    });

}


/* =========================================
   SERVER MESSAGES
========================================= */

function handleServerMessage(data){

    if(data.type==="id"){

        myId =
            data.id;

    }


    if(
        data.type==="created" ||
        data.type==="joined"
    ){

        gameStarted = true;

        document.getElementById(
            "menu"
        ).style.display =
            "none";

        setStatus(
            "Raum: "+data.room
        );


        if(
            data.type==="created"
        ){

            setTimeout(
                () => {

                    send({
                        type:"addBots"
                    });

                },
                500
            );

        }

    }


    if(data.type==="state"){

        Object.keys(
            players
        ).forEach(id => {

            if(
                !data.players[id]
            ){

                delete players[id];

            }

        });


        Object.assign(
            players,
            data.players
        );


        updateHUD();

    }


    if(
        data.type==="elimination"
    ){

        createExplosion(
            randomX(),
            randomY()
        );


        if(
            data.killer === myId
        ){

            showMessage(
                "☠️ ELIMINIERT!"
            );

            soundKill();

        }


        if(
            data.victim === myId
        ){

            showMessage(
                "💀 DU BIST RAUS!"
            );

            soundDeath();

        }

    }


    if(
        data.type==="winner"
    ){

        if(
            data.id === myId
        ){

            showMessage(
                "🏆 SIEG!"
            );

            soundWin();

        }else{

            showMessage(
                "💀 VERLOREN!"
            );

            soundDeath();

        }

    }


    if(
        data.type==="levelUp"
    ){

        showMessage(
            "⭐ LEVEL "+data.level
        );

        soundWin();

    }


    if(data.type==="error"){

        setStatus(
            "❌ "+data.message
        );

    }

}


/* =========================================
   KEYBOARD
========================================= */

document.addEventListener(
    "keydown",
    event => {

        keys[event.key] = true;

    }
);


document.addEventListener(
    "keyup",
    event => {

        keys[event.key] = false;

    }
);


/* =========================================
   MOUSE
========================================= */

canvas.addEventListener(
    "mousemove",
    event => {

        const rect =
            canvas.getBoundingClientRect();

        mouse.x =
            (event.clientX -
            rect.left) *
            canvas.width /
            rect.width;

        mouse.y =
            (event.clientY -
            rect.top) *
            canvas.height /
            rect.height;


        const crosshair =
            document.getElementById(
                "crosshair"
            );

        crosshair.style.left =
            event.clientX+"px";

        crosshair.style.top =
            event.clientY+"px";

    }
);


canvas.addEventListener(
    "mousedown",
    event => {

        if(event.button===0){

            mouse.down = true;

        }

    }
);


document.addEventListener(
    "mouseup",
    () => {

        mouse.down = false;

    }
);


/* =========================================
   MOVEMENT
========================================= */

setInterval(
    () => {

        if(
            !gameStarted ||
            !connected
        ){
            return;
        }


        let dx=0;
        let dy=0;


        if(keys["ArrowUp"]){

            dy--;

        }

        if(keys["ArrowDown"]){

            dy++;

        }

        if(keys["ArrowLeft"]){

            dx--;

        }

        if(keys["ArrowRight"]){

            dx++;

        }


        if(dx!==0 || dy!==0){

            send({

                type:"move",

                dx:dx,

                dy:dy

            });

        }


        const me =
            players[myId];

        if(!me) return;


        const angle =
            Math.atan2(
                mouse.y-me.y,
                mouse.x-me.x
            );


        send({

            type:"aim",

            angle:angle

        });


        if(mouse.down){

            const now =
                Date.now();


            if(
                now-lastAttack >
                80
            ){

                lastAttack = now;


                send({

                    type:"shoot",

                    angle:angle

                });


                createMuzzleFlash(
                    me.x,
                    me.y,
                    angle
                );


                soundShot();

            }

        }

    },
    40
);


/* =========================================
   HUD
========================================= */

function updateHUD(){

    const me =
        players[myId];

    document.getElementById(
        "players"
    ).textContent =
        Object.keys(
            players
        ).length;


    if(!me) return;


    document.getElementById(
        "hp"
    ).textContent =
        Math.max(
            0,
            Math.round(me.hp)
        );


    document.getElementById(
        "shield"
    ).textContent =
        Math.max(
            0,
            Math.round(me.shield)
        );


    document.getElementById(
        "kills"
    ).textContent =
        me.kills;


    document.getElementById(
        "level"
    ).textContent =
        me.level;


    document.getElementById(
        "hpbar"
    ).style.width =
        Math.max(
            0,
            me.hp
        )+"%";


    document.getElementById(
        "shieldbar"
    ).style.width =
        Math.max(
            0,
            me.shield*2
        )+"%";


    document.getElementById(
        "weaponName"
    ).textContent =
        weaponNames[
            me.weapon
        ] || "Keine Waffe";

}


/* =========================================
   MAP
========================================= */

const walls = [

    {
        x:100,
        y:100,
        w:200,
        h:30
    },

    {
        x:400,
        y:100,
        w:200,
        h:30
    },

    {
        x:700,
        y:100,
        w:180,
        h:30
    },

    {
        x:180,
        y:270,
        w:170,
        h:30
    },

    {
        x:650,
        y:270,
        w:170,
        h:30
    },

    {
        x:400,
        y:300,
        w:200,
        h:30
    },

    {
        x:100,
        y:500,
        w:200,
        h:30
    },

    {
        x:400,
        y:500,
        w:200,
        h:30
    },

    {
        x:700,
        y:500,
        w:180,
        h:30
    }

];


function drawMap(){

    ctx.fillStyle =
        "#29452b";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* Bodenlinien */

    ctx.strokeStyle =
        "rgba(255,255,255,.035)";

    for(
        let x=0;
        x<1000;
        x+=50
    ){

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(
            x,
            650
        );

        ctx.stroke();

    }


    for(
        let y=0;
        y<650;
        y+=50
    ){

        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(
            1000,
            y
        );

        ctx.stroke();

    }


    /* Wände */

    walls.forEach(
        wall => {

            ctx.fillStyle =
                "#69736c";

            ctx.fillRect(
                wall.x,
                wall.y,
                wall.w,
                wall.h
            );


            ctx.strokeStyle =
                "#b7c0ba";

            ctx.lineWidth=2;

            ctx.strokeRect(
                wall.x,
                wall.y,
                wall.w,
                wall.h
            );

        }
    );

}


/* =========================================
   PLAYER
========================================= */

function drawPlayer(p){

    ctx.save();


    ctx.translate(
        p.x,
        p.y
    );


    const angle =
        p.id===myId

        ? Math.atan2(
            mouse.y-p.y,
            mouse.x-p.x
        )

        : p.angle;


    /* Schatten */

    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        22,
        21,
        8,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* Spieler */

    ctx.fillStyle =
        p.color;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        18,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* Ring */

    if(
        p.id===myId
    ){

        ctx.strokeStyle =
            "#fff";

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            23,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }


    /* Waffe */

    ctx.rotate(angle);

    ctx.fillStyle =
        "#181818";

    ctx.fillRect(
        10,
        -4,
        30,
        8
    );


    ctx.restore();


    /* HP */

    ctx.fillStyle =
        "#111";

    ctx.fillRect(
        p.x-22,
        p.y-34,
        44,
        6
    );


    ctx.fillStyle =
        "#2bd66f";

    ctx.fillRect(
        p.x-22,
        p.y-34,
        44*
        Math.max(
            0,
            p.hp/100
        ),
        6
    );


    /* Schild */

    if(
        p.shield>0
    ){

        ctx.strokeStyle =
            "#45c7ff";

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            25,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }


    /* Name */

    ctx.fillStyle =
        "white";

    ctx.font =
        "12px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(

        p.id===myId
            ? "DU"
            : p.id.startsWith("bot_")
                ? "BOT"
                : "SPIELER",

        p.x,
        p.y-42

    );

}


/* =========================================
   PARTICLES
========================================= */

function createMuzzleFlash(
    x,
    y,
    angle
){

    for(
        let i=0;
        i<8;
        i++
    ){

        particles.push({

            x:x+
                Math.cos(angle)*25,

            y:y+
                Math.sin(angle)*25,

            vx:
                Math.cos(angle)*
                (2+Math.random()*3),

            vy:
                Math.sin(angle)*
                (2+Math.random()*3),

            life:15,

            size:
                2+Math.random()*4

        });

    }

}


function createExplosion(
    x,
    y
){

    for(
        let i=0;
        i<25;
        i++
    ){

        particles.push({

            x:x,

            y:y,

            vx:
                (Math.random()-.5)*7,

            vy:
                (Math.random()-.5)*7,

            life:
                20+Math.random()*20,

            size:
                2+Math.random()*5

        });

    }

}


function drawParticles(){

    particles.forEach(
        p => {

            p.x += p.vx;
            p.y += p.vy;

            p.life--;

            ctx.fillStyle =
                "#ffd43b";

            ctx.fillRect(
                p.x,
                p.y,
                p.size,
                p.size
            );

        }
    );


    particles =
        particles.filter(
            p => p.life>0
        );

}


/* =========================================
   TEXT
========================================= */

function showMessage(text){

    const element =
        document.getElementById(
            "message"
        );

    element.textContent =
        text;


    setTimeout(
        () => {

            element.textContent =
                "";

        },
        1800
    );

}


function setStatus(text){

    document.getElementById(
        "status"
    ).textContent =
        text;

}


/* =========================================
   SOUND SYSTEM
========================================= */

let audioContext=null;


function startAudio(){

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

}


function beep(
    frequency,
    duration,
    volume=.08
){

    startAudio();


    const oscillator =
        audioContext
        .createOscillator();


    const gain =
        audioContext
        .createGain();


    oscillator.frequency.value =
        frequency;


    gain.gain.value =
        volume;


    oscillator.connect(
        gain
    );


    gain.connect(
        audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
        audioContext.currentTime+
        duration
    );

}


function soundShot(){

    beep(
        180,
        .06,
        .05
    );

}


function soundKill(){

    beep(
        600,
        .1,
        .08
    );


    setTimeout(
        () => {

            beep(
                900,
                .12,
                .08
            );

        },
        100
    );

}


function soundDeath(){

    beep(
        90,
        .4,
        .1
    );

}


function soundWin(){

    beep(
        500,
        .12
    );


    setTimeout(
        () => beep(
            700,
            .12
        ),
        120
    );


    setTimeout(
        () => beep(
            1000,
            .2
        ),
        240
    );

}


/* =========================================
   RANDOM POSITION
========================================= */

function randomX(){

    return Math.random()*1000;

}


function randomY(){

    return Math.random()*650;

}


/* =========================================
   RENDER
========================================= */

function render(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawMap();


    Object.values(
        players
    ).forEach(
        player => {

            if(
                player.alive
            ){

                drawPlayer(
                    player
                );

            }

        }
    );


    drawParticles();


    requestAnimationFrame(
        render
    );

}


render();


/* =========================================
   START
========================================= */

connectServer();

</script>

</body>
</html>
