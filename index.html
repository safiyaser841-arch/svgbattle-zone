<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Zone</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
}

body {
    margin: 0;
    overflow: hidden;
    background: #070b10;
    font-family: Arial, sans-serif;
    color: white;
}

canvas {
    display: block;
    margin: auto;
    background: #29452b;
    width: 100vw;
    height: 100vh;
}

#menu {
    position: fixed;
    inset: 0;
    z-index: 20;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle at center, #294b6b, #080b10 70%);
}

#menu h1 {
    font-size: clamp(42px, 8vw, 75px);
    margin: 0 0 5px;

    text-shadow:
        0 0 10px #35aaff,
        0 0 35px #35aaff;
}

#menu p {
    color: #bbb;
    margin-bottom: 25px;
}

input {
    width: 250px;
    padding: 14px;

    border: 0;
    border-radius: 10px;

    text-align: center;
    font-size: 18px;

    outline: none;
}

button {
    padding: 13px 22px;
    margin: 7px;

    border: 0;
    border-radius: 10px;

    color: white;
    background: #303640;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

button:hover {
    transform: scale(1.05);
}

.primary {
    background: #299cff;
}

#status {
    margin-top: 12px;
    color: #72ff91;
}

#hud {
    position: fixed;
    top: 15px;
    left: 15px;

    z-index: 10;

    line-height: 1.5;
    font-size: 17px;

    text-shadow: 2px 2px 5px black;
}

.bar {
    width: 170px;
    height: 8px;

    background: #202020;
    border-radius: 5px;

    overflow: hidden;
}

#hpbar {
    width: 100%;
    height: 100%;
    background: #29d66d;
}

#shieldbar {
    width: 100%;
    height: 100%;
    background: #32bfff;
}

#weapon {
    position: fixed;

    bottom: 25px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    padding: 10px 20px;

    background: rgba(0,0,0,.7);
    border-radius: 12px;

    font-size: 20px;
    font-weight: bold;
}

#message {
    position: fixed;

    top: 42%;
    left: 0;

    width: 100%;

    z-index: 30;

    text-align: center;

    font-size: clamp(35px, 7vw, 65px);
    font-weight: bold;

    text-shadow:
        0 0 10px black,
        0 0 30px black;

    pointer-events: none;
}

#help {
    position: fixed;

    bottom: 8px;
    left: 10px;

    z-index: 10;

    color: #ddd;
    font-size: 13px;

    opacity: .75;
}

#crosshair {
    position: fixed;

    width: 18px;
    height: 18px;

    border: 2px solid white;
    border-radius: 50%;

    z-index: 12;

    pointer-events: none;

    transform: translate(-50%, -50%);

    box-shadow: 0 0 5px black;
}

#connection {
    position: fixed;

    top: 15px;
    right: 15px;

    z-index: 10;

    padding: 7px 12px;

    background: rgba(0,0,0,.65);

    border-radius: 8px;

    font-size: 13px;
}
</style>
</head>

<body>

<div id="menu">

    <h1>⚡ BATTLE ZONE</h1>

    <p>Fight • Survive • Win</p>

    <input
        id="room"
        maxlength="6"
        placeholder="RAUMCODE"
    >

    <div>

        <button
            class="primary"
            onclick="createRoom()"
        >
            🎮 Raum erstellen
        </button>

        <button
            onclick="joinRoom()"
        >
            👥 Beitreten
        </button>

    </div>

    <button onclick="startTraining()">
        🏋️ Training
    </button>

    <div id="status">
        🔄 Verbinde...
    </div>

</div>


<div id="connection">
    🔴 Offline
</div>


<div id="hud">

    ❤️ HP:
    <span id="hp">100</span>

    <div class="bar">
        <div id="hpbar"></div>
    </div>

    🛡️ Schild:
    <span id="shield">50</span>

    <div class="bar">
        <div id="shieldbar"></div>
    </div>

    ☠️ Kills:
    <span id="kills">0</span>

    <br>

    ⭐ Level:
    <span id="level">1</span>

    <br>

    👥 Spieler:
    <span id="players">0</span>

</div>


<div id="weapon">
    🔫 Keine Waffe
</div>


<div id="message"></div>

<div id="crosshair"></div>

<div id="help">
    ⬆️ ⬇️ ⬅️ ➡️ Bewegen |
    Maus = Zielen |
    Linksklick = Angreifen
</div>


<canvas
    id="game"
    width="1000"
    height="650"
></canvas>


<script>

/* ==================================================
   LIVE MULTIPLAYER SERVER
================================================== */

const SERVER_URL =
    "wss://svgbattle-server.onrender.com";


let socket = null;
let myId = null;

let connected = false;
let gameStarted = false;

const players = {};

const keys = {};

const mouse = {
    x: 500,
    y: 325,
    down: false
};

let particles = [];

let lastAttack = 0;


/* ==================================================
   CANVAS
================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


/* ==================================================
   WEAPONS
================================================== */

const weaponNames = {

    pistol: "🔫 Pistole",

    smg: "🔫 SMG",

    shotgun: "💥 Shotgun",

    sniper: "🎯 Sniper",

    sword: "⚔️ Schwert",

    hammer: "🔨 Hammer"

};


/* ==================================================
   CONNECT
================================================== */

function connectServer() {

    setStatus("🔄 Verbinde mit Server...");

    socket =
        new WebSocket(SERVER_URL);


    socket.onopen = () => {

        connected = true;

        document.getElementById(
            "connection"
        ).textContent =
            "🟢 Online";

        setStatus(
            "🟢 Server verbunden!"
        );

    };


    socket.onclose = () => {

        connected = false;

        document.getElementById(
            "connection"
        ).textContent =
            "🔴 Offline";

        setStatus(
            "🔴 Verbindung verloren"
        );

    };


    socket.onerror = () => {

        setStatus(
            "❌ Serverfehler"
        );

    };


    socket.onmessage =
        event => {

            let data;

            try {

                data =
                    JSON.parse(
                        event.data
                    );

            } catch {

                return;

            }

            handleServerMessage(
                data
            );

        };

}


/* ==================================================
   SEND
================================================== */

function send(data) {

    if (
        socket &&
        socket.readyState ===
        WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify(data)
        );

    }

}


/* ==================================================
   SERVER MESSAGES
================================================== */

function handleServerMessage(data) {

    if (data.type === "id") {

        myId = data.id;

    }


    if (
        data.type === "created" ||
        data.type === "joined"
    ) {

        gameStarted = true;

        document.getElementById(
            "menu"
        ).style.display =
            "none";

        showMessage(
            "🎮 LOS!"
        );

    }


    if (data.type === "state") {

        Object.keys(players)
            .forEach(id => {

                if (!data.players[id]) {

                    delete players[id];

                }

            });


        Object.assign(
            players,
            data.players
        );


        updateHUD();

    }


    if (
        data.type ===
        "elimination"
    ) {

        const victim =
            players[data.victim];

        if (victim) {

            createExplosion(
                victim.x,
                victim.y
            );

        }


        if (
            data.killer === myId
        ) {

            showMessage(
                "☠️ ELIMINIERT!"
            );

            soundKill();

        }


        if (
            data.victim === myId
        ) {

            showMessage(
                "💀 DU BIST RAUS!"
            );

            soundDeath();

        }

    }


    if (data.type === "winner") {

        if (
            data.id === myId
        ) {

            showMessage(
                "🏆 SIEG!"
            );

            soundWin();

        } else {

            showMessage(
                "💀 VERLOREN!"
            );

            soundDeath();

        }

    }


    if (data.type === "levelUp") {

        showMessage(
            "⭐ LEVEL " +
            data.level
        );

        soundLevel();

    }


    if (data.type === "error") {

        setStatus(
            "❌ " +
            data.message
        );

    }

}


/* ==================================================
   ROOMS
================================================== */

function createRoom() {

    if (!connected) {

        setStatus(
            "❌ Server nicht verbunden"
        );

        return;

    }


    const code =
        Math.random()
        .toString(36)
        .substring(2, 8)
        .toUpperCase();


    document.getElementById(
        "room"
    ).value =
        code;


    send({

        type: "create",

        room: code

    });

}


function joinRoom() {

    if (!connected) {

        setStatus(
            "❌ Server nicht verbunden"
        );

        return;

    }


    const code =
        document.getElementById(
            "room"
        ).value
        .trim()
        .toUpperCase();


    if (
        code.length < 3
    ) {

        setStatus(
            "❌ Raumcode eingeben"
        );

        return;

    }


    send({

        type: "join",

        room: code

    });

}


function startTraining() {

    if (!connected) {

        setStatus(
            "❌ Server nicht verbunden"
        );

        return;

    }


    const code =
        "TRAIN" +
        Math.floor(
            Math.random() * 999
        );


    send({

        type: "create",

        room: code

    });

}


/* ==================================================
   KEYBOARD
================================================== */

document.addEventListener(
    "keydown",
    event => {

        keys[event.key] = true;

    }
);


document.addEventListener(
    "keyup",
    event => {

        keys[event.key] = false;

    }
);


/* ==================================================
   MOUSE
================================================== */

canvas.addEventListener(
    "mousemove",
    event => {

        const rect =
            canvas.getBoundingClientRect();


        mouse.x =
            (event.clientX -
                rect.left) *
            canvas.width /
            rect.width;


        mouse.y =
            (event.clientY -
                rect.top) *
            canvas.height /
            rect.height;


        const crosshair =
            document.getElementById(
                "crosshair"
            );


        crosshair.style.left =
            event.clientX + "px";


        crosshair.style.top =
            event.clientY + "px";

    }
);


canvas.addEventListener(
    "mousedown",
    event => {

        if (
            event.button === 0
        ) {

            mouse.down = true;

        }

    }
);


document.addEventListener(
    "mouseup",
    () => {

        mouse.down = false;

    }
);


/* ==================================================
   GAME LOOP / CONTROLS
================================================== */

setInterval(
    () => {

        if (
            !gameStarted ||
            !connected
        ) {

            return;

        }


        let dx = 0;
        let dy = 0;


        if (
            keys["ArrowUp"]
        ) {

            dy--;

        }


        if (
            keys["ArrowDown"]
        ) {

            dy++;

        }


        if (
            keys["ArrowLeft"]
        ) {

            dx--;

        }


        if (
            keys["ArrowRight"]
        ) {

            dx++;

        }


        if (
            dx !== 0 ||
            dy !== 0
        ) {

            send({

                type: "move",

                dx,
                dy

            });

        }


        const me =
            players[myId];


        if (!me) {

            return;

        }


        const angle =
            Math.atan2(
                mouse.y - me.y,
                mouse.x - me.x
            );


        send({

            type: "aim",

            angle

        });


        if (
            mouse.down
        ) {

            const now =
                Date.now();


            if (
                now -
                lastAttack >
                150
            ) {

                lastAttack =
                    now;


                send({

                    type: "shoot",

                    angle

                });


                createMuzzleFlash(
                    me.x,
                    me.y,
                    angle
                );


                soundShot();

            }

        }

    },
    40
);


/* ==================================================
   HUD
================================================== */

function updateHUD() {

    const me =
        players[myId];


    document.getElementById(
        "players"
    ).textContent =
        Object.keys(
            players
        ).length;


    if (!me) {

        return;

    }


    document.getElementById(
        "hp"
    ).textContent =
        Math.round(
            me.hp
        );


    document.getElementById(
        "shield"
    ).textContent =
        Math.round(
            me.shield
        );


    document.getElementById(
        "kills"
    ).textContent =
        me.kills;


    document.getElementById(
        "level"
    ).textContent =
        me.level;


    document.getElementById(
        "hpbar"
    ).style.width =
        Math.max(
            0,
            me.hp
        ) + "%";


    document.getElementById(
        "shieldbar"
    ).style.width =
        Math.max(
            0,
            me.shield * 2
        ) + "%";


    document.getElementById(
        "weapon"
    ).textContent =
        weaponNames[
            me.weapon
        ] ||
        "🔫 Keine Waffe";

}


/* ==================================================
   MAP
================================================== */

const walls = [

    {
        x: 100,
        y: 100,
        w: 200,
        h: 30
    },

    {
        x: 400,
        y: 100,
        w: 200,
        h: 30
    },

    {
        x: 700,
        y: 100,
        w: 180,
        h: 30
    },

    {
        x: 180,
        y: 270,
        w: 170,
        h: 30
    },

    {
        x: 650,
        y: 270,
        w: 170,
        h: 30
    },

    {
        x: 400,
        y: 300,
        w: 200,
        h: 30
    },

    {
        x: 100,
        y: 500,
        w: 200,
        h: 30
    },

    {
        x: 400,
        y: 500,
        w: 200,
        h: 30
    },

    {
        x: 700,
        y: 500,
        w: 180,
        h: 30
    }

];


function drawMap() {

    ctx.fillStyle =
        "#29452b";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.strokeStyle =
        "rgba(255,255,255,.035)";


    for (
        let x = 0;
        x < 1000;
        x += 50
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            650
        );

        ctx.stroke();

    }


    for (
        let y = 0;
        y < 650;
        y += 50
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            1000,
            y
        );

        ctx.stroke();

    }


    walls.forEach(
        wall => {

            ctx.fillStyle =
                "#69736c";

            ctx.fillRect(
                wall.x,
                wall.y,
                wall.w,
                wall.h
            );


            ctx.strokeStyle =
                "#c4ccc7";

            ctx.strokeRect(
                wall.x,
                wall.y,
                wall.w,
                wall.h
            );

        }
    );

}


/* ==================================================
   PLAYERS
================================================== */

function drawPlayer(p) {

    ctx.save();

    ctx.translate(
        p.x,
        p.y
    );


    const angle =
        p.id === myId

            ? Math.atan2(
                mouse.y - p.y,
                mouse.x - p.x
            )

            : p.angle;


    ctx.fillStyle =
        "rgba(0,0,0,.35)";


    ctx.beginPath();

    ctx.ellipse(
        0,
        22,
        21,
        8,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
        p.color;


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        18,
        0,
        Math.PI * 2
    );

    ctx.fill();


    if (
        p.id === myId
    ) {

        ctx.strokeStyle =
            "white";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            23,
            0,
            Math.PI * 2
        );

        ctx.stroke();

    }


    ctx.rotate(
        angle
    );


    ctx.fillStyle =
        "#171717";


    ctx.fillRect(
        10,
        -4,
        30,
        8
    );


    ctx.restore();


    /* HP */

    ctx.fillStyle =
        "#111";


    ctx.fillRect(
        p.x - 22,
        p.y - 34,
        44,
        6
    );


    ctx.fillStyle =
        "#29d66d";


    ctx.fillRect(
        p.x - 22,
        p.y - 34,
        44 *
        Math.max(
            0,
            p.hp / 100
        ),
        6
    );


    /* Shield */

    if (
        p.shield > 0
    ) {

        ctx.strokeStyle =
            "#42c7ff";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            26,
            0,
            Math.PI * 2
        );

        ctx.stroke();

    }


    ctx.fillStyle =
        "white";

    ctx.font =
        "12px Arial";

    ctx.textAlign =
        "center";


    ctx.fillText(
        p.id === myId
            ? "DU"
            : p.bot
                ? "BOT"
                : "SPIELER",
        p.x,
        p.y - 42
    );

}


/* ==================================================
   EFFECTS
================================================== */

function createMuzzleFlash(
    x,
    y,
    angle
) {

    for (
        let i = 0;
        i < 8;
        i++
    ) {

        particles.push({

            x:
                x +
                Math.cos(angle) *
                25,

            y:
                y +
                Math.sin(angle) *
                25,

            vx:
                Math.cos(angle) *
                (2 + Math.random() * 3),

            vy:
                Math.sin(angle) *
                (2 + Math.random() * 3),

            life: 15,

            size:
                2 +
                Math.random() * 4

        });

    }

}


function createExplosion(
    x,
    y
) {

    for (
        let i = 0;
        i < 25;
        i++
    ) {

        particles.push({

            x,
            y,

            vx:
                (Math.random() - .5) * 7,

            vy:
                (Math.random() - .5) * 7,

            life:
                20 +
                Math.random() * 20,

            size:
                2 +
                Math.random() * 5

        });

    }

}


function drawParticles() {

    particles.forEach(
        p => {

            p.x += p.vx;
            p.y += p.vy;

            p.life--;

            ctx.fillStyle =
                "#ffd43b";

            ctx.fillRect(
                p.x,
                p.y,
                p.size,
                p.size
            );

        }
    );


    particles =
        particles.filter(
            p => p.life > 0
        );

}


/* ==================================================
   UI
================================================== */

function setStatus(text) {

    document.getElementById(
        "status"
    ).textContent =
        text;

}


function showMessage(text) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    setTimeout(
        () => {

            message.textContent =
                "";

        },
        1800
    );

}


/* ==================================================
   SIMPLE SOUNDS
================================================== */

let audioContext = null;


function audio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

}


function beep(
    frequency,
    duration,
    volume = .07
) {

    audio();


    const oscillator =
        audioContext
        .createOscillator();


    const gain =
        audioContext
        .createGain();


    oscillator.frequency.value =
        frequency;


    gain.gain.value =
        volume;


    oscillator.connect(
        gain
    );

    gain.connect(
        audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
        audioContext.currentTime +
        duration
    );

}


function soundShot() {

    beep(
        180,
        .06,
        .05
    );

}


function soundKill() {

    beep(
        600,
        .1,
        .08
    );


    setTimeout(
        () => {

            beep(
                900,
                .12,
                .08
            );

        },
        100
    );

}


function soundDeath() {

    beep(
        90,
        .4,
        .1
    );

}


function soundWin() {

    beep(
        500,
        .12
    );


    setTimeout(
        () => beep(
            700,
            .12
        ),
        120
    );


    setTimeout(
        () => beep(
            1000,
            .2
        ),
        240
    );

}


function soundLevel() {

    beep(
        700,
        .1
    );


    setTimeout(
        () => beep(
            1000,
            .15
        ),
        100
    );

}


/* ==================================================
   RENDER LOOP
================================================== */

function render() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawMap();


    Object.values(
        players
    ).forEach(
        player => {

            if (
                player.alive
            ) {

                drawPlayer(
                    player
                );

            }

        }
    );


    drawParticles();


    requestAnimationFrame(
        render
    );

}


render();

connectServer();

</script>

</body>
</html>
