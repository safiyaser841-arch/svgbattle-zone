<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Battle Zone</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#071018;
    color:white;
}

button,input,select{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.screen{
    position:fixed;
    inset:0;
}

/* ================= MENU ================= */

#menu{
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at 50% 20%,#16466b 0%,transparent 45%),
        linear-gradient(135deg,#020617,#0b1724);
}

.menuBox{
    width:min(500px,92vw);
    padding:28px;
    border-radius:25px;
    background:rgba(8,15,25,.96);
    border:1px solid #26384b;
    box-shadow:0 25px 80px rgba(0,0,0,.7);
    text-align:center;
}

.logo{
    font-size:clamp(38px,10vw,62px);
    font-weight:900;
    color:#38bdf8;
    text-shadow:0 0 30px #38bdf8;
}

.subtitle{
    color:#94a3b8;
    margin:8px 0 22px;
}

.input,
.select{
    width:100%;
    padding:14px;
    margin:6px 0;
    border-radius:12px;
    border:1px solid #334155;
    background:#111827;
    color:white;
    outline:none;
}

.btn{
    width:100%;
    padding:14px;
    margin-top:8px;
    border-radius:12px;
    background:linear-gradient(135deg,#38bdf8,#2563eb);
    color:white;
    font-weight:bold;
}

.btn.dark{
    background:#1e293b;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-bottom:12px;
}

.stat{
    padding:10px;
    border-radius:10px;
    background:#0b1220;
    font-size:12px;
}

.stat b{
    display:block;
    color:#38bdf8;
    font-size:17px;
    margin-top:4px;
}

#connection{
    margin-top:12px;
    font-size:13px;
    color:#facc15;
}

/* ================= LOBBY ================= */

#lobby,
#game,
#skins,
#tutorial{
    display:none;
}

#lobby{
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle,#17486b,#020617 75%);
}

.lobbyBox{
    width:min(900px,94vw);
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    padding:20px;
    border-radius:25px;
    background:rgba(8,15,25,.97);
}

.characterStage{
    min-height:420px;
    border-radius:20px;
    background:
        radial-gradient(circle,#315d7e,#0a1119);
    position:relative;
    overflow:hidden;
}

.character{
    position:absolute;
    left:50%;
    top:52%;
    transform:translate(-50%,-50%);
    width:100px;
    height:130px;
    border-radius:35px 35px 20px 20px;
    box-shadow:inset -20px -20px 35px rgba(0,0,0,.45);
}

.character:before{
    content:"";
    position:absolute;
    width:65px;
    height:65px;
    left:18px;
    top:-48px;
    border-radius:50%;
    background:#dcae8e;
}

.lobbyInfo{
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:10px;
}

.roomCode{
    font-size:42px;
    font-weight:900;
    letter-spacing:8px;
    color:#38bdf8;
}

/* ================= SKINS ================= */

#skins{
    padding:18px;
    overflow:auto;
    background:#050b12;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    max-width:1100px;
    margin:auto;
}

.skinGrid{
    width:min(1100px,95vw);
    margin:20px auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:12px;
}

.skinCard{
    padding:12px;
    border-radius:15px;
    background:#101827;
    border:1px solid #334155;
}

.skinPreview{
    height:110px;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0b1119;
}

.miniCharacter{
    width:50px;
    height:70px;
    border-radius:18px;
    position:relative;
}

.miniCharacter:before{
    content:"";
    position:absolute;
    width:35px;
    height:35px;
    left:8px;
    top:-23px;
    border-radius:50%;
    background:#dcae8e;
}

/* ================= TUTORIAL ================= */

#tutorial{
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.8);
    z-index:100;
}

.tutorialBox{
    width:min(500px,92vw);
    padding:28px;
    border-radius:20px;
    background:#111827;
    text-align:center;
}

.tutorialBox p{
    margin:20px 0;
    color:#cbd5e1;
    line-height:1.6;
}

/* ================= GAME ================= */

#game{
    background:#294b31;
}

#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

.hud{
    position:fixed;
    top:8px;
    left:8px;
    right:8px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    z-index:20;
    pointer-events:none;
}

.hudBox{
    padding:8px 10px;
    border-radius:9px;
    background:rgba(3,8,15,.82);
    border:1px solid #334155;
    font-size:13px;
}

#superBar{
    position:fixed;
    left:50%;
    bottom:15px;
    transform:translateX(-50%);
    width:220px;
    height:12px;
    background:#111827;
    border-radius:20px;
    overflow:hidden;
    z-index:30;
}

#superFill{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#7c3aed,#ec4899);
}

.control{
    position:fixed;
    z-index:40;
    padding:12px 16px;
    border-radius:12px;
    color:white;
    background:#1e293b;
    font-weight:bold;
}

#heal{
    left:50%;
    bottom:75px;
    transform:translateX(-50%);
    background:#166534;
}

#super{
    left:50%;
    bottom:32px;
    transform:translateX(-50%);
}

#shoot{
    display:none;
    position:fixed;
    right:20px;
    bottom:25px;
    width:105px;
    height:105px;
    border-radius:50%;
    background:radial-gradient(circle,#ef4444,#991b1b);
    border:4px solid white;
    color:white;
    font-size:30px;
    z-index:50;
}

#joystick{
    display:none;
    position:fixed;
    left:20px;
    bottom:20px;
    width:145px;
    height:145px;
    border-radius:50%;
    background:rgba(255,255,255,.12);
    border:2px solid rgba(255,255,255,.25);
    z-index:50;
}

#stick{
    position:absolute;
    width:62px;
    height:62px;
    left:41px;
    top:41px;
    border-radius:50%;
    background:rgba(255,255,255,.5);
}

#round{
    display:none;
    position:fixed;
    inset:0;
    z-index:90;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    gap:12px;
    background:rgba(0,0,0,.75);
}

#round h1{
    font-size:clamp(45px,10vw,80px);
}

.roundBtn{
    width:min(300px,80vw);
    padding:14px;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-weight:bold;
}

/* ================= MOBILE ================= */

@media(pointer:coarse){

    #joystick,
    #shoot{
        display:block;
    }

    .hud{
        right:100px;
    }

    .lobbyBox{
        grid-template-columns:1fr;
    }

    .characterStage{
        min-height:260px;
    }
}

@media(orientation:portrait) and (pointer:coarse){

    #game:after{
        content:"📱 Bitte Handy drehen";
        position:fixed;
        inset:0;
        z-index:999;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#020617;
        font-size:25px;
        text-align:center;
    }
}
</style>
</head>

<body>

<!-- MENU -->

<div id="menu" class="screen">

<div class="menuBox">

<div class="logo">⚡ BATTLE ZONE</div>
<div class="subtitle">2D Multiplayer Arena</div>

<div class="stats">

<div class="stat">
🏆 Trophäen
<b id="trophies">0</b>
</div>

<div class="stat">
💀 Kills
<b id="kills">0</b>
</div>

<div class="stat">
👤 Skin
<b id="skinName">Rookie</b>
</div>

</div>

<input id="playerName"
class="input"
maxlength="15"
placeholder="Dein Name">

<select id="difficulty" class="select">
<option value="easy">🟢 Leicht</option>

<option value="hard">🔴 Schwer</option>
</select>

<button class="btn" id="create">
🎮 Lobby erstellen

id="roomInput"
class="input"
maxlength="4"
placeholder="Raumcode">

🏠 <span id="hudRoom">----</span>
</div>

❤️ <span id="hudHp">100</span>
</div>

<div class="hudBox">
🛡️ <span id="hudShield">50</span>
</div>

<div class="hudBox">
🔫 <span id="hudWeapon">Pistole</span>
</div>

<div class="hudBox">
💀 <span id="hudKills">0</span>
</div>

🎯 <span id="hudDifficulty">Mittel</span>
</div>

</div>

<div id="superBar">
<div id="superFill"></div>
</div>

<button id="heal" class="control">
💚 HEILEN

<button id="super" class="control">
⚡ SUPER
</button>

<div id="stick"></div>
</div>

<button id="shoot">
🔥
</button>

<div id="round">

<h1 id="roundTitle">🏆 SIEG!</h1>

<button class="roundBtn" id="newRound">
🔄 Neue Runde
</button>

<button class="roundBtn" id="roundLobby">
🏠 Lobby
</button>

</div>

</div>

<script>

"use strict";

/* ================= SERVER ================= */

const SERVER_URL =
location.protocol === "https:"
? "wss://svgbattle-server.onrender.com"
: "ws://localhost:3000";

let socket;
let connected=false;
let myId=null;
let roomCode="";
let players=[];
let bots=[];
let bullets=[];
let effects=[];
let walls=[];
let map={width:1600,height:900};
let skins=[];
let difficulty="medium";

let kills=Number(localStorage.getItem("battleKills")||0);
let trophies=Number(localStorage.getItem("battleTrophies")||0);
let selectedSkin=localStorage.getItem("battleSkin")||"standard";

let keys={
    up:false,
    down:false,
    left:false,
    right:false
};

let joyX=0;
let joyY=0;
let firing=false;
let aimX=innerWidth*.75;
let aimY=innerHeight*.5;

/* ================= DOM ================= */

const menu=document.getElementById("menu");
const lobby=document.getElementById("lobby");
const game=document.getElementById("game");
const skinsScreen=document.getElementById("skins");
const tutorialScreen=document.getElementById("tutorial");

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

function resize(){
    canvas.width=innerWidth;
    canvas.height=innerHeight;
}

resize();

addEventListener("resize",resize);

/* ================= CONNECTION ================= */

function connect(){

    socket=new WebSocket(SERVER_URL);

    socket.onopen=()=>{

        connected=true;

        document.getElementById("connection").textContent=
        "🟢 Server verbunden";

    };

    socket.onclose=()=>{

        connected=false;

        document.getElementById("connection").textContent=
        "🔴 Server getrennt";

        setTimeout(connect,3000);

    };

    socket.onerror=()=>{
        document.getElementById("connection").textContent=
        "🟠 Serverfehler";
    };

    socket.onmessage=e=>{

        try{

            const data=JSON.parse(e.data);

            handleMessage(data);

        }catch(err){

            console.error(err);

        }

    };

}

connect();

/* ================= SEND ================= */

function send(data){

    if(
        socket &&
        socket.readyState===WebSocket.OPEN
    ){

        socket.send(JSON.stringify(data));

    }

}

/* ================= SERVER MESSAGES ================= */

function handleMessage(data){

    if(data.type==="connected"){

        myId=data.id;

        map=data.map||map;
        walls=data.walls||[];

        skins=data.skins||[];

        renderSkins();

        updateMenu();

        return;
    }

    if(data.type==="roomCreated" ||
       data.type==="joinedRoom"){

        roomCode=data.code;
        difficulty=data.difficulty||difficulty;

        showLobby();

        return;
    }

    if(data.type==="state"){

        players=data.players||[];
        bots=data.bots||[];

        walls=data.walls||walls;
        map=data.map||map;
        difficulty=data.difficulty||difficulty;

        updateHUD();
        updateLobby();

        return;
    }

    if(data.type==="bulletSpawn"){

        bullets.push({
            x:data.x,
            y:data.y,
            dx:data.dx,
            dy:data.dy,
            speed:data.speed||15,
            color:data.color||"#facc15",
            life:100
        });

        return;
    }

    if(data.type==="effect"){

        effects.push({
            x:data.x,
            y:data.y,
            type:data.effect||"hit",
            life:20
        });

        return;
    }

    if(data.type==="elimination"){

        if(data.killer===myId){

            kills++;
            trophies++;

            localStorage.setItem(
                "battleKills",
                kills
            );

            localStorage.setItem(
                "battleTrophies",
                trophies
            );

            updateMenu();

        }

        return;
    }

    if(data.type==="roundEnd"){

        document.getElementById("roundTitle").textContent=
        data.winner===myId
        ? "🏆 SIEG!"
        : "💀 VERLOREN!";

        document.getElementById("round").style.display="flex";

        return;
    }

    if(data.type==="newRound"){

        bullets=[];
        effects=[];

        document.getElementById("round").style.display="none";

        return;
    }

    if(data.type==="error"){

        alert(data.message);

    }

}

/* ================= MENU ================= */

function updateMenu(){

    document.getElementById("kills").textContent=kills;
    document.getElementById("trophies").textContent=trophies;

    const s=skins.find(x=>x.id===selectedSkin);

    document.getElementById("skinName").textContent=
    s ? s.name : "Rookie";

}

/* ================= CREATE ================= */

document.getElementById("create").onclick=()=>{

    if(!connected){

        alert("Der Server ist noch nicht verbunden.");

        return;
    }

    const name=
    document.getElementById("playerName").value.trim()
    ||"Player";

    difficulty=
    document.getElementById("difficulty").value;

    let botsCount=prompt(
        "Wie viele Bots? 0 bis 5",
        "3"
    );

    botsCount=Math.max(
        0,
        Math.min(
            5,
            Number(botsCount)||0
        )
    );

    send({

        type:"createRoom",

        name:name,

        bots:botsCount,

        difficulty:difficulty,

        skin:selectedSkin

    });

};

/* ================= JOIN ================= */

document.getElementById("join").onclick=()=>{

    if(!connected){

        alert("Server ist noch nicht verbunden.");

        return;
    }

    const name=
    document.getElementById("playerName").value.trim()
    ||"Player";

    const code=
    document.getElementById("roomInput")
    .value
    .trim()
    .toUpperCase();

    if(code.length!==4){

        alert("Der Raumcode muss 4 Zeichen haben.");

        return;
    }

    send({

        type:"joinRoom",

        name:name,

        code:code,

        skin:selectedSkin

    });

};

/* ================= LOBBY ================= */

function showLobby(){

    menu.style.display="none";
    skinsScreen.style.display="none";
    lobby.style.display="flex";

    document.getElementById("roomCode").textContent=roomCode;

    updateLobby();

}

function updateLobby(){

    const me=players.find(
        p=>p.id===myId
    );

    const skin=
    skins.find(s=>
        s.id===(me?.skin||selectedSkin)
    );

    if(!skin)return;

    document.getElementById("lobbySkin")
    .textContent=skin.name;

    document.getElementById("lobbyWeapon")
    .textContent=skin.weapon;

    document.getElementById("lobbyHp")
    .textContent=100+skin.healthBonus;

    document.getElementById("lobbyShield")
    .textContent=50+skin.shieldBonus;

    document.getElementById("lobbyDamage")
    .textContent=
    "+"+skin.damageBonus+"%";

    document.getElementById("lobbyKills")
    .textContent=
    me?.kills??kills;

    document.getElementById("lobbyDifficulty")
    .textContent=
    difficulty==="easy"
    ?"Leicht"
    :difficulty==="hard"
    ?"Schwer"
    :"Mittel";

    document.getElementById("bigCharacter")
    .style.background=
    `linear-gradient(145deg,${skin.color},#111827)`;

}

/* ================= BUTTONS ================= */

document.getElementById("play").onclick=()=>{

    lobby.style.display="none";
    game.style.display="block";

    send({
        type:"startGame"
    });

};

document.getElementById("back").onclick=()=>{

    lobby.style.display="none";
    menu.style.display="flex";

};

document.getElementById("copy").onclick=()=>{

    navigator.clipboard
    ?.writeText(roomCode);

    alert("Raumcode kopiert: "+roomCode);

};

/* ================= SKINS ================= */

document.getElementById("skinsButton").onclick=()=>{

    menu.style.display="none";
    skinsScreen.style.display="block";

    renderSkins();

};

document.getElementById("closeSkins").onclick=()=>{

    skinsScreen.style.display="none";
    menu.style.display="flex";

};

function renderSkins(){

    const grid=document.getElementById("skinGrid");

    grid.innerHTML="";

    skins.forEach(s=>{

        const card=document.createElement("div");

        card.className="skinCard";

        card.innerHTML=`

        <div class="skinPreview">

            <div
            class="miniCharacter"
            style="
            background:linear-gradient(
            145deg,
            ${s.color},
            #111827
            )">
            </div>

        </div>

        <h3>${s.name}</h3>

        <p>⭐ ${s.rarity}</p>

        <p>🔫 ${s.weapon}</p>

        <p>❤️ +${s.healthBonus}</p>

        <p>🛡️ +${s.shieldBonus}</p>

        <p>💥 +${s.damageBonus}%</p>

        <p>💀 Preis: ${s.price}</p>

        `;

        const button=document.createElement("button");

        button.className="btn";

        if(
            selectedSkin===s.id
        ){

            button.textContent="✓ Ausgewählt";

        }else if(
            kills>=s.price
        ){

            button.textContent="Auswählen";

            button.onclick=()=>{

                selectedSkin=s.id;

                localStorage.setItem(
                    "battleSkin",
                    selectedSkin
                );

                send({
                    type:"changeSkin",
                    skin:selectedSkin
                });

                updateMenu();
                renderSkins();

            };

        }else{

            button.textContent=
            "🔒 "+s.price+" Kills";

        }

        card.appendChild(button);

        grid.appendChild(card);

    });

}

/* ================= TUTORIAL ================= */

let tutorialIndex=0;

const tutorialData=[

{
title:"🎮 Bewegung",
text:"Benutze auf dem PC die Pfeiltasten. Auf dem Handy benutzt du den Joystick."
},

{
title:"🔥 Schießen",
text:"Auf dem PC klickst du mit der Maus. Auf dem Handy benutzt du den roten Schuss-Button."
},

{
title:"💚 Heilen",
text:"Mit HEILEN kannst du verlorenes Leben wiederherstellen."
},

{
title:"⚡ Super",
text:"Dein Super lädt sich durch Schaden auf. Wenn er voll ist, kannst du ihn benutzen."
},

{
title:"🏆 Gewinnen",
text:"Besiege die Gegner und Bots. Am Ende der Runde gewinnt der letzte Spieler."
}

];

document.getElementById("tutorialButton").onclick=()=>{

    menu.style.display="none";
    tutorialScreen.style.display="flex";

    tutorialIndex=0;

    renderTutorial();

};

function renderTutorial(){

    const t=tutorialData[tutorialIndex];

    document.getElementById("tutorialTitle")
    .textContent=t.title;

    document.getElementById("tutorialText")
    .textContent=t.text;

    document.getElementById("tutorialCounter")
    .textContent=
    `${tutorialIndex+1} / ${tutorialData.length}`;

}

document.getElementById("tutorialNext").onclick=()=>{

    tutorialIndex++;

    if(
        tutorialIndex>=tutorialData.length
    ){

        tutorialScreen.style.display="none";
        menu.style.display="flex";

        return;

    }

    renderTutorial();

};

/* ================= KEYBOARD ================= */

addEventListener("keydown",e=>{

    if(e.key==="ArrowUp"){
        keys.up=true;
        e.preventDefault();
    }

    if(e.key==="ArrowDown"){
        keys.down=true;
        e.preventDefault();
    }

    if(e.key==="ArrowLeft"){
        keys.left=true;
        e.preventDefault();
    }

    if(e.key==="ArrowRight"){
        keys.right=true;
        e.preventDefault();
    }

    if(e.key==="r"||e.key==="R"){

        send({
            type:"reload"
        });

    }

});

addEventListener("keyup",e=>{

    if(e.key==="ArrowUp")
        keys.up=false;

    if(e.key==="ArrowDown")
        keys.down=false;

    if(e.key==="ArrowLeft")
        keys.left=false;

    if(e.key==="ArrowRight")
        keys.right=false;

});

/* ================= MOVEMENT ================= */

setInterval(()=>{

    if(game.style.display!=="block")
        return;

    let dx=
    (keys.right?1:0)-
    (keys.left?1:0);

    let dy=
    (keys.down?1:0)-
    (keys.up?1:0);

    dx+=joyX;
    dy+=joyY;

    if(dx!==0||dy!==0){

        const length=Math.hypot(dx,dy);

        if(length>1){

            dx/=length;
            dy/=length;

        }

        send({
            type:"move",
            dx:dx,
            dy:dy
        });

    }

},33);

/* ================= JOYSTICK ================= */

const joystick=
document.getElementById("joystick");

const stick=
document.getElementById("stick");

let joystickActive=false;

joystick.addEventListener(
"pointerdown",
e=>{

    joystickActive=true;

    joystick.setPointerCapture(
        e.pointerId
    );

    updateJoystick(
        e.clientX,
        e.clientY
    );

});

joystick.addEventListener(
"pointermove",
e=>{

    if(joystickActive){

        updateJoystick(
            e.clientX,
            e.clientY
        );

    }

});

joystick.addEventListener(
"pointerup",
resetJoystick
);

joystick.addEventListener(
"pointercancel",
resetJoystick
);

function resetJoystick(){

    joystickActive=false;

    joyX=0;
    joyY=0;

    stick.style.left="41px";
    stick.style.top="41px";

}

function updateJoystick(x,y){

    const r=
    joystick.getBoundingClientRect();

    const cx=
    r.left+r.width/2;

    const cy=
    r.top+r.height/2;

    let dx=x-cx;
    let dy=y-cy;

    const max=45;

    const distance=
    Math.hypot(dx,dy);

    if(distance>max){

        dx=dx/distance*max;
        dy=dy/distance*max;

    }

    joyX=dx/max;
    joyY=dy/max;

    stick.style.left=
    (r.width/2-31+dx)+"px";

    stick.style.top=
    (r.height/2-31+dy)+"px";

}

/* ================= AIM ================= */

addEventListener("mousemove",e=>{

    aimX=e.clientX;
    aimY=e.clientY;

});

addEventListener("mousedown",e=>{

    if(
        e.button===0 &&
        game.style.display==="block"
    ){

        firing=true;

    }

});

addEventListener("mouseup",()=>{

    firing=false;

});

document.getElementById("shoot")
.addEventListener(
"pointerdown",
e=>{

    e.preventDefault();

    firing=true;

    shoot();

});

document.getElementById("shoot")
.addEventListener(
"pointerup",
()=>firing=false
);

document.getElementById("shoot")
.addEventListener(
"pointercancel",
()=>firing=false
);

setInterval(()=>{

    if(firing)
        shoot();

},120);

function shoot(){

    const me=players.find(
        p=>p.id===myId
    );

    if(!me||!me.alive)
        return;

    const dx=
    aimX-canvas.width/2;

    const dy=
    aimY-canvas.height/2;

    if(Math.hypot(dx,dy)<5)
        return;

    send({
        type:"shoot",
        dx:dx,
        dy:dy
    });

}

/* ================= HUD ================= */

function updateHUD(){

        p=>p.id===myId
    );

    if(!me)return;

    document.getElementById("hudHp")
    .textContent=Math.max(0,Math.round(me.hp));

    document.getElementById("hudShield")
    .textContent=Math.max(0,Math.round(me.shield));

    document.getElementById("hudWeapon")
    .textContent=me.weapon;

    document.getElementById("hudKills")
    .textContent=me.kills;

    document.getElementById("hudRoom")
    .textContent=roomCode;

    document.getElementById("hudDifficulty")
    .textContent=
    difficulty==="easy"
    ?"Leicht"
    :difficulty==="hard"
    ?"Schwer"
    :"Mittel";

    const skin=
    skins.find(s=>s.id===me.skin);

    if(skin&&skin.superNeed){

        const percent=
        Math.min(
            100,
            me.superCharge/
            skin.superNeed*100
        );

        document.getElementById("superFill")
        .style.width=percent+"%";

    }

}

/* ================= CAMERA ================= */

function worldX(x,cam){

    return x-cam.x+
    canvas.width/2;

}

function worldY(y,cam){

    return y-cam.y+
    canvas.height/2;

}

/* ================= ARENA ================= */

function drawArena(cam){

    const gradient=
    ctx.createLinearGradient(
        0,0,0,canvas.height
    );

    gradient.addColorStop(
        0,
        "#3f6745"
    );

    gradient.addColorStop(
        1,
        "#17291b"
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const grid=50;

    const ox=
    (-cam.x+
    canvas.width/2)%grid;

    const oy=
    (-cam.y+
    canvas.height/2)%grid;

    ctx.strokeStyle=
    "rgba(255,255,255,.05)";

    ctx.lineWidth=1;

    for(
        let x=ox;
        x<canvas.width;
        x+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(x,0);
        ctx.lineTo(x,canvas.height);

        ctx.stroke();

    }

    for(
        let y=oy;
        y<canvas.height;
        y+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(canvas.width,y);

        ctx.stroke();

    }

    for(const w of walls){

        const x=worldX(w.x,cam);
        const y=worldY(w.y,cam);

        ctx.fillStyle=
        "rgba(0,0,0,.35)";

        ctx.fillRect(
            x+7,
            y+8,
            w.w,
            w.h
        );

        ctx.fillStyle="#64748b";

        ctx.fillRect(
            x,
            y,
            w.w,
            w.h
        );

        ctx.strokeStyle="#cbd5e1";

        ctx.strokeRect(
            x,
            y,
            w.w,
            w.h
        );

    }

}

/* ================= CHARACTER ================= */

function getSkin(id){

    return skins.find(
        s=>s.id===id
    );

}

function drawCharacter(entity,cam){

    const x=
    worldX(entity.x,cam);

    const y=
    worldY(entity.y,cam);

    const skin=
    getSkin(entity.skin);

    const color=
    skin?.color||"#38bdf8";

    /* shadow */

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+23,
        25,
        9,
        0,
        0,
        Math.PI*2
    );

    ctx.fillStyle=
    "rgba(0,0,0,.4)";

    ctx.fill();

    /* body */

    const body=
    ctx.createLinearGradient(
        x-20,
        y-10,
        x+20,
        y+35
    );

    body.addColorStop(
        0,
        color
    );

    body.addColorStop(
        1,
        "#111827"
    );

    ctx.fillStyle=body;

    ctx.beginPath();

    ctx.roundRect(
        x-18,
        y-8,
        36,
        40,
        10
    );

    ctx.fill();

    /* head */

    ctx.fillStyle="#dcae8e";

    ctx.beginPath();

    ctx.arc(
        x,
        y-21,
        14,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* weapon */

    let angle=
    entity.id===myId
    ?
    Math.atan2(
        aimY-canvas.height/2,
        aimX-canvas.width/2
    )
    :
    entity.facing||0;

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(angle);

    ctx.strokeStyle="#e5e7eb";

    ctx.lineWidth=7;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(8,0);

    ctx.lineTo(35,0);

    ctx.stroke();

    ctx.restore();

    /* HP */

    const maxHp=
    entity.maxHp||100;

    ctx.fillStyle="#450a0a";

    ctx.fillRect(
        x-25,
        y-40,
        50,
        5
    );

    ctx.fillStyle="#22c55e";

    ctx.fillRect(
        x-25,
        y-40,
        50*
        Math.max(
            0,
            entity.hp/maxHp
        ),
        5
    );

    /* shield */

    if(entity.shield>0){

        ctx.strokeStyle=
        "#38bdf8";

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            30,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }

    /* name */

    ctx.font=
    "bold 12px Arial";

    ctx.textAlign="center";

    ctx.fillStyle="white";

    ctx.fillText(
        entity.name||"Bot",
        x,
        y-48
    );

}

/* ================= BULLETS ================= */

function drawBullets(cam){

    bullets=
    bullets.filter(b=>{

        b.x+=b.dx*b.speed/3;
        b.y+=b.dy*b.speed/3;

        b.life--;

        const x=
        worldX(b.x,cam);

        const y=
        worldY(b.y,cam);

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            5,
            0,
            Math.PI*2
        );

        ctx.fillStyle=b.color;

        ctx.shadowBlur=15;

        ctx.shadowColor=b.color;

        ctx.fill();

        ctx.shadowBlur=0;

        return b.life>0;

    });

}

/* ================= EFFECTS ================= */

function drawEffects(cam){

    effects=
    effects.filter(e=>{

        e.life--;

        const x=
        worldX(e.x,cam);

        const y=
        worldY(e.y,cam);

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            10+(20-e.life)*2,
            0,
            Math.PI*2
        );

        ctx.strokeStyle=
        e.type==="heal"
        ?" #4ade80"
        :"#facc15";

        ctx.lineWidth=4;

        ctx.stroke();

        return e.life>0;

    });

}

/* ================= GAME LOOP ================= */

function render(){

    requestAnimationFrame(render);

    if(game.style.display!=="block")
        return;

    const me=players.find(
        p=>p.id===myId
    );

    if(!me){

        ctx.fillStyle="#15231a";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        return;

    }

    const cam={
        x:me.x,
        y:me.y
    };

    drawArena(cam);

    players.forEach(p=>{

        if(p.alive)
            drawCharacter(p,cam);

    });

    bots.forEach(b=>{

        if(b.alive)
            drawCharacter(b,cam);

    });

    drawBullets(cam);

    drawEffects(cam);

}

render();

updateMenu();

</script>
