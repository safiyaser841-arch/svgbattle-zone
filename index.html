<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Battle Zone</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
    color: white;
    touch-action: none;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #20252b;
}

#status {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 10;

    padding: 10px 14px;
    border-radius: 12px;

    background: rgba(0,0,0,.65);
    font-size: 14px;
}

#hud {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 10;

    padding: 10px 14px;
    border-radius: 12px;

    background: rgba(0,0,0,.65);
    font-size: 15px;
}

#mobileControls {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
}

#joystick {
    position: absolute;
    left: 30px;
    bottom: 30px;

    width: 130px;
    height: 130px;

    border-radius: 50%;
    background: rgba(255,255,255,.12);
    border: 2px solid rgba(255,255,255,.3);

    pointer-events: auto;
}

#stick {
    position: absolute;

    width: 55px;
    height: 55px;

    left: 37px;
    top: 37px;

    border-radius: 50%;
    background: rgba(255,255,255,.45);
}

#shootButton {
    position: absolute;

    right: 35px;
    bottom: 45px;

    width: 100px;
    height: 100px;

    border-radius: 50%;
    border: 3px solid rgba(255,255,255,.5);

    background: rgba(255,70,70,.65);

    color: white;
    font-size: 18px;
    font-weight: bold;

    pointer-events: auto;
}

@media (max-width: 800px) {
    #mobileControls {
        display: block;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="status">Verbinde...</div>

<div id="hud">
    ❤️ <span id="hp">100</span>
    &nbsp; 🏆 <span id="kills">0</span>
</div>

<div id="mobileControls">

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <button id="shootButton">
        FIRE
    </button>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const statusText = document.getElementById("status");
const hpText = document.getElementById("hp");
const killsText = document.getElementById("kills");

let socket;
let myId = null;

let game = {
    map: {
        width: 1200,
        height: 700
    },
    walls: [],
    players: [],
    bullets: []
};

const keys = {
    up: false,
    down: false,
    left: false,
    right: false
};

let mouseX = 0;
let mouseY = 0;
let mouseDown = false;

let joystick = {
    active: false,
    x: 0,
    y: 0
};

function connect() {

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";

    socket = new WebSocket(
        protocol + "//" + location.host
    );

    socket.onopen = () => {
        statusText.textContent = "🟢 Verbunden";
    };

    socket.onclose = () => {
        statusText.textContent = "🔴 Verbindung verloren";

        setTimeout(connect, 2000);
    };

    socket.onerror = () => {
        statusText.textContent = "🔴 Serverfehler";
    };

    socket.onmessage = event => {

        const data = JSON.parse(event.data);

        if (data.type === "welcome") {
            myId = data.id;
            return;
        }

        if (data.type === "state") {
            game = data;

            const me = game.players.find(
                p => p.id === myId
            );

            if (me) {
                hpText.textContent = Math.max(
                    0,
                    Math.round(me.hp)
                );

                killsText.textContent = me.kills;
            }
        }
    };
}

connect();

function send(data) {

    if (
        socket &&
        socket.readyState === WebSocket.OPEN
    ) {
        socket.send(JSON.stringify(data));
    }
}

function updateInput() {

    let up = keys.up;
    let down = keys.down;
    let left = keys.left;
    let right = keys.right;

    if (joystick.active) {

        const deadzone = 0.2;

        if (joystick.y < -deadzone) up = true;
        if (joystick.y > deadzone) down = true;

        if (joystick.x < -deadzone) left = true;
        if (joystick.x > deadzone) right = true;
    }

    send({
        type: "input",
        up,
        down,
        left,
        right
    });
}

setInterval(updateInput, 50);

function getMe() {
    return game.players.find(
        p => p.id === myId
    );
}

function shoot() {

    const me = getMe();

    if (!me) return;

    const rect = canvas.getBoundingClientRect();

    const worldX =
        (mouseX - rect.left) /
        rect.width *
        game.map.width;

    const worldY =
        (mouseY - rect.top) /
        rect.height *
        game.map.height;

    const angle = Math.atan2(
        worldY - me.y,
        worldX - me.x
    );

    send({
        type: "angle",
        angle
    });

    send({
        type: "shoot",
        angle
    });
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

window.addEventListener("keydown", e => {

    if (
        e.key === "ArrowUp" ||
        e.key.toLowerCase() === "w"
    ) {
        keys.up = true;
    }

    if (
        e.key === "ArrowDown" ||
        e.key.toLowerCase() === "s"
    ) {
        keys.down = true;
    }

    if (
        e.key === "ArrowLeft" ||
        e.key.toLowerCase() === "a"
    ) {
        keys.left = true;
    }

    if (
        e.key === "ArrowRight" ||
        e.key.toLowerCase() === "d"
    ) {
        keys.right = true;
    }

    if (e.code === "Space") {
        shoot();
    }
});

window.addEventListener("keyup", e => {

    if (
        e.key === "ArrowUp" ||
        e.key.toLowerCase() === "w"
    ) {
        keys.up = false;
    }

    if (
        e.key === "ArrowDown" ||
        e.key.toLowerCase() === "s"
    ) {
        keys.down = false;
    }

    if (
        e.key === "ArrowLeft" ||
        e.key.toLowerCase() === "a"
    ) {
        keys.left = false;
    }

    if (
        e.key === "ArrowRight" ||
        e.key.toLowerCase() === "d"
    ) {
        keys.right = false;
    }
});

canvas.addEventListener("mousemove", e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
});

canvas.addEventListener("mousedown", e => {
    if (e.button === 0) {
        mouseDown = true;
        shoot();
    }
});

canvas.addEventListener("mouseup", () => {
    mouseDown = false;
});

setInterval(() => {
    if (mouseDown) {
        shoot();
    }
}, 250);

const joystickElement =
    document.getElementById("joystick");

const stickElement =
    document.getElementById("stick");

let joystickPointer = null;

joystickElement.addEventListener(
    "pointerdown",
    e => {

        joystickPointer = e.pointerId;

        joystickElement.setPointerCapture(
            e.pointerId
        );

        joystick.active = true;

        updateJoystick(e);
    }
);

joystickElement.addEventListener(
    "pointermove",
    e => {

        if (e.pointerId !== joystickPointer) {
            return;
        }

        updateJoystick(e);
    }
);

joystickElement.addEventListener(
    "pointerup",
    resetJoystick
);

joystickElement.addEventListener(
    "pointercancel",
    resetJoystick
);

function updateJoystick(e) {

    const rect =
        joystickElement.getBoundingClientRect();

    const centerX =
        rect.left + rect.width / 2;

    const centerY =
        rect.top + rect.height / 2;

    let x =
        (e.clientX - centerX) /
        (rect.width / 2);

    let y =
        (e.clientY - centerY) /
        (rect.height / 2);

    const length = Math.hypot(x, y);

    if (length > 1) {
        x /= length;
        y /= length;
    }

    joystick.x = x;
    joystick.y = y;

    stickElement.style.transform =
        `translate(${x * 35}px, ${y * 35}px)`;
}

function resetJoystick() {

    joystick.active = false;
    joystick.x = 0;
    joystick.y = 0;

    stickElement.style.transform =
        "translate(0,0)";
}

document
    .getElementById("shootButton")
    .addEventListener("pointerdown", e => {
        e.preventDefault();
        shoot();
    });

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const scaleX =
        canvas.width / game.map.width;

    const scaleY =
        canvas.height / game.map.height;

    ctx.save();

    ctx.scale(scaleX, scaleY);

    // Boden
    ctx.fillStyle = "#252b31";

    ctx.fillRect(
        0,
        0,
        game.map.width,
        game.map.height
    );

    // Raster
    ctx.strokeStyle = "rgba(255,255,255,.035)";
    ctx.lineWidth = 1;

    for (let x = 0; x < game.map.width; x += 50) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, game.map.height);
        ctx.stroke();
    }

    for (let y = 0; y < game.map.height; y += 50) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(game.map.width, y);
        ctx.stroke();
    }

    // Wände
    for (const wall of game.walls) {

        ctx.fillStyle = "#454d56";

        ctx.fillRect(
            wall.x,
            wall.y,
            wall.w,
            wall.h
        );

        ctx.strokeStyle = "#68727d";
        ctx.lineWidth = 3;

        ctx.strokeRect(
            wall.x,
            wall.y,
            wall.w,
            wall.h
        );
    }

    // Kugeln
    for (const bullet of game.bullets) {

        ctx.beginPath();

        ctx.arc(
            bullet.x,
            bullet.y,
            5,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#ffd84d";
        ctx.fill();
    }

    // Spieler
    for (const player of game.players) {

        const isMe =
            player.id === myId;

        ctx.save();

        ctx.translate(
            player.x,
            player.y
        );

        ctx.rotate(player.angle);

        // Schatten
        ctx.beginPath();
        ctx.arc(
            3,
            5,
            19,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "rgba(0,0,0,.3)";

        ctx.fill();

        // Körper
        ctx.beginPath();

        ctx.arc(
            0,
            0,
            18,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            isMe ? "#35a7ff" : "#ff4d5d";

        ctx.fill();

        ctx.strokeStyle = "white";
        ctx.lineWidth = 2;

        ctx.stroke();

        // Waffe
        ctx.fillStyle = "#202020";

        ctx.fillRect(
            8,
            -5,
            25,
            10
        );

        ctx.restore();

        // Lebensbalken
        const barWidth = 45;

        ctx.fillStyle = "#111";

        ctx.fillRect(
            player.x - barWidth / 2,
            player.y - 31,
            barWidth,
            6
        );

        ctx.fillStyle = "#42e66b";

        ctx.fillRect(
            player.x - barWidth / 2,
            player.y - 31,
            barWidth *
                Math.max(
                    0,
                    player.hp / 100
                ),
            6
        );

        if (isMe) {

            ctx.fillStyle = "white";
            ctx.font = "12px Arial";
            ctx.textAlign = "center";

            ctx.fillText(
                "DU",
                player.x,
                player.y - 38
            );
        }
    }

    ctx.restore();

    requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
