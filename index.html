<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Battle Zone</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #101820;
    color: white;
}

button,
input,
select {
    font-family: Arial, sans-serif;
}

button {
    cursor: pointer;
}

.screen {
    width: 100%;
    height: 100%;
}

/* MENU */

#menu {
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at center, #214b70 0%, #101820 55%, #05080c 100%);
}

.menuBox {
    width: min(450px, 92%);
    background: rgba(10, 17, 27, 0.96);
    padding: 30px;
    border-radius: 22px;
    text-align: center;
    box-shadow: 0 0 50px rgba(0,0,0,.6);
}

.logo {
    font-size: 42px;
    font-weight: 900;
    color: #38bdf8;
    margin-bottom: 8px;
}

.subtitle {
    color: #94a3b8;
    margin-bottom: 25px;
}

input,
select {
    width: 100%;
    padding: 13px;
    margin-top: 9px;
    border: 1px solid #334155;
    border-radius: 10px;
    background: #111827;
    color: white;
    outline: none;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 9px;
    border: none;
    border-radius: 10px;
    color: white;
    font-weight: bold;
    background: #2563eb;
}

button:hover {
    filter: brightness(1.15);
}

.darkButton {
    background: #1e293b;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 7px;
    margin-bottom: 10px;
}

.stat {
    background: #0b1220;
    padding: 10px;
    border-radius: 9px;
    font-size: 12px;
}

.stat strong {
    display: block;
    margin-top: 4px;
    color: #38bdf8;
}

/* LOBBY */

#lobby {
    display: none;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle, #1e4968, #060a0f);
}

.lobbyBox {
    width: min(850px, 94%);
    background: rgba(10,17,27,.97);
    border-radius: 20px;
    padding: 22px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.characterArea {
    min-height: 400px;
    border-radius: 15px;
    background:
        radial-gradient(circle, #355d7d, #0b1118);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

.character {
    width: 90px;
    height: 120px;
    border-radius: 30px 30px 20px 20px;
    background: linear-gradient(145deg,#38bdf8,#164e63);
    position: relative;
    box-shadow: 0 20px 30px rgba(0,0,0,.5);
}

.character::before {
    content: "";
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #e8b995;
    position: absolute;
    left: 15px;
    top: -40px;
}

.lobbyInfo {
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.roomCode {
    font-size: 45px;
    font-weight: 900;
    letter-spacing: 8px;
    color: #38bdf8;
    margin: 10px 0;
}

/* GAME */

#game {
    display: none;
    position: relative;
    background: #263c28;
}

canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
}

.hud {
    position: absolute;
    top: 10px;
    left: 10px;
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    z-index: 10;
}

.hudBox {
    background: rgba(0,0,0,.65);
    padding: 8px 11px;
    border-radius: 8px;
    font-size: 13px;
}

.health {
    color: #4ade80;
}

.shield {
    color: #38bdf8;
}

/* CONTROLS */

#shootButton {
    position: absolute;
    right: 25px;
    bottom: 25px;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: #dc2626;
    font-size: 30px;
    z-index: 20;
}

#healButton {
    position: absolute;
    right: 140px;
    bottom: 40px;
    width: 85px;
    height: 50px;
    background: #15803d;
    z-index: 20;
}

#joystick {
    display: none;
    position: absolute;
    left: 25px;
    bottom: 25px;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: rgba(255,255,255,.12);
    border: 2px solid rgba(255,255,255,.3);
    z-index: 20;
}

#stick {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(255,255,255,.55);
    position: absolute;
    left: 40px;
    top: 40px;
}

/* MESSAGE */

#message {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    font-size: 55px;
    font-weight: 900;
    text-align: center;
    display: none;
    z-index: 30;
}

/* MOBILE */

@media (pointer: coarse) {
    #joystick {
        display: block;
    }
}

@media (max-width: 700px) {

    .logo {
        font-size: 32px;
    }

    .menuBox {
        padding: 20px;
    }

    .lobbyBox {
        grid-template-columns: 1fr;
    }

    .characterArea {
        min-height: 220px;
    }

    .lobbyInfo {
        text-align: center;
    }

    .roomCode {
        font-size: 35px;
    }
}
</style>
</head>

<body>

<!-- MENU -->

<div id="menu" class="screen">

    <div class="menuBox">

        <div class="logo">⚡ BATTLE ZONE</div>

        <div class="subtitle">
            Simple Multiplayer Battle Arena
        </div>

        <div class="stats">

            <div class="stat">
                🏆 Trophäen
                <strong id="trophies">0</strong>
            </div>

            <div class="stat">
                💀 Kills
                <strong id="kills">0</strong>
            </div>

            <div class="stat">
                👤 Spieler
                <strong>Online</strong>
            </div>

        </div>

        <input
            id="playerName"
            maxlength="15"
            placeholder="Dein Name"
        >

        <select id="difficulty">

            <option value="easy">
                🟢 Leicht
            </option>

            <option value="medium" selected>
                🟡 Mittel
            </option>

            <option value="hard">
                🔴 Schwer
            </option>

        </select>

        <select id="botCount">

            <option value="0">0 Bots</option>
            <option value="1">1 Bot</option>
            <option value="2" selected>2 Bots</option>
            <option value="3">3 Bots</option>
            <option value="4">4 Bots</option>
            <option value="5">5 Bots</option>

        </select>

        <button id="createButton">
            🎮 Lobby erstellen
        </button>

        <input
            id="roomCodeInput"
            maxlength="4"
            placeholder="Raumcode"
        >

        <button id="joinButton" class="darkButton">
            👥 Lobby beitreten
        </button>

        <button id="tutorialButton" class="darkButton">
            📖 Tutorial
        </button>

    </div>

</div>


<!-- LOBBY -->

<div id="lobby" class="screen">

    <div class="lobbyBox">

        <div class="characterArea">

            <div
                id="lobbyCharacter"
                class="character">
            </div>

        </div>

        <div class="lobbyInfo">

            <h1>⚡ Battle Zone</h1>

            <p style="margin-top:10px">
                Spieler:
                <b id="lobbyName">Player</b>
            </p>

            <p style="margin-top:8px">
                Schwierigkeit:
                <b id="lobbyDifficulty">Mittel</b>
            </p>

            <p style="margin-top:8px">
                Bots:
                <b id="lobbyBots">2</b>
            </p>

            <p style="margin-top:15px">
                Raumcode:
            </p>

            <div id="lobbyRoom" class="roomCode">
                ----
            </div>

            <button id="playButton">
                ▶ SPIELEN
            </button>

            <button id="backButton" class="darkButton">
                Zurück
            </button>

        </div>

    </div>

</div>


<!-- GAME -->

<div id="game" class="screen">

    <canvas id="canvas"></canvas>

    <div class="hud">

        <div class="hudBox">
            🏠 <span id="hudRoom">----</span>
        </div>

        <div class="hudBox health">
            ❤️ <span id="hudHealth">100</span>
        </div>

        <div class="hudBox shield">
            🛡️ <span id="hudShield">50</span>
        </div>

        <div class="hudBox">
            💀 <span id="hudKills">0</span>
        </div>

        <div class="hudBox">
            👥 <span id="hudPlayers">0</span>
        </div>

    </div>

    <button id="healButton">
        💚 HEILEN
    </button>

    <button id="shootButton">
        🔥
    </button>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="message"></div>

</div>


<script>

"use strict";

/* =========================
   SERVER
========================= */

const SERVER_URL =
    "wss://svgbattle-server.onrender.com";


/* =========================
   VARIABLES
========================= */

let socket = null;
let connected = false;

let myId = null;
let roomCode = "";

let players = [];
let bots = [];

let gameStarted = false;

let aimX = window.innerWidth / 2 + 100;
let aimY = window.innerHeight / 2;

let joystickX = 0;
let joystickY = 0;

let shooting = false;

let kills =
    Number(localStorage.getItem("battleKills") || 0);

let trophies =
    Number(localStorage.getItem("battleTrophies") || 0);


/* =========================
   CANVAS
========================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


function resizeCanvas() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================
   UI
========================= */

const menu =
    document.getElementById("menu");

const lobby =
    document.getElementById("lobby");

const game =
    document.getElementById("game");


function show(element) {

    element.style.display = "flex";

}


function hide(element) {

    element.style.display = "none";

}


function updateStats() {

    document.getElementById("kills").textContent =
        kills;

    document.getElementById("trophies").textContent =
        trophies;

}

updateStats();


/* =========================
   CONNECT
========================= */

function connect() {

    try {

        socket =
            new WebSocket(SERVER_URL);

    } catch (error) {

        console.error(error);

        return;

    }


    socket.onopen = function() {

        connected = true;

        console.log(
            "Battle Zone Server verbunden"
        );

    };


    socket.onclose = function() {

        connected = false;

        console.log(
            "Server getrennt"
        );

    };


    socket.onerror = function(error) {

        console.error(
            "WebSocket Fehler:",
            error
        );

    };


    socket.onmessage = function(event) {

        try {

            const data =
                JSON.parse(event.data);

            handleMessage(data);

        } catch (error) {

            console.error(
                "Nachrichtenfehler:",
                error
            );

        }

    };

}

connect();


/* =========================
   SEND
========================= */

function send(data) {

    if (
        socket &&
        socket.readyState === WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify(data)
        );

    }

}


/* =========================
   SERVER MESSAGES
========================= */

function handleMessage(data) {

    if (data.type === "connected") {

        myId = data.id;

        return;
    }


    if (data.type === "roomCreated") {

        roomCode = data.code;

        showLobby();

        return;
    }


    if (data.type === "joinedRoom") {

        roomCode = data.code;

        showLobby();

        return;
    }


    if (data.type === "state") {

        players = data.players || [];

        bots = data.bots || [];

        updateGameHUD();

        return;
    }


    if (data.type === "elimination") {

        if (data.killer === myId) {

            kills++;
            trophies++;

            localStorage.setItem(
                "battleKills",
                kills
            );

            localStorage.setItem(
                "battleTrophies",
                trophies
            );

            updateStats();

        }

        return;
    }


    if (data.type === "roundEnd") {

        gameStarted = false;

        const message =
            document.getElementById("message");

        if (data.winner === myId) {

            message.textContent =
                "🏆 SIEG!";

        } else {

            message.textContent =
                "💀 VERLOREN!";

        }

        message.style.display =
            "block";

        return;
    }


    if (data.type === "newRound") {

        document.getElementById(
            "message"
        ).style.display = "none";

        gameStarted = true;

        return;
    }


    if (data.type === "error") {

        alert(
            data.message || "Fehler"
        );

        return;
    }

}


/* =========================
   CREATE ROOM
========================= */

document
.getElementById("createButton")
.addEventListener("click", function() {

    if (!connected) {

        alert(
            "Server wird noch verbunden..."
        );

        return;
    }


    const name =
        document
        .getElementById("playerName")
        .value
        .trim() || "Player";


    const difficulty =
        document
        .getElementById("difficulty")
        .value;


    const bots =
        Number(
            document
            .getElementById("botCount")
            .value
        );


    send({

        type: "createRoom",

        name: name,

        difficulty: difficulty,

        bots: bots

    });

});


/* =========================
   JOIN ROOM
========================= */

document
.getElementById("joinButton")
.addEventListener("click", function() {

    if (!connected) {

        alert(
            "Server wird noch verbunden..."
        );

        return;
    }


    const name =
        document
        .getElementById("playerName")
        .value
        .trim() || "Player";


    const code =
        document
        .getElementById("roomCodeInput")
        .value
        .trim()
        .toUpperCase();


    if (code.length !== 4) {

        alert(
            "Der Raumcode muss 4 Zeichen haben."
        );

        return;
    }


    send({

        type: "joinRoom",

        name: name,

        code: code

    });

});


/* =========================
   LOBBY
========================= */

function showLobby() {

    hide(menu);

    show(lobby);

    document
    .getElementById("lobbyRoom")
    .textContent = roomCode;


    document
    .getElementById("lobbyName")
    .textContent =
        document
        .getElementById("playerName")
        .value
        .trim() || "Player";


    const difficulty =
        document
        .getElementById("difficulty")
        .value;


    document
    .getElementById("lobbyDifficulty")
    .textContent =
        difficulty === "easy"
        ? "Leicht"
        : difficulty === "hard"
        ? "Schwer"
        : "Mittel";


    document
    .getElementById("lobbyBots")
    .textContent =
        document
        .getElementById("botCount")
        .value;

}


/* =========================
   START GAME
========================= */

document
.getElementById("playButton")
.addEventListener("click", function() {

    hide(lobby);

    show(game);

    gameStarted = true;

    send({
        type: "startGame"
    });

});


/* =========================
   BACK
========================= */

document
.getElementById("backButton")
.addEventListener("click", function() {

    hide(lobby);

    show(menu);

});


/* =========================
   KEYBOARD
========================= */

const keys = {

    up: false,
    down: false,
    left: false,
    right: false

};


window.addEventListener(
"keydown",
function(event) {

    if (event.key === "ArrowUp") {

        keys.up = true;

        event.preventDefault();

    }

    if (event.key === "ArrowDown") {

        keys.down = true;

        event.preventDefault();

    }

    if (event.key === "ArrowLeft") {

        keys.left = true;

        event.preventDefault();

    }

    if (event.key === "ArrowRight") {

        keys.right = true;

        event.preventDefault();

    }

});


window.addEventListener(
"keyup",
function(event) {

    if (event.key === "ArrowUp")
        keys.up = false;

    if (event.key === "ArrowDown")
        keys.down = false;

    if (event.key === "ArrowLeft")
        keys.left = false;

    if (event.key === "ArrowRight")
        keys.right = false;

});


/* =========================
   MOVEMENT
========================= */

setInterval(
function() {

    if (!gameStarted)
        return;


    let dx = 0;
    let dy = 0;


    if (keys.right)
        dx += 1;

    if (keys.left)
        dx -= 1;

    if (keys.down)
        dy += 1;

    if (keys.up)
        dy -= 1;


    dx += joystickX;
    dy += joystickY;


    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (length > 1) {

        dx /= length;
        dy /= length;

    }


    if (
        Math.abs(dx) > 0 ||
        Math.abs(dy) > 0
    ) {

        send({

            type: "move",

            dx: dx,

            dy: dy

        });

    }

}, 50);


/* =========================
   MOUSE AIM
========================= */

window.addEventListener(
"mousemove",
function(event) {

    aimX = event.clientX;
    aimY = event.clientY;

});


/* =========================
   SHOOT
========================= */

function shoot() {

    if (!gameStarted)
        return;


    const centerX =
        canvas.width / 2;

    const centerY =
        canvas.height / 2;


    let dx =
        aimX - centerX;

    let dy =
        aimY - centerY;


    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (length < 5)
        return;


    dx /= length;
    dy /= length;


    send({

        type: "shoot",

        dx: dx,

        dy: dy

    });

}


document
.getElementById("shootButton")
.addEventListener(
"pointerdown",
function(event) {

    event.preventDefault();

    shooting = true;

    shoot();

});


document
.getElementById("shootButton")
.addEventListener(
"pointerup",
function() {

    shooting = false;

});


setInterval(
function() {

    if (shooting)
        shoot();

}, 250);


/* =========================
   HEAL
========================= */

document
.getElementById("healButton")
.addEventListener(
"click",
function() {

    send({
        type: "heal"
    });

});


/* =========================
   JOYSTICK
========================= */

const joystick =
    document.getElementById("joystick");

const stick =
    document.getElementById("stick");

let joystickActive = false;


joystick.addEventListener(
"pointerdown",
function(event) {

    joystickActive = true;

    joystick.setPointerCapture(
        event.pointerId
    );

    updateJoystick(
        event.clientX,
        event.clientY
    );

});


joystick.addEventListener(
"pointermove",
function(event) {

    if (!joystickActive)
        return;

    updateJoystick(
        event.clientX,
        event.clientY
    );

});


joystick.addEventListener(
"pointerup",
resetJoystick
);

joystick.addEventListener(
"pointercancel",
resetJoystick
);


function updateJoystick(x,y) {

    const rect =
        joystick.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        x - centerX;


    let dy =
        y - centerY;


    const max =
        40;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (distance > max) {

        dx =
            dx / distance * max;

        dy =
            dy / distance * max;

    }


    joystickX =
        dx / max;

    joystickY =
        dy / max;


    stick.style.left =
        (40 + dx) + "px";

    stick.style.top =
        (40 + dy) + "px";

}


function resetJoystick() {

    joystickActive = false;

    joystickX = 0;
    joystickY = 0;

    stick.style.left = "40px";
    stick.style.top = "40px";

}


/* =========================
   HUD
========================= */

function updateGameHUD() {

    const me =
        players.find(
            player =>
                player.id === myId
        );


    if (!me)
        return;


    document
    .getElementById("hudRoom")
    .textContent =
        roomCode;


    document
    .getElementById("hudHealth")
    .textContent =
        me.hp;


    document
    .getElementById("hudShield")
    .textContent =
        me.shield;


    document
    .getElementById("hudKills")
    .textContent =
        me.kills;


    document
    .getElementById("hudPlayers")
    .textContent =
        players.length +
        bots.length;

}


/* =========================
   DRAW MAP
========================= */

function drawBackground() {

    ctx.fillStyle =
        "#263c28";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.strokeStyle =
        "rgba(255,255,255,.05)";


    const size = 50;


    for (
        let x = 0;
        x < canvas.width;
        x += size
    ) {

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(
            x,
            canvas.height
        );

        ctx.stroke();

    }


    for (
        let y = 0;
        y < canvas.height;
        y += size
    ) {

        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(
            canvas.width,
            y
        );

        ctx.stroke();

    }

}


/* =========================
   DRAW PLAYER
========================= */

function drawPlayer(
    player,
    isMe
) {

    const x =
        canvas.width / 2 +
        (player.x -
        getMyPlayer().x);


    const y =
        canvas.height / 2 +
        (player.y -
        getMyPlayer().y);


    if (
        x < -100 ||
        x > canvas.width + 100 ||
        y < -100 ||
        y > canvas.height + 100
    )
        return;


    /* SHADOW */

    ctx.beginPath();

    ctx.ellipse(
        x,
        y + 20,
        25,
        9,
        0,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.fill();


    /* BODY */

    ctx.beginPath();

    ctx.roundRect(
        x - 18,
        y - 5,
        36,
        40,
        10
    );

    ctx.fillStyle =
        isMe
        ? "#38bdf8"
        : "#ef4444";

    ctx.fill();


    /* HEAD */

    ctx.beginPath();

    ctx.arc(
        x,
        y - 20,
        14,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#e8b995";

    ctx.fill();


    /* WEAPON */

    ctx.save();

    ctx.translate(
        x,
        y
    );


    let angle = 0;


    if (isMe) {

        angle =
            Math.atan2(
                aimY -
                canvas.height / 2,

                aimX -
                canvas.width / 2
            );

    } else {

        angle =
            player.angle || 0;

    }


    ctx.rotate(angle);


    ctx.fillStyle =
        "#111827";

    ctx.fillRect(
        5,
        -4,
        35,
        8
    );


    ctx.restore();


    /* HEALTH BAR */

    ctx.fillStyle =
        "#450a0a";

    ctx.fillRect(
        x - 25,
        y - 45,
        50,
        5
    );


    ctx.fillStyle =
        "#22c55e";

    ctx.fillRect(
        x - 25,
        y - 45,
        50 *
        Math.max(
            0,
            player.hp /
            player.maxHp
        ),
        5
    );


    /* NAME */

    ctx.font =
        "bold 12px Arial";

    ctx.textAlign =
        "center";

    ctx.fillStyle =
        "white";

    ctx.fillText(
        player.name,
        x,
        y - 52
    );

}


function getMyPlayer() {

    return players.find(
        player =>
            player.id === myId
    );

}


/* =========================
   DRAW BOTS
========================= */

function drawBot(bot) {

    const me =
        getMyPlayer();


    if (!me)
        return;


    const x =
        canvas.width / 2 +
        (bot.x - me.x);


    const y =
        canvas.height / 2 +
        (bot.y - me.y);


    if (
        x < -100 ||
        x > canvas.width + 100 ||
        y < -100 ||
        y > canvas.height + 100
    )
        return;


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        22,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#ef4444";

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x,
        y - 25,
        12,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#e8b995";

    ctx.fill();


    ctx.fillStyle =
        "#450a0a";

    ctx.fillRect(
        x - 25,
        y - 43,
        50,
        5
    );


    ctx.fillStyle =
        "#22c55e";

    ctx.fillRect(
        x - 25,
        y - 43,
        50 *
        Math.max(
            0,
            bot.hp /
            bot.maxHp
        ),
        5
    );


    ctx.font =
        "bold 12px Arial";

    ctx.textAlign =
        "center";

    ctx.fillStyle =
        "white";

    ctx.fillText(
        bot.name,
        x,
        y - 50
    );

}


/* =========================
   GAME LOOP
========================= */

function render() {

    requestAnimationFrame(render);


    if (!gameStarted)
        return;


    drawBackground();


    const me =
        getMyPlayer();


    if (!me)
        return;


    players.forEach(
        player => {

            if (player.alive) {

                drawPlayer(
                    player,
                    player.id === myId
                );

            }

        }
    );


    bots.forEach(
        bot => {

            if (bot.alive) {

                drawBot(bot);

            }

        }
    );

}


render();
