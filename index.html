<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Battle Zone</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #1d344d,
            #050911
        );

    color: white;

    font-family: Arial, sans-serif;

    touch-action: none;
}

button,
input,
select {
    font: inherit;
}

button {
    border: 0;
    cursor: pointer;
}

/* =========================
   MENU
========================= */

#menu {
    position: fixed;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    z-index: 100;
}

.menu-box {
    width: min(520px, 92vw);

    padding: 28px;

    border-radius: 24px;

    background:
        rgba(8, 15, 25, .96);

    box-shadow:
        0 25px 90px
        rgba(0,0,0,.7);

    text-align: center;
}

.logo {
    font-size: 44px;
    font-weight: 900;

    color: #38bdf8;

    text-shadow:
        0 0 25px #38bdf8;

    margin-bottom: 5px;
}

.sub {
    color: #94a3b8;
    margin-bottom: 15px;
}

.input,
.select {
    width: 100%;

    padding: 13px;
    margin: 5px 0;

    border-radius: 10px;
    border: 1px solid #334155;

    background: #0f172a;
    color: white;
}

.btn {
    width: 100%;

    padding: 14px;
    margin-top: 7px;

    border-radius: 11px;

    color: white;

    background:
        linear-gradient(
            135deg,
            #38bdf8,
            #2563eb
        );

    font-weight: bold;
}

.btn.dark {
    background: #1e293b;
}

.profile {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 6px;

    margin: 12px 0;
}

.profile-box {
    padding: 8px;

    border-radius: 9px;

    background:
        #0b1220;

    font-size: 13px;
}

/* =========================
   SKINS
========================= */

#skins {
    position: fixed;
    inset: 0;

    display: none;

    z-index: 120;

    background:
        #060b12;

    overflow: auto;

    padding: 16px;
}

.skin-header {
    width: min(1050px, 96vw);
    margin: auto;

    display: flex;

    justify-content:
        space-between;

    align-items: center;
}

.skin-grid {
    width: min(1050px, 96vw);
    margin: 18px auto;

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(155px, 1fr)
        );

    gap: 12px;
}

.skin-card {
    padding: 10px;

    border-radius: 16px;

    background:
        #101827;

    border:
        1px solid #334155;
}

.skin-preview {
    height: 115px;

    border-radius: 12px;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle,
            #29405c,
            #0b111b
        );
}

.avatar-preview {
    position: relative;

    width: 55px;
    height: 72px;

    border-radius:
        22px 22px 14px 14px;

    box-shadow:
        inset -12px -12px 17px
        rgba(0,0,0,.35);
}

.avatar-head {
    position: absolute;

    width: 38px;
    height: 38px;

    left: 8px;
    top: -15px;

    border-radius: 50%;

    background: #f0c6a5;
}

.rarity {
    color: #cbd5e1;
    font-size: 13px;

    margin-top: 5px;
}

.weapon-text {
    margin-top: 4px;

    color: #cbd5e1;
}

.price {
    margin-top: 5px;

    color: #facc15;
}

.super-text {
    margin-top: 4px;

    color: #c4b5fd;

    font-size: 12px;
}

.skin-card button {
    width: 100%;

    margin-top: 8px;

    padding: 9px;

    border-radius: 8px;

    background: #2563eb;

    color: white;
}

/* =========================
   TUTORIAL
========================= */

#tutorial {
    position: fixed;
    inset: 0;

    display: none;

    justify-content: center;
    align-items: center;

    z-index: 200;

    background:
        rgba(0,0,0,.78);
}

.tutorial-box {
    width: min(500px, 92vw);

    padding: 28px;

    border-radius: 20px;

    background: #111827;

    text-align: center;
}

.tutorial-box p {
    color: #cbd5e1;

    line-height: 1.6;

    margin:
        18px 0;
}

/* =========================
   LOBBY
========================= */

#lobby {
    position: fixed;
    inset: 0;

    display: none;

    z-index: 110;

    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle,
            #173450,
            #03070c
        );
}

.lobby {
    width: min(1000px, 95vw);

    min-height: 570px;

    padding: 18px;

    display:
        grid;

    grid-template-columns:
        1.2fr .8fr;

    gap: 20px;

    border-radius: 22px;

    background:
        rgba(10,17,28,.94);
}

.lobby-preview {
    min-height: 520px;

    border-radius: 18px;

    background:
        radial-gradient(
            circle,
            #2b4564,
            #0a1019
        );

    position: relative;

    overflow: hidden;
}

.lobby-character {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: 120px;
    height: 160px;

    border-radius:
        45px 45px 25px 25px;

    box-shadow:
        inset -24px -25px 40px
        rgba(0,0,0,.45),

        0 25px 50px
        rgba(0,0,0,.4);
}

.lobby-head {
    position: absolute;

    width: 78px;
    height: 78px;

    top: -30px;
    left: 21px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffe4c7,
            #b97957
        );
}

.lobby-weapon {
    position: absolute;

    width: 85px;
    height: 12px;

    background:
        linear-gradient(
            90deg,
            #111827,
            #e5e7eb
        );

    right: -60px;
    top: 70px;

    border-radius: 10px;
}

.lobby-info {
    display:
        flex;

    flex-direction:
        column;

    justify-content:
        center;

    gap: 10px;
}

.room-code {
    font-size: 42px;

    font-weight: 900;

    letter-spacing: 8px;

    color: #38bdf8;
}

/* =========================
   GAME
========================= */

#game {
    position: fixed;
    inset: 0;

    display: none;

    background:
        #111923;
}

#canvas {
    display: block;

    width: 100%;
    height: 100%;
}

/* =========================
   HUD
========================= */

#hud {
    position: fixed;

    left: 10px;
    top: 10px;

    right: 10px;

    z-index: 20;

    display:
        flex;

    justify-content:
        space-between;

    gap: 6px;
}

.hud-box {
    padding: 9px 12px;

    border-radius: 9px;

    background:
        rgba(3,8,15,.78);

    border:
        1px solid #334155;

    backdrop-filter:
        blur(6px);
}

#roomTop {
    color: #38bdf8;
    font-weight: bold;
}

/* =========================
   SUPER
========================= */

#super-bar {
    position: fixed;

    left: 50%;
    bottom: 15px;

    transform:
        translateX(-50%);

    width: 240px;
    height: 11px;

    border-radius: 10px;

    background: #0b1220;

    z-index: 25;

    overflow: hidden;
}

#super-fill {
    width: 0;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #7c3aed,
            #ec4899
        );
}

#super-button {
    position: fixed;

    left: 50%;
    bottom: 38px;

    transform:
        translateX(-50%);

    z-index: 26;

    width: 95px;

    padding: 9px;

    border-radius: 10px;

    background:
        #334155;

    color: white;

    font-weight: bold;
}

#super-button.ready {
    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #ec4899
        );

    box-shadow:
        0 0 25px
        rgba(236,72,153,.7);
}

/* =========================
   MOBILE
========================= */

#joystick {
    display: none;

    position: fixed;

    left: 22px;
    bottom: 22px;

    width: 135px;
    height: 135px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.12);

    border:
        2px solid
        rgba(255,255,255,.25);

    z-index: 40;
}

#stick {
    position: absolute;

    left: 38px;
    top: 38px;

    width: 58px;
    height: 58px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.5);
}

#shoot {
    display: none;

    position: fixed;

    right: 25px;
    bottom: 35px;

    width: 95px;
    height: 95px;

    border-radius: 50%;

    border:
        4px solid white;

    background:
        radial-gradient(
            circle,
            #ef4444,
            #991b1b
        );

    color: white;

    z-index: 40;

    font-size: 29px;
}

#aim {
    display: none;

    position: fixed;

    top: 0;
    right: 0;

    width: 55%;
    height: 100%;

    z-index: 30;
}

@media(pointer: coarse) {
    #joystick,
    #shoot,
    #aim {
        display: block;
    }

    .lobby {
        grid-template-columns: 1fr;
    }

    .lobby-preview {
        min-height: 280px;
    }
}

</style>
</head>

<body>

<!-- =========================
     START MENU
========================= -->

<div id="menu">
    <div class="menu-box">

        <div class="logo">
            ⚡ BATTLE ZONE
        </div>

        <div class="sub">
            Multiplayer Arena
        </div>

        <div class="profile">

            <div class="profile-box">
                🏆<br>
                Trophäen
                <b id="menuTrophies">0</b>
            </div>

            <div class="profile-box">
                💀<br>
                Kills
                <b id="menuKills">0</b>
            </div>

            <div class="profile-box">
                👤<br>
                Skin
                <b id="menuSkin">Rookie</b>
            </div>

        </div>

        <input
            class="input"
            id="name"
            maxlength="15"
            placeholder="Dein Name"
        >

        <button
            class="btn"
            onclick="createRoom()"
        >
            🎮 Lobby erstellen
        </button>

        <input
            class="input"
            id="joinCode"
            maxlength="4"
            placeholder="Raumcode"
        >

        <button
            class="btn dark"
            onclick="joinRoom()"
        >
            👥 Lobby beitreten
        </button>

        <button
            class="btn dark"
            onclick="openSkins()"
        >
            👤 Skin-Menü
        </button>

        <button
            class="btn dark"
            onclick="openTutorial()"
        >
            📖 Tutorial
        </button>

    </div>
</div>

<!-- =========================
     SKIN MENU
========================= -->

<div id="skins">

    <div class="skin-header">

        <h1>
            👤 Skin-Menü
        </h1>

        <button
            class="btn dark"
            style="width:auto;padding:10px 18px"
            onclick="closeSkins()"
        >
            Zurück
        </button>

    </div>

    <div
        id="skinGrid"
        class="skin-grid"
    ></div>

</div>

<!-- =========================
     LOBBY
========================= -->

<div id="lobby">

    <div class="lobby">

        <div
            id="lobbyPreview"
            class="lobby-preview"
        >

            <div
                id="lobbyCharacter"
                class="lobby-character"
            >

                <div
                    class="lobby-head"
                ></div>

                <div
                    class="lobby-weapon"
                ></div>

            </div>

        </div>

        <div class="lobby-info">

            <h1
                id="lobbyName"
            >
                Rookie
            </h1>

            <div>
                Seltenheit:
                <b id="lobbyRarity">
                    Standard
                </b>
            </div>

            <div>
                🔫 Waffe:
                <b id="lobbyWeapon">
                    Pistole
                </b>
            </div>

            <div>
                💥 Schaden:
                <b id="lobbyDamage">
                    +0%
                </b>
            </div>

            <div>
                ⚡ Super:
                <b id="lobbySuper">
                    -
                </b>
            </div>

            <div>
                🏆 Trophäen:
                <b id="lobbyTrophies">
                    0
                </b>
            </div>

            <div>
                💀 Skin-Kills:
                <b id="lobbySkinKills">
                    0
                </b>
            </div>

            <div>
                🏠 Raumcode:
            </div>

            <div
                id="roomCode"
                class="room-code"
            >
                ----
            </div>

            <button
                class="btn"
                onclick="copyRoom()"
            >
                📋 Code kopieren
            </button>

            <button
                class="btn"
                onclick="startGame()"
            >
                ▶ SPIELEN
            </button>

        </div>

    </div>

</div>

<!-- =========================
     TUTORIAL
========================= -->

<div id="tutorial">

    <div class="tutorial-box">

        <h2
            id="tutorialTitle"
        >
            Tutorial
        </h2>

        <p
            id="tutorialText"
        ></p>

        <div
            id="tutorialCount"
        >
            1 / 9
        </div>

        <button
            class="btn"
            onclick="nextTutorial()"
        >
            Weiter
        </button>

    </div>

</div>

<!-- =========================
     GAME
========================= -->

<div id="game">

    <canvas id="canvas"></canvas>

    <div id="hud">

        <div class="hud-box">
            🏠
            <span id="roomTop">
                ----
            </span>
        </div>

        <div class="hud-box">
            ❤️
            <span id="hp">
                100
            </span>
        </div>

        <div class="hud-box">
            🔫
            <span id="weaponName">
                -
            </span>
        </div>

        <div class="hud-box">
            💀
            <span id="gameKills">
                0
            </span>
        </div>

    </div>

    <div id="super-bar">
        <div
            id="super-fill"
        ></div>
    </div>

    <button
        id="super-button"
        onclick="useSuper()"
    >
        ⚡ SUPER
    </button>

    <div id="aim"></div>

    <div id="joystick">

        <div
            id="stick"
        ></div>

    </div>

    <button id="shoot">
        🔥
    </button>

</div>

<script>

/* =====================================================
   CONNECTION
===================================================== */

const SERVER =
    "wss://svgbattle-server.onrender.com";

let socket = null;

function connect() {

    socket =
        new WebSocket(
            SERVER
        );

    socket.onopen =
        () => {

            console.log(
                "Battle Zone verbunden"
            );
        };

    socket.onclose =
        () => {

            console.log(
                "Server getrennt"
            );
        };

    socket.onerror =
        () => {

            console.log(
                "Verbindungsfehler"
            );
        };

    socket.onmessage =
        event => {

            try {

                handleServerMessage(
                    JSON.parse(
                        event.data
                    )
                );

            } catch(error) {

                console.error(
                    error
                );
            }
        };
}

function send(data) {

    if (
        socket &&
        socket.readyState ===
            WebSocket.OPEN
    ) {
        socket.send(
            JSON.stringify(
                data
            )
        );
    }
}

connect();

/* =====================================================
   DATA
===================================================== */

let myId = null;
let roomCode = "";

let players = {};
let bots = [];
let bullets = [];
let effects = [];

let tutorial = [];
let tutorialIndex = 0;

let selectedSkin =
    localStorage.getItem(
        "battleSkin"
    ) ||
    "standard";

let kills =
    Number(
        localStorage.getItem(
            "battleKills"
        ) ||
        "0"
    );

let trophies =
    Number(
        localStorage.getItem(
            "battleTrophies"
        ) ||
        "0"
    );

let trophyRewardTaken =
    localStorage.getItem(
        "trophy100Reward"
    ) === "yes";

let skinCatalog = {};

let botDamage = 0;
let superNeed = 0;

let keyboard = {
    up: false,
    down: false,
    left: false,
    right: false
};

let joyX = 0;
let joyY = 0;

let aimX =
    window.innerWidth * .75;

let aimY =
    window.innerHeight * .5;

const canvas =
    document.getElementById(
        "canvas"
    );

const ctx =
    canvas.getContext(
        "2d"
    );

/* =====================================================
   PROFILE UI
===================================================== */

function updateProfileUI() {

    document.getElementById(
        "menuTrophies"
    ).textContent =
        trophies;

    document.getElementById(
        "menuKills"
    ).textContent =
        kills;

    const skin =
        skinCatalog[
            selectedSkin
        ];

    document.getElementById(
        "menuSkin"
    ).textContent =
        skin
            ? skin.name
            : "Rookie";
}

updateProfileUI();

/* =====================================================
   TUTORIAL
===================================================== */

function openTutorial() {

    if (
        tutorial.length === 0
    ) {

        alert(
            "Tutorial wird vom Server geladen."
        );

        return;
    }

    tutorialIndex = 0;

    document.getElementById(
        "tutorial"
    ).style.display =
        "flex";

    showTutorial();
}

function showTutorial() {

    const step =
        tutorial[
            tutorialIndex
        ];

    if (!step) {
        closeTutorial();
        return;
    }

    document.getElementById(
        "tutorialTitle"
    ).textContent =
        step.title;

    document.getElementById(
        "tutorialText"
    ).textContent =
        step.text;

    document.getElementById(
        "tutorialCount"
    ).textContent =
        `${tutorialIndex + 1} / ${tutorial.length}`;
}

function nextTutorial() {

    tutorialIndex++;

    if (
        tutorialIndex >=
        tutorial.length
    ) {

        closeTutorial();

        localStorage.setItem(
            "tutorialDone",
            "yes"
        );

        return;
    }

    showTutorial();
}

function closeTutorial() {

    document.getElementById(
        "tutorial"
    ).style.display =
        "none";
}

/* =====================================================
   SERVER MESSAGE
===================================================== */

function handleServerMessage(
    data
) {

    if (
        data.type ===
        "tutorial"
    ) {

        tutorial =
            data.tutorial ||
            [];

        skinCatalog =
            {};

        (
            data.skins ||
            []
        ).forEach(
            skin => {

                skinCatalog[
                    skin.id
                ] = skin;
            }
        );

        renderSkins();

        updateProfileUI();

        if (
            !localStorage.getItem(
                "tutorialDone"
            )
        ) {

            openTutorial();
        }
    }

    if (
        data.type ===
        "roomCreated"
    ) {

        roomCode =
            data.code;

        showLobby();
    }

    if (
        data.type ===
        "joinedRoom"
    ) {

        roomCode =
            data.code;

        showLobby();
    }

    if (
        data.type ===
        "errorMessage"
    ) {

        alert(
            data.message
        );
    }

    if (
        data.type ===
        "state"
    ) {

        players = {};

        (
            data.players ||
            []
        ).forEach(
            player => {

                players[
                    player.id
                ] =
                    player;
            }
        );

        bots =
            data.bots ||
            [];

        const me =
            players[
                myId
            ];

        if (me) {

            botDamage =
                me.botDamage ||
                0;

            const skin =
                skinCatalog[
                    me.skin
                ];

            if (skin) {

                superNeed =
                    skin.superNeed ||
                    0;
            }

            document.getElementById(
                "hp"
            ).textContent =
                Math.max(
                    0,
                    Math.round(
                        me.hp
                    )
                );

            document.getElementById(
                "weaponName"
            ).textContent =
                me.weapon;

            document.getElementById(
                "gameKills"
            ).textContent =
                me.kills;

            updateSuper();

            /*
            Falls Server bereits
            einen Skin übernommen hat.
            */

            if (
                selectedSkin !==
                me.skin
            ) {

                selectedSkin =
                    me.skin;

                localStorage.setItem(
                    "battleSkin",
                    selectedSkin
                );

                updateProfileUI();
            }
        }
    }

    if (
        data.type ===
        "bulletSpawn"
    ) {

        bullets.push({

            x:
                data.x,

            y:
                data.y,

            dx:
                data.dx,

            dy:
                data.dy,

            speed:
                data.speed,

            color:
                data.color,

            life:
                Math.ceil(
                    data.speed
                        ? 100
                        : 1
                )
        });
    }

    if (
        data.type ===
        "bulletImpact"
    ) {

        effects.push({

            type:
                "impact",

            x:
                data.x,

            y:
                data.y,

            life:
                14
        });
    }

    if (
        data.type ===
        "bulletHit"
    ) {

        effects.push({

            type:
                "hit",

            x:
                data.x,

            y:
                data.y,

            life:
                18,

            damage:
                data.damage
        });
    }

    if (
        data.type ===
        "meleeEffect"
    ) {

        effects.push({

            type:
                "slash",

            x:
                data.x,

            y:
                data.y,

            life:
                18
        });
    }

    if (
        data.type ===
        "superEffect"
    ) {

        effects.push({

            type:
                "super",

            x:
                data.x,

            y:
                data.y,

            life:
                35
        });
    }

    if (
        data.type ===
        "elimination"
    ) {

        if (
            data.killer ===
            myId
        ) {

            kills++;

            localStorage.setItem(
                "battleKills",
                kills
            );

            document.getElementById(
                "gameKills"
            ).textContent =
                kills;

            /*
            100 Trophäen =
            einmalig +50 Skin-Kills
            */

            if (
                trophies >= 100 &&
                !trophyRewardTaken
            ) {

                trophyRewardTaken =
                    true;

                kills += 50;

                localStorage.setItem(
                    "battleKills",
                    kills
                );

                localStorage.setItem(
                    "trophy100Reward",
                    "yes"
                );

                alert(
                    "🏆 100 Trophäen! +50 Skin-Kills!"
                );

                updateProfileUI();
            }
        }
    }
}

/* =====================================================
   ROOM
===================================================== */

function createRoom() {

    const name =
        document.getElementById(
            "name"
        ).value.trim() ||
        "Player";

    let botCount =
        Number(
            prompt(
                "Wie viele Bots? 0–5",
                "3"
            )
        );

    if (
        !Number.isFinite(
            botCount
        )
    ) {

        botCount = 0;
    }

    botCount =
        Math.max(
            0,
            Math.min(
                5,
                botCount
            )
        );

    send({

        type:
            "createRoom",

        name,

        bots:
            botCount,

        skin:
            selectedSkin
    });
}

function joinRoom() {

    const name =
        document.getElementById(
            "name"
        ).value.trim() ||
        "Player";

    const code =
        document.getElementById(
            "joinCode"
        ).value.trim()
        .toUpperCase();

    if (
        code.length !==
        4
    ) {

        alert(
            "Der Raumcode muss 4 Zeichen haben."
        );

        return;
    }

    send({

        type:
            "joinRoom",

        name,

        code,

        skin:
            selectedSkin
    });
}

function showLobby() {

    document.getElementById(
        "menu"
    ).style.display =
        "none";

    document.getElementById(
        "lobby"
    ).style.display =
        "flex";

    document.getElementById(
        "roomCode"
    ).textContent =
        roomCode;

    document.getElementById(
        "roomTop"
    ).textContent =
        roomCode;

    updateLobby();
}

function copyRoom() {

    if (
        navigator.clipboard
    ) {

        navigator.clipboard.writeText(
            roomCode
        );

        alert(
            "Code kopiert!"
        );
    }
}

function startGame() {

    document.getElementById(
        "lobby"
    ).style.display =
        "none";

    document.getElementById(
        "game"
    ).style.display =
        "block";
}

/* =====================================================
   SKINS
===================================================== */

function openSkins() {

    document.getElementById(
        "skins"
    ).style.display =
        "block";

    renderSkins();
}

function closeSkins() {

    document.getElementById(
        "skins"
    ).style.display =
        "none";
}

function renderSkins() {

    const grid =
        document.getElementById(
            "skinGrid"
        );

    grid.innerHTML =
        "";

    Object.values(
        skinCatalog
    ).forEach(
        skin => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "skin-card";

            const preview =
                document.createElement(
                    "div"
                );

            preview.className =
                "skin-preview";

            const avatar =
                document.createElement(
                    "div"
                );

            avatar.className =
                "avatar-preview";

            avatar.style.background =
                `linear-gradient(
                    145deg,
                    ${skin.color},
                    #111827
                )`;

            const head =
                document.createElement(
                    "div"
                );

            head.className =
                "avatar-head";

            avatar.appendChild(
                head
            );

            preview.appendChild(
                avatar
            );

            const title =
                document.createElement(
                    "h3"
                );

            title.textContent =
                skin.name;

            const rarity =
                document.createElement(
                    "div"
                );

            rarity.className =
                "rarity";

            rarity.textContent =
                skin.rarity;

            const weapon =
                document.createElement(
                    "div"
                );

            weapon.className =
                "weapon-text";

            weapon.textContent =
                "🔫 " +
                skin.weapon;

            const damage =
                document.createElement(
                    "div"
                );

            damage.className =
                "rarity";

            damage.textContent =
                `Schaden +${skin.damageBonus}%`;

            const superText =
                document.createElement(
                    "div"
                );

            superText.className =
                "super-text";

            superText.textContent =
                skin.superNeed > 0
                    ? `⚡ ${skin.super} – ${skin.superNeed} Bot-Schaden`
                    : "⚡ Kein Super";

            const price =
                document.createElement(
                    "div"
                );

            price.className =
                "price";

            price.textContent =
                skin.price === 0
                    ? "Kostenlos"
                    : `Preis: ${skin.price} Kills`;

            const button =
                document.createElement(
                    "button"
                );

            const unlocked =
                kills >=
                skin.price;

            const selected =
                selectedSkin ===
                skin.id;

            if (
                selected
            ) {

                button.textContent =
                    "✓ Ausgewählt";

            } else if (
                unlocked
            ) {

                button.textContent =
                    "Auswählen";

            } else {

                button.textContent =
                    `🔒 ${skin.price} Kills`;
            }

            button.onclick =
                () => {

                    if (
                        !unlocked
                    ) {

                        alert(
                            `Du brauchst ${skin.price} Kills.`
                        );

                        return;
                    }

                    selectedSkin =
                        skin.id;

                    localStorage.setItem(
                        "battleSkin",
                        selectedSkin
                    );

                    updateProfileUI();

                    send({

                        type:
                            "changeSkin",

                        skin:
                            selectedSkin
                    });

                    renderSkins();

                    updateLobby();
                };

            card.appendChild(
                preview
            );

            card.appendChild(
                title
            );

            card.appendChild(
                rarity
            );

            card.appendChild(
                weapon
            );

            card.appendChild(
                damage
            );

            card.appendChild(
                superText
            );

            card.appendChild(
                price
            );

            card.appendChild(
                button
            );

            grid.appendChild(
                card
            );
        }
    );
}

/* =====================================================
   MOBILE JOYSTICK
===================================================== */

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );

let joyActive =
    false;

joystick.addEventListener(
    "pointerdown",
    event => {

        joyActive =
            true;

        joystick.setPointerCapture(
            event.pointerId
        );

        moveJoystick(
            event.clientX,
            event.clientY
        );
    }
);

joystick.addEventListener(
    "pointermove",
    event => {

        if (
            !joyActive
        ) return;

        moveJoystick(
            event.clientX,
            event.clientY
        );
    }
);

joystick.addEventListener(
    "pointerup",
    () => {

        joyActive =
            false;

        joyX = 0;
        joyY = 0;

        stick.style.left =
            "38px";

        stick.style.top =
            "38px";
    }
);

function moveJoystick(
    x,
    y
) {

    const rect =
        joystick.getBoundingClientRect();

    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height / 2;

    let dx =
        x -
        centerX;

    let dy =
        y -
        centerY;

    const max =
        43;

    const d =
        Math.hypot(
            dx,
            dy
        );

    if (
        d >
        max
    ) {

        dx =
            dx / d *
            max;

        dy =
            dy / d *
            max;
    }

    joyX =
        dx / max;

    joyY =
        dy / max;

    stick.style.left =
        38 +
        dx +
        "px";

    stick.style.top =
        38 +
        dy +
        "px";
}

   AIM
===================================================== */

    document.getElementById(
        "aim"
    );

aim.addEventListener(
    "pointerdown",
    event => {

        aim.setPointerCapture(

    }
);

aim.addEventListener(
    "pointermove",
    event => {

        aimX =
            event.clientX;

        aimY =
            event.clientY;
    }
);

window.addEventListener(
    "mousemove",
    event => {

        aimX =
            event.clientX;

        aimY =
            event.clientY;
    }
);

/* =====================================================
   MOVE
===================================================== */

setInterval(
    () => {

        if (
            document.getElementById(
                "game"
            ).style.display !==
            "block"
        ) {
            return;
        }

        let dx = 0;
        let dy = 0;

        if (
            keyboard.up
        ) dy--;

        if (
            keyboard.down
        ) dy++;

        if (
            keyboard.left
        ) dx--;

        if (
            keyboard.right
        ) dx++;

        dx += joyX;
        dy += joyY;

        if (
            dx ||
            dy
        ) {

            send({

                type:
                    "moveIntent",

                dx,
                dy
            });
        }

    },
    1000 / 30
);

/* =====================================================
   SHOOT
===================================================== */

document
    .getElementById(
        "shoot"
    )
    .addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            shoot();
        }
    );

window.addEventListener(
    "mousedown",
    event => {

        if (
            event.button === 0 &&
            document.getElementById(
                "game"
            ).style.display ===
                "block"
        ) {

            shoot();
        }
    }
);

function shoot() {

    const me =
        players[
            myId
        ];

    if (!me) return;

    const centerX =
        window.innerWidth / 2;

    const centerY =
        window.innerHeight / 2;

    let dx =
        aimX -
        centerX;

    let dy =
        aimY -
        centerY;

    if (
        Math.hypot(
            dx,
            dy
        ) < 8
    ) {

        dx =
            joyX ||
            1;

        dy =
            joyY;
    }

    send({

        type:
            "shoot",

        dx,
        dy
    });
}

function useSuper() {

    send({
        type:
            "useSuper"
    });
}

function updateSuper() {

    const fill =
        document.getElementById(
            "super-fill"
        );

    const button =
        document.getElementById(
            "super-button"
        );

    const percent =
        superNeed > 0
            ? Math.min(
                100,
                (
                    botDamage /
                    superNeed
                ) *
                100
            )
            : 0;

    fill.style.width =
        percent +
        "%";

    if (
        superNeed > 0 &&
        botDamage >=
            superNeed
    ) {

        button.classList.add(
            "ready"
        );

    } else {

        button.classList.remove(
            "ready"
        );
    }
}

/* =====================================================
   DRAW
===================================================== */

const walls = [
    { x:100, y:100, w:300, h:45 },
    { x:520, y:100, w:260, h:45 },
    { x:900, y:100, w:300, h:45 },
    { x:1320, y:100, w:200, h:45 },

    { x:180, y:300, w:260, h:45 },
    { x:620, y:270, w:350, h:45 },
    { x:1130, y:300, w:280, h:45 },

    { x:700, y:420, w:220, h:55 },

    { x:100, y:700, w:320, h:45 },
    { x:520, y:720, w:270, h:45 },
    { x:920, y:690, w:300, h:45 },
    { x:1320, y:720, w:200, h:45 }
];

function sx(x) {
    return (
        x /
        1600 *
        canvas.width
    );
}

function sy(y) {
    return (
        y /
        900 *
        canvas.height
    );
}

function skinColor(
    id
) {

    const skin =
        skinCatalog[
            id
        ];

    return skin
        ? skin.color
        : "#38bdf8";
}

function drawArena() {

    const bg =
        ctx.createLinearGradient(
            0,
            0,
            0,
            canvas.height
        );

    bg.addColorStop(
        0,
        "#1f3349"
    );

    bg.addColorStop(
        1,
        "#0b131c"
    );

    ctx.fillStyle =
        bg;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.strokeStyle =
        "rgba(255,255,255,.035)";

    for (
        let x = 0;
        x < canvas.width;
        x += 45
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            canvas.height
        );

        ctx.stroke();
    }

    for (
        let y = 0;
        y < canvas.height;
        y += 45
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            canvas.width,
            y
        );

        ctx.stroke();
    }

    walls.forEach(
        wall => {

            const x =
                sx(wall.x);

            const y =
                sy(wall.y);

            const w =
                sx(wall.w);

            const h =
                sy(wall.h);

            ctx.fillStyle =
                "rgba(0,0,0,.35)";

            ctx.fillRect(
                x + 7,
                y + 9,
                w,
                h
            );

            const grad =
                ctx.createLinearGradient(
                    x,
                    y,
                    x,
                    y + h
                );

            grad.addColorStop(
                0,
                "#7c8da1"
            );

            grad.addColorStop(
                0.5,
                "#475569"
            );

            grad.addColorStop(
                1,
                "#1e293b"
            );

            ctx.fillStyle =
                grad;

            ctx.fillRect(
                x,
                y,
                w,
                h
            );

            ctx.strokeStyle =
                "#b4c0ce";

            ctx.strokeRect(
                x,
                y,
                w,
                h
            );
        }
    );
}

function drawCharacter(
    p
) {

    const x =
        sx(p.x);

    const y =
        sy(p.y);

    const color =
        skinColor(
            p.skin
        );

    /* shadow */

    ctx.beginPath();

    ctx.ellipse(
        x,
        y + 20,
        23,
        9,
        0,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.fill();

    /* body */

    const body =
        ctx.createRadialGradient(
            x - 8,
            y - 8,
            2,
            x + 14,
            y + 18,
            34
        );

    body.addColorStop(
        0,
        "#ffffff"
    );

    body.addColorStop(
        0.18,
        color
    );

    body.addColorStop(
        1,
        "#0f172a"
    );

    ctx.fillStyle =
        body;

    ctx.beginPath();

    ctx.roundRect(
        x - 17,
        y - 8,
        34,
        36,
        10
    );

    ctx.fill();

    /* head */

    const head =
        ctx.createRadialGradient(
            x - 5,
            y - 24,
            2,
            x + 7,
            y - 11,
            20
        );

    head.addColorStop(
        0,
        "#ffe5cc"
    );

    head.addColorStop(
        1,
        "#9b664a"
    );

    ctx.fillStyle =
        head;

    ctx.beginPath();

    ctx.arc(
        x,
        y - 20,
        14,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* weapon */

    ctx.strokeStyle =
        "#e5e7eb";

    ctx.lineWidth =
        6;

    ctx.lineCap =
        "round";

    ctx.beginPath();

    ctx.moveTo(
        x + 9,
        y - 1
    );

    ctx.lineTo(
        x + 34,
        y - 7
    );

    ctx.stroke();

    /* name */

    ctx.font =
        "bold 12px Arial";

    ctx.textAlign =
        "center";

    ctx.fillStyle =
        "white";

    ctx.shadowBlur =
        5;

    ctx.shadowColor =
        "black";

    ctx.fillText(
        p.name ||
            "BOT",
        x,
        y - 43
    );

    ctx.shadowBlur =
        0;

    /* HP */

    ctx.fillStyle =
        "#450a0a";

    ctx.fillRect(
        x - 24,
        y - 36,
        48,
        5
    );

    ctx.fillStyle =
        "#22c55e";

    ctx.fillRect(
        x - 24,
        y - 36,
        48 *
        Math.max(
            0,
            p.hp / 100
        ),
        5
    );

    /* shield */

    if (
        p.shield > 0
    ) {

        ctx.strokeStyle =
            "#38bdf8";

        ctx.lineWidth =
            2;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            29,
            0,
            Math.PI * 2
        );

        ctx.stroke();
    }
}

function renderBullets() {

    bullets =
        bullets.filter(
            bullet => {

                bullet.x +=
                    bullet.dx *
                    bullet.speed /
                    3;

                bullet.y +=
                    bullet.dy *
                    bullet.speed /
                    3;

                bullet.life--;

                const x =
                    sx(
                        bullet.x
                    );

                const y =
                    sy(
                        bullet.y
                    );

                ctx.beginPath();

                ctx.arc(
                    x,
                    y,
                    5,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    bullet.color;

                ctx.shadowBlur =
                    18;

                ctx.shadowColor =
                    bullet.color;

                ctx.fill();

                ctx.shadowBlur =
                    0;

                return (
                    bullet.life >
                    0
                );
            }
        );
}

function renderEffects() {

    effects =
        effects.filter(
            effect => {

                effect.life--;

                const x =
                    sx(
                        effect.x
                    );

                const y =
                    sy(
                        effect.y
                    );

                if (
                    effect.type ===
                    "impact"
                ) {

                    ctx.beginPath();

                    ctx.arc(
                        x,
                        y,
                        8 +
                        (
                            16 -
                            effect.life
                        ) *
                        2,
                        0,
                        Math.PI * 2
                    );

                    ctx.strokeStyle =
                        "#facc15";

                    ctx.lineWidth =
                        3;

                    ctx.stroke();
                }

                if (
                    effect.type ===
                    "hit"
                ) {

                    ctx.beginPath();

                    ctx.arc(
                        x,
                        y,
                        10 +
                        (
                            18 -
                            effect.life
                        ) *
                        2,
                        0,
                        Math.PI * 2
                    );

                    ctx.strokeStyle =
                        "#ef4444";

                    ctx.lineWidth =
                        4;

                    ctx.stroke();
                }

                if (
                    effect.type ===
                    "slash"
                ) {

                    ctx.beginPath();

                    ctx.arc(
                        x,
                        y,
                        50,
                        -0.9,
                        0.9
                    );

                    ctx.strokeStyle =
                        "#ffffff";

                    ctx.lineWidth =
                        8;

                    ctx.stroke();
                }

                if (
                    effect.type ===
                    "super"
                ) {

                    ctx.beginPath();

                    ctx.arc(
                        x,
                        y,
                        25 +
                        (
                            35 -
                            effect.life
                        ) *
                        6,
                        0,
                        Math.PI * 2
                    );

                    ctx.strokeStyle =
                        "#ec4899";

                    ctx.lineWidth =
                        8;

                    ctx.stroke();
                }

                return (
                    effect.life >
                    0
                );
            }
        );
}

function draw() {

    requestAnimationFrame(
        draw
    );

    if (
        document.getElementById(
            "game"
        ).style.display !==
        "block"
    ) {
        return;
    }

    drawArena();

    Object.values(
        players
    ).forEach(
        player => {

            if (
                player.alive
            ) {

                drawCharacter(
                    player
                );
            }
        }
    );

    bots.forEach(
        bot => {

            if (
                bot.alive
            ) {

                drawCharacter(
                    bot
                );
            }
        }
    );

    renderBullets();

    renderEffects();
}

draw();

   CONNECT ID
===================================================== */

const originalOpen =
    socket.onopen;

socket.onopen =
    event => {

        myId =
            socket.id ||
            null;

        if (originalOpen) {
            originalOpen(
                event
            );
        }
    };
